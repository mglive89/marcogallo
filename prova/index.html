<style>
/* Layout: bright training-sheet look. Home = today's circuit drawn as illustrated cards with arrows; tab bar at the bottom; session = camera full screen. */
:root {
  --bg: #f3f5f9;
  --panel: #ffffff;
  --panel-2: #eef1f6;
  --line: #e1e6ee;
  --fg: #16202c;
  --muted: #667283;
  --brass: #2e86de;
  --brass-ink: #ffffff;
  --soft: #e6f1fc;
  --ok: #24a148;
  --bad: #e0473a;
  --warn: #f0a020;
  --shadow: 0 1px 2px rgba(22,32,44,.06), 0 6px 18px rgba(22,32,44,.07);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-cond: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
body.g-f { --brass: #b02a91; --soft: #f8e6f3; }
body.goldtheme { --brass: #c9971c; --soft: #fbf1d6; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, select:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

.screen { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: calc(env(safe-area-inset-top, 0px) + 16px) 32px; display: flex; flex-direction: column; gap: 20px; }
body.tabs .screen { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); }

/* Header */
.mast { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.mast h1 { font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: 1.05; text-transform: uppercase; letter-spacing: .01em; }
.mast .sub { font-size: 14px; color: var(--muted); margin-top: 2px; }
.callsign { font-family: var(--f-cond); font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: right; }
.callsign b { display: block; font-size: 24px; color: var(--fg); letter-spacing: 0; font-variant-numeric: tabular-nums; }
.hello { display: flex; align-items: center; gap: 12px; }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; overflow: hidden; flex: 0 0 auto; border: 2px solid var(--brass); }
.avatar svg { width: 64px; height: 54px; margin-top: 10px; }
.gswitch { display: inline-flex; background: var(--panel-2); border-radius: 999px; padding: 3px; gap: 2px; }
.gswitch button { border: 0; background: none; border-radius: 999px; padding: 6px 12px; font-family: var(--f-cond); font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); min-height: 34px; }
.gswitch button[aria-pressed="true"] { background: var(--brass); color: var(--brass-ink); }

.label { font-family: var(--f-cond); font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.section { display: flex; flex-direction: column; gap: 10px; }
.h2 { font-family: var(--f-display); font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: .01em; }

/* Cards */
.order { background: var(--panel); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); position: relative; }
.order h2 { font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1.1; text-transform: uppercase; }
.order .meta, .meta { color: var(--muted); font-size: 14px; }
.blocks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.blocks li { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-family: var(--f-cond); font-size: 18px; font-weight: 600; }
.blocks li:last-child { border-bottom: 0; }
.blocks li span:last-child { color: var(--brass); font-variant-numeric: tabular-nums; }

/* Today's circuit: illustrated sheet like a printed workout card */
.circuit { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 22px; padding: 4px 2px 6px; }
.step { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; background: none; border: 0; padding: 0; }
.step .figbox { width: 100%; aspect-ratio: 6 / 5; }
.step .figbox svg, .figbox svg { width: 100%; height: 100%; display: block; }
.step b { font-family: var(--f-cond); font-weight: 700; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; line-height: 1.1; margin-top: 4px; }
.step span { font-family: var(--f-cond); font-weight: 800; font-size: 16px; color: var(--brass); letter-spacing: .04em; }
.step .arrow { position: absolute; width: 34px; height: 34px; color: #b7bec8; pointer-events: none; }
.step:nth-child(odd) .arrow { right: -30px; top: 30%; }
.step:nth-child(even) .arrow { left: -30px; bottom: -22px; transform: rotate(130deg); }
.step:last-child .arrow { display: none; }
.restnote { text-align: center; font-size: 13px; color: var(--muted); }

.weeks { display: flex; gap: 6px; }
.wk { flex: 1 1 0; background: var(--panel-2); border-radius: 10px; padding: 6px 8px; font-family: var(--f-cond); font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; flex-direction: column; gap: 4px; align-items: center; }
.wk.now { background: var(--soft); color: var(--fg); }
.dots { display: flex; gap: 4px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid #b7bec8; }
.dots i.done { background: var(--ok); border-color: var(--ok); }

.btn { border: 0; border-radius: 14px; padding: 14px 18px; font-family: var(--f-cond); font-weight: 700; font-size: 19px; letter-spacing: .06em; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; }
.btn.primary { background: var(--brass); color: var(--brass-ink); box-shadow: 0 4px 14px color-mix(in srgb, var(--brass) 35%, transparent); }
.btn.ghost { background: var(--panel); border: 1.5px solid var(--line); color: var(--fg); }
.btn.small { min-height: 44px; padding: 8px 14px; font-size: 16px; border-radius: 12px; }
.btn.big { min-height: 62px; font-size: 22px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 150px; }

/* Exercise grid */
.exlist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ex { display: flex; flex-direction: column; align-items: stretch; gap: 2px; text-align: left; background: var(--panel); border: 0; border-radius: 16px; padding: 10px 12px 12px; box-shadow: var(--shadow); position: relative; }
.ex .figbox { aspect-ratio: 6 / 5; width: 100%; background: linear-gradient(180deg, var(--soft), transparent 80%); border-radius: 12px; }
.ex b { font-family: var(--f-cond); font-size: 18px; font-weight: 700; display: block; line-height: 1.15; text-transform: uppercase; margin-top: 6px; }
.ex small { color: var(--muted); font-size: 13px; line-height: 1.3; }
.ex .go { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; color: var(--brass); font-family: var(--f-cond); font-size: 20px; font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.ex.wide { flex-direction: row; align-items: center; gap: 12px; grid-column: 1 / -1; }
.ex.wide .figbox { width: 96px; flex: 0 0 96px; }
.ex.wide .go { position: static; margin-left: auto; flex: 0 0 auto; }
.ex.locked { opacity: .6; }
.ex.locked .figbox { filter: grayscale(1); }
.ex.locked .go { color: var(--muted); }
.ex .go svg { width: 16px; height: 16px; }

.note { font-size: 13px; color: var(--muted); background: var(--panel-2); border-radius: 10px; padding: 10px 12px; }

/* Briefing */
.brief h2 { font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: 1.05; text-transform: uppercase; }
.brief .goal { font-family: var(--f-cond); font-size: 19px; font-weight: 600; color: var(--brass); }
.demo { background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); padding: 8px 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.demo .figbox { width: 100%; max-width: 360px; margin: 0 auto; aspect-ratio: 6 / 5; }
.demo h3 { font-family: var(--f-display); font-weight: 800; font-size: 22px; text-transform: uppercase; }
.steps { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.steps li::marker { font-family: var(--f-cond); font-weight: 800; color: var(--brass); }
.faults { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.faults li { display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: baseline; font-size: 14px; }
.faults li::before { content: ""; width: 9px; height: 9px; background: var(--bad); border-radius: 50%; }
.camtip { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; background: var(--panel-2); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.camtip svg { width: 56px; height: 42px; }
.back { align-self: flex-start; background: var(--panel); border: 0; border-radius: 999px; box-shadow: var(--shadow); color: var(--fg); font-family: var(--f-cond); font-weight: 700; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; padding: 8px 14px; min-height: 40px; }
.stickybar { position: sticky; bottom: 0; padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px); background: linear-gradient(transparent, var(--bg) 30%); display: flex; flex-direction: column; gap: 8px; }

/* Bottom tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: rgba(255,255,255,.96); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px calc(env(safe-area-inset-bottom, 0px) + 6px); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; min-height: 52px; color: var(--muted); font-family: var(--f-cond); font-weight: 700; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--brass); }

/* Onboarding */
.pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pick button { background: var(--panel); border: 2px solid transparent; border-radius: 18px; box-shadow: var(--shadow); padding: 10px 10px 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.pick button .figbox { width: 100%; aspect-ratio: 6 / 5; }
.pick button b { font-family: var(--f-display); font-weight: 800; font-size: 24px; text-transform: uppercase; }
.pick button.m b { color: #2e86de; } .pick button.f b { color: #b02a91; }
.pick button small { color: var(--muted); font-size: 13px; text-align: center; }

/* Session (camera) stays dark */
#session { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; z-index: 10; color: #f4f6f9; }
.stage { position: relative; flex: 1 1 auto; overflow: hidden; background: #000; }
.stage { --z: 1; }
.stage > video, .stage > canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform: scale(var(--z)); transition: transform .3s ease; }
.stage.mirror > video, .stage.mirror > canvas { transform: scale(calc(var(--z) * -1), var(--z)); }
/* camera frame: a soft glowing border around your own picture */
.stage::before { content: ""; position: absolute; inset: 6px; border-radius: 22px; pointer-events: none; z-index: 4; padding: 3px; background: linear-gradient(140deg, #4aa8ff, #9b8cff 45%, #ff7ac8); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); box-shadow: 0 0 18px rgba(124,160,255,.45); opacity: .95; }
.hud-top { position: absolute; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; background: linear-gradient(rgba(0,0,0,.75), rgba(0,0,0,0)); }
.hud-ex { font-family: var(--f-cond); font-weight: 700; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: #9ccaf5; }
body.g-f .hud-ex { color: #f0a6dc; }
.hud-ex b { display: block; font-size: 24px; letter-spacing: .02em; color: #fff; }
.hud-timer { font-family: var(--f-cond); font-size: 24px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
.counter { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; align-items: flex-end; text-shadow: 0 2px 12px rgba(0,0,0,.8); }
.counter .n { font-family: var(--f-display); font-weight: 800; font-size: 120px; line-height: .9; color: #fff; font-variant-numeric: tabular-nums; }
.counter .of { font-family: var(--f-cond); font-size: 20px; font-weight: 800; letter-spacing: .1em; color: #9ccaf5; text-transform: uppercase; }
body.g-f .counter .of { color: #f0a6dc; }
.counter .n.bump { animation: bump .35s ease-out; }
@keyframes bump { 0% { transform: scale(1.25); color: #7ee29b; } 100% { transform: scale(1); } }
.meter { position: absolute; left: 12px; bottom: 16px; width: 14px; height: 40%; border: 2px solid rgba(255,255,255,.6); border-radius: 8px; overflow: hidden; }
.meter i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--brass); height: 0%; transition: height .08s linear; }
.meter b { position: absolute; left: -2px; right: -2px; height: 2px; background: var(--ok); }
.banner { position: absolute; left: 12px; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 76px); padding: 10px 14px; border-radius: 14px; font-family: var(--f-cond); font-weight: 700; font-size: 23px; line-height: 1.15; text-align: center; background: rgba(15,20,28,.82); border: 2px solid rgba(255,255,255,.2); color: #fff; }
.banner.ok { border-color: var(--ok); }
.banner.bad { border-color: var(--bad); background: rgba(120,24,16,.88); }
.banner.warn { border-color: var(--warn); }
.loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; color: #fff; background: rgba(0,0,0,.72); font-family: var(--f-cond); font-size: 19px; }
.loading .bar { width: min(260px, 70vw); height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
.loading .bar i { display: block; height: 100%; width: 30%; background: var(--brass); animation: slide 1.1s ease-in-out infinite alternate; }
@keyframes slide { from { transform: translateX(-30%); } to { transform: translateX(260%); } }
.dock { flex: 0 0 auto; background: #0d1117; padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 10px); display: flex; gap: 8px; align-items: center; }
.dock .btn { flex: 1 1 auto; }
.dock .btn.ghost { background: #1b222c; border-color: #2b3440; color: #fff; }

.rest { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #f3f5f9; color: var(--fg); padding: 24px; text-align: center; }
.rest .label { color: var(--muted); }
.rest .big { font-family: var(--f-display); font-weight: 800; font-size: 96px; color: var(--brass); font-variant-numeric: tabular-nums; line-height: 1; }
.rest .next { font-family: var(--f-cond); font-size: 22px; font-weight: 700; text-transform: uppercase; }
.rest .figbox { width: min(300px, 70vw); aspect-ratio: 6 / 5; }

/* Summary */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--panel); border-radius: 16px; box-shadow: var(--shadow); padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--f-display); font-weight: 800; font-size: 36px; font-variant-numeric: tabular-nums; line-height: 1; color: var(--brass); }
.stat span { font-family: var(--f-cond); font-weight: 600; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; font-size: 15px; background: var(--panel); border-radius: 16px; box-shadow: var(--shadow); padding: 4px 14px; }
.log li { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.log li:last-child { border-bottom: 0; }
.log li span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); }

.toggle { display: flex; align-items: center; gap: 12px; font-size: 15px; background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); padding: 12px 14px; min-height: 52px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--brass); flex: 0 0 auto; }

/* Duel */
.stage .opp { position: absolute; right: 14px; top: calc(env(safe-area-inset-top, 0px) + 70px); width: 44%; max-width: 300px; aspect-ratio: 3 / 4; border: 3px solid transparent; border-radius: 18px; overflow: hidden; background: linear-gradient(#000, #000) padding-box, linear-gradient(150deg, #ffb347, #ff5e8a 55%, #b45cff) border-box; box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 0 22px rgba(255,94,138,.55), 0 10px 26px rgba(0,0,0,.6); z-index: 6; }
.stage .opp::after { content: "VS"; position: absolute; left: 8px; top: 8px; padding: 2px 8px; border-radius: 999px; font-family: var(--f-display); font-weight: 800; font-size: 14px; letter-spacing: .08em; color: #fff; background: linear-gradient(135deg, #ff5e8a, #b45cff); box-shadow: 0 2px 8px rgba(0,0,0,.4); }
.stage .opp video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.oppTag { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; padding: 4px 8px; background: rgba(0,0,0,.7); font-family: var(--f-cond); font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #fff; }
.oppTag span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.oppTag b { font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: 1; color: #fff; font-variant-numeric: tabular-nums; }
/* random invite card + duel effects */
.invite.rnd { overflow: hidden; animation: rndIn .5s cubic-bezier(.2,1.4,.4,1); }
.invite.rnd .rnd-h { display: flex; align-items: center; gap: 12px; }
.invite.rnd .rnd-h > div { flex: 1 1 auto; min-width: 0; }
.invite.rnd small { display: block; font-family: var(--f-cond); font-weight: 700; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--brass); }
.invite.rnd b { font-family: var(--f-display); font-weight: 800; font-size: 24px; line-height: 1.05; }
.rnd-ico { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--brass); color: #fff; animation: rndRing 1.2s ease-in-out infinite; }
.rnd-ico svg { width: 24px; height: 24px; }
.rnd-time { position: absolute; left: 0; bottom: 0; height: 4px; width: 100%; background: var(--brass); transform-origin: left; animation: rndTime 40s linear forwards; }
@keyframes rndIn { from { transform: translateY(120%) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes rndRing { 0%, 100% { box-shadow: 0 0 0 0 rgba(46,134,222,.6); transform: rotate(0); } 10% { transform: rotate(-14deg); } 20% { transform: rotate(14deg); } 30% { transform: rotate(0); } 60% { box-shadow: 0 0 0 14px transparent; } }
@keyframes rndTime { to { transform: scaleX(0); } }
.dfx { position: absolute; pointer-events: none; z-index: 6; }

/* ---------- Effetti grafici (Profilo › Grafica ed effetti): fx-full, fx-lite, fx-off ---------- */

  background: radial-gradient(28vmax 28vmax at 18% 22%, color-mix(in srgb, var(--brass) 16%, transparent), transparent 70%),
              radial-gradient(24vmax 24vmax at 82% 38%, color-mix(in srgb, var(--brass) 11%, transparent), transparent 70%),

/* screen transitions */

@keyframes fxZoom { from { transform: scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }

@keyframes fxFade { from { opacity: 0; } to { opacity: 1; } }
/* cards rise one after the other, tilted back in 3D */

  text-shadow: 0 1px 0 #c9d2de, 0 2px 0 #b9c3d1, 0 3px 0 #aab5c5, 0 4px 0 #9aa6b6, 0 8px 14px rgba(22,32,44,.25); animation: fxLogo .8s cubic-bezier(.3,1.4,.5,1) both; }

body.fx-off *, body.fx-off *::before, body.fx-off *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }

/* ---------- Look professionale: copertina in home, pagina di benvenuto, tab bar flottante, tema scuro ---------- */
:root { --hero1: #0a1424; --hero2: #123a6e; --glowA: rgba(74,168,255,.55); --glowB: rgba(74,168,255,.18); }
body.g-f { --hero2: #5a1752; --glowA: rgba(255,106,213,.5); --glowB: rgba(255,106,213,.16); }
body.goldtheme { --hero2: #5a420c; --glowA: rgba(255,211,107,.5); --glowB: rgba(255,211,107,.16); }

.hero { position: relative; overflow: hidden; isolation: isolate; border-radius: 26px; padding: 20px 18px 18px; color: #fff;
  background: radial-gradient(90% 80% at 80% 30%, var(--glowA), transparent 62%), linear-gradient(155deg, var(--hero1) 15%, var(--hero2) 100%);
  box-shadow: 0 22px 44px -16px rgba(10,20,36,.65); display: grid; grid-template-columns: minmax(0, 1fr) 46%; gap: 8px 6px; }
.hero::after { content: ""; position: absolute; z-index: -1; left: -30%; top: -60%; width: 70%; height: 220%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.07), transparent); transform: rotate(18deg); }
.hero .hi { font-size: 15px; color: rgba(255,255,255,.75); }
.hero h1 { font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: 1; text-transform: uppercase; letter-spacing: .01em; margin-top: 2px; overflow-wrap: anywhere; }
.hero .chip { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 4px 10px 4px 6px; border-radius: 999px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); font-family: var(--f-cond); font-weight: 700; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.hero .chip .rk { background: rgba(255,255,255,.9); }
.hero .ringwrap { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.hero .ring { position: relative; width: 62px; height: 62px; flex: 0 0 auto; }
.hero .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.hero .ring .bgc { fill: none; stroke: rgba(255,255,255,.14); stroke-width: 6; }
.hero .ring .fgc { fill: none; stroke: url(#ringGrad); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 163.4; }
body:not(.fx-off) .hero .ring .fgc { animation: fxRingIn 1.3s cubic-bezier(.2,.8,.2,1) .35s both; }
@keyframes fxRingIn { from { stroke-dashoffset: 163.4; } }
.hero .ring b { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
.hero .ringwrap small { font-family: var(--f-cond); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.7); line-height: 1.2; }
.hero .ringwrap small b { display: block; color: #fff; font-size: 17px; letter-spacing: .02em; }
.hero-fig { position: relative; align-self: center; }
.hero-fig::before { content: ""; position: absolute; left: 8%; right: 8%; bottom: 2%; height: 30%; border-radius: 50%; background: radial-gradient(closest-side, var(--glowA), transparent); filter: blur(4px); }
.hero-fig .figbox { position: relative; width: 100%; aspect-ratio: 6 / 5; filter: drop-shadow(0 10px 14px rgba(0,0,0,.35)); transform: scale(1.35); transform-origin: 50% 85%; }
.hero-cta { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 12px; margin-top: 4px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.12); }
.hero .today small { display: block; font-family: var(--f-cond); font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.65); }
.hero .today b { display: block; font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1.05; text-transform: uppercase; }
.hero .today span { font-size: 14px; color: rgba(255,255,255,.75); }
.hero .btn.primary { background: #fff; color: var(--hero1); box-shadow: 0 5px 0 rgba(255,255,255,.35), 0 12px 28px var(--glowA); }
.hero .btn.primary .play { width: 26px; height: 26px; border-radius: 50%; background: var(--brass); display: grid; place-items: center; }
.hero .btn.primary .play svg { width: 11px; height: 11px; margin-left: 2px; fill: #fff; }
.hero .pt { position: absolute; z-index: -1; width: 5px; height: 5px; border-radius: 50%; background: #fff; opacity: 0; left: var(--x); bottom: -10px; box-shadow: 0 0 8px #fff; }
body.fx-full .hero .pt { animation: fxRiseUp var(--d) linear infinite; animation-delay: var(--w); }
@keyframes fxRiseUp { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .7; } 100% { transform: translateY(-340px); opacity: 0; } }

/* welcome page */
body.landing-on { background: var(--hero1); }
body.landing-on::before { display: none; }
.landing { color: #fff; min-height: 100vh; position: relative; isolation: isolate; padding-top: calc(env(safe-area-inset-top, 0px) + 22px); }
.landing::before { content: ""; position: fixed; z-index: -1; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(70% 45% at 25% 22%, rgba(74,168,255,.42), transparent 70%), radial-gradient(60% 40% at 80% 30%, rgba(255,106,213,.36), transparent 70%), linear-gradient(180deg, #0a1424, #0d1b33 60%, #0a1424); }
.landing .brand { font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; text-align: center; }

.land-figs { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin: 0 -8px; }
.land-figs .figbox { aspect-ratio: 6 / 5; filter: drop-shadow(0 14px 18px rgba(0,0,0,.45)); }
.land-h { font-family: var(--f-display); font-weight: 800; font-size: 40px; line-height: .98; text-transform: uppercase; text-align: center; letter-spacing: .005em;
  background: linear-gradient(100deg, #ffffff 30%, #a9d4ff 60%, #ffb3ea 90%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.land-p { text-align: center; color: rgba(255,255,255,.78); font-size: 16px; max-width: 460px; margin: 0 auto; }

.feats li { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 12px 6px; border-radius: 16px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); font-family: var(--f-cond); font-weight: 700; font-size: 14px; line-height: 1.15; letter-spacing: .03em; text-transform: uppercase; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.feats li svg { width: 28px; height: 28px; color: #6cb8ff; }
.landing .label { color: rgba(255,255,255,.65); }
.landing .h2 { text-align: center; }
.landing .field input { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.2); color: #fff; }
.landing .field input::placeholder { color: rgba(255,255,255,.45); }
.landing .pick button { background: rgba(255,255,255,.08); border: 1.5px solid rgba(255,255,255,.16); box-shadow: 0 12px 30px rgba(0,0,0,.35); color: #fff; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.landing .pick button.m b { color: #6cb8ff; } .landing .pick button.f b { color: #ff8be0; }
.landing .pick button small { color: rgba(255,255,255,.7); }
.landing .pick button .go-pill { margin-top: 4px; padding: 6px 14px; border-radius: 999px; background: #fff; color: #0a1424; font-family: var(--f-cond); font-weight: 800; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; }
.land-note { text-align: center; font-size: 13px; color: rgba(255,255,255,.6); }

/* floating tab bar */
.tabbar { left: 10px; right: 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); max-width: 620px; margin: 0 auto; border-radius: 24px; border: 1px solid var(--line); padding: 6px; background: rgba(255,255,255,.9); box-shadow: 0 12px 32px rgba(22,32,44,.18); }
.tabbar button { border-radius: 18px; transition: background .25s, color .25s; }
.tabbar button[aria-current="page"] { background: var(--soft); }
body:not(.fx-off) .tabbar button[aria-current="page"]::after { display: none; }
body.tabs .screen { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 110px); }

/* finishing touches */
body.fx-full .btn.primary::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; pointer-events: none; background: linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent); transform: skewX(-20deg); animation: fxShine 3.8s ease-in-out infinite; }
.hero .btn.primary::after { background: linear-gradient(100deg, transparent, rgba(120,180,255,.35), transparent) !important; }
@keyframes fxShine { 0%, 55% { left: -60%; } 100% { left: 130%; } }
body:not(.fx-off) .xp i { transform-origin: left; animation: fxGrow 1.2s cubic-bezier(.2,.8,.2,1) .3s both; }
@keyframes fxGrow { from { transform: scaleX(0); } }
.order { overflow: hidden; }
.order::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: linear-gradient(90deg, var(--brass), var(--glowA)); }
.section > .label::before { content: ""; display: inline-block; width: 14px; height: 3px; border-radius: 2px; background: var(--brass); vertical-align: middle; margin: -2px 8px 0 0; }

/* dark theme (Profilo › Tema) */
body.dark { --bg: #0b1220; --panel: #151e2d; --panel-2: #1c2738; --line: #27344b; --fg: #eef2f8; --muted: #9aa8bb; --soft: rgba(74,168,255,.16); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.35); color-scheme: dark; }
body.dark.g-f { --soft: rgba(255,106,213,.16); }
body.dark.goldtheme { --soft: rgba(255,211,107,.16); }
body.dark .tabbar { background: rgba(21,30,45,.92); box-shadow: 0 12px 32px rgba(0,0,0,.5); }
body.dark .rest { background: var(--bg); }
body.dark .step .arrow, body.dark .dots i { color: #4b5a72; border-color: #4b5a72; }
body.dark #splash { background: radial-gradient(120% 80% at 50% 30%, #1a2740, #0b1220 70%); }
body.dark #splash .sp-logo { color: #eef2f8; text-shadow: 0 1px 0 #2a3a55, 0 2px 0 #22314a, 0 3px 0 #1b2840, 0 4px 0 #142035, 0 8px 14px rgba(0,0,0,.5); }
body.dark .pick button.m b { color: #6cb8ff; } body.dark .pick button.f b { color: #ff8be0; }

/* start screen: free beta + sign-in coming at launch */
.beta-tag { display: inline-block; vertical-align: middle; margin-left: 6px; padding: 2px 8px; border-radius: 999px; background: linear-gradient(135deg, #ffd166, #ff8be0); color: #0a1424; font-size: 12px; letter-spacing: .1em; }
.auth { display: flex; flex-direction: column; gap: 10px; }
.btn.beta { width: 100%; color: #0a1424; background: linear-gradient(100deg, #7ee29b, #6cb8ff 55%, #ff8be0); box-shadow: 0 6px 0 rgba(0,0,0,.25), 0 14px 34px rgba(108,184,255,.45); font-size: 23px; }

.sso.google { background: #fff; color: #1f1f1f; }
.sso em { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-style: normal; font-family: var(--f-cond); font-weight: 700; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: rgba(127,127,127,.22); }

.landing .back { background: rgba(255,255,255,.1); color: #fff; box-shadow: none; }
@media (max-width: 360px) { .sso { font-size: 15px; } .sso em { display: none; } }
/* FitQuest start page */
.landing.fq::before { background: radial-gradient(80% 40% at 50% 22%, #263662, transparent 75%), linear-gradient(180deg, #14223f, #1d2a4d 45%, #1a2646 80%, #15223f); }
body.landing-on:has(.fq) { background: #15223f; }
.fq { text-align: center; }
.fq-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.crown { display: inline-flex; align-items: center; gap: 1px; margin-left: 4px; vertical-align: middle; position: relative; }
.crown svg { width: 20px; height: 15px; filter: drop-shadow(0 0 3px rgba(255,200,40,.75)); animation: crownGlow 2.4s ease-in-out infinite; }
.crown i { font-style: normal; font-family: var(--f-cond); font-weight: 800; font-size: 12px; color: #c98a06; }
.crown .cr-sh, .cw-crown .cr-sh { animation: crownShine 2.8s ease-in-out infinite; }
@keyframes crownGlow { 0%, 100% { filter: drop-shadow(0 0 2px rgba(255,200,40,.55)); } 50% { filter: drop-shadow(0 0 6px rgba(255,215,80,1)); } }
@keyframes crownShine { 0%, 50% { transform: translateX(0); } 100% { transform: translateX(110px); } }
.crown-hint { display: flex; align-items: center; gap: 8px; justify-content: center; }
.crown-hint svg { width: 22px; height: 17px; opacity: .8; }
.crown-win { position: relative; display: grid; justify-items: center; text-align: center; gap: 6px; padding: 26px 16px 18px; margin: 4px 0 14px; border-radius: 22px; overflow: hidden; color: #fff; background: radial-gradient(120% 90% at 50% 20%, #3a2a05 0%, #160f02 70%); box-shadow: 0 10px 30px rgba(120,80,0,.35), inset 0 0 0 1px rgba(255,215,90,.35); }
.crown-win b { font-family: var(--f-display); font-size: 26px; letter-spacing: .02em; text-transform: uppercase; color: #ffe17a; text-shadow: 0 0 14px rgba(255,200,60,.6); position: relative; }

.cw-rays { position: absolute; left: 50%; top: 70px; width: 420px; height: 420px; margin: -210px 0 0 -210px; background: repeating-conic-gradient(rgba(255,214,90,.22) 0 8deg, transparent 8deg 22deg); -webkit-mask: radial-gradient(circle, #000 0, transparent 65%); mask: radial-gradient(circle, #000 0, transparent 65%); animation: cwSpin 14s linear infinite; }
.cw-crown { position: relative; width: 132px; height: 99px; animation: cwDrop .9s cubic-bezier(.2,1.5,.4,1) both, cwFloat 3s ease-in-out .9s infinite; }
.cw-crown svg { width: 100%; height: 100%; filter: drop-shadow(0 0 10px rgba(255,210,70,.95)) drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
.cw-crown .sp { position: absolute; width: 16px; height: 16px; background: radial-gradient(circle, #fff 0 18%, transparent 20%), linear-gradient(#fff, #fff) center / 2px 100% no-repeat, linear-gradient(#fff, #fff) center / 100% 2px no-repeat; filter: drop-shadow(0 0 4px #ffe58a); opacity: 0; animation: cwTwinkle 1.8s ease-in-out infinite; }
.cw-crown .s1 { left: 6px; top: 8px; animation-delay: .9s; } .cw-crown .s2 { right: 2px; top: 22px; animation-delay: 1.3s; }
.cw-crown .s3 { left: 52px; top: -10px; animation-delay: 1.7s; } .cw-crown .s4 { right: 30px; bottom: 6px; animation-delay: 2.2s; }
.crown-win:not(.mine) .cw-crown svg { filter: drop-shadow(0 0 6px rgba(255,210,70,.6)) saturate(.8); }
@keyframes cwDrop { from { transform: translateY(-80px) scale(.4) rotate(-20deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes cwFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes cwSpin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) { .crown svg, .cr-sh, .cw-rays, .cw-crown, .cw-crown .sp { animation: none !important; } .cw-crown .sp { opacity: 1; } }
.dz { gap: 16px; }
.dz-hero { position: relative; overflow: hidden; border-radius: 26px; padding: 20px 18px 18px; color: #fff; background: radial-gradient(120% 80% at 50% 0%, #2a4a9a 0%, #141d3d 55%, #0b1024 100%); box-shadow: 0 18px 40px rgba(20,30,80,.35), inset 0 0 0 1px rgba(255,255,255,.08); }

  ["Una fascia elastica o un elastico con maniglie. Scegli una resistenza con cui fai tutte le ripetizioni bene.", "A resistance band or a tube with handles. Pick a resistance you can do every rep well with.", "Una banda el\xE1stica o un tubo con asas. Elige una resistencia con la que hagas bien todas las repeticiones.", "Une bande \xE9lastique ou un \xE9lastique \xE0 poign\xE9es. Choisis une r\xE9sistance avec laquelle tu fais bien toutes les r\xE9p\xE9titions.", "Ein Widerstandsband oder eine Tube mit Griffen. W\xE4hle einen Widerstand, mit dem du alle Wiederholungen sauber schaffst.", "Uma faixa el\xE1stica ou um el\xE1stico com al\xE7as. Escolha uma resist\xEAncia com a qual fa\xE7a bem todas as repeti\xE7\xF5es."],

  ["Telefono a terra, di lato, a circa 2\u20133 metri. Devi vedere testa e piedi.", "Phone on the floor, to your side, about 2\u20133 metres away. You must see head and feet.", "Tel\xE9fono en el suelo, de lado, a unos 2\u20133 metros. Debes verte la cabeza y los pies.", "T\xE9l\xE9phone au sol, de c\xF4t\xE9, \xE0 environ 2\u20133 m\xE8tres. On doit voir ta t\xEAte et tes pieds.", "Handy auf dem Boden, seitlich, etwa 2\u20133 Meter entfernt. Kopf und F\xFC\xDFe m\xFCssen sichtbar sein.", "Telefone no ch\xE3o, de lado, a uns 2\u20133 metros. Voc\xEA deve ver cabe\xE7a e p\xE9s."],
  ["Telefono a terra o su un mobile, di lato, a circa 2 metri. Devi vedere braccio e busto.", "Phone on the floor or on furniture, to your side, about 2 metres away. You must see arm and torso.", "Tel\xE9fono en el suelo o en un mueble, de lado, a unos 2 metros. Debes verte el brazo y el tronco.", "T\xE9l\xE9phone au sol ou sur un meuble, de c\xF4t\xE9, \xE0 environ 2 m\xE8tres. On doit voir ton bras et ton buste.", "Handy auf dem Boden oder einem M\xF6bel, seitlich, etwa 2 Meter entfernt. Arm und Oberk\xF6rper m\xFCssen sichtbar sein.", "Telefone no ch\xE3o ou num m\xF3vel, de lado, a uns 2 metros. Voc\xEA deve ver bra\xE7o e tronco."],
  ["Telefono davanti a te, a circa 2 metri. Devi vedere te con le braccia alzate.", "Phone in front of you, about 2 metres away. You must be visible with arms raised.", "Tel\xE9fono delante de ti, a unos 2 metros. Debes verte con los brazos levantados.", "T\xE9l\xE9phone devant toi, \xE0 environ 2 m\xE8tres. On doit te voir bras lev\xE9s.", "Handy vor dir, etwa 2 Meter entfernt. Du musst mit erhobenen Armen sichtbar sein.", "Telefone \xE0 sua frente, a uns 2 metros. Voc\xEA deve aparecer com os bra\xE7os levantados."],
  ["Telefono a terra, di lato, a circa 2 metri. Devi vedere busto e braccia.", "Phone on the floor, to your side, about 2 metres away. You must see torso and arms.", "Tel\xE9fono en el suelo, de lado, a unos 2 metros. Debes verte el tronco y los brazos.", "T\xE9l\xE9phone au sol, de c\xF4t\xE9, \xE0 environ 2 m\xE8tres. On doit voir ton buste et tes bras.", "Handy auf dem Boden, seitlich, etwa 2 Meter entfernt. Oberk\xF6rper und Arme m\xFCssen sichtbar sein.", "Telefone no ch\xE3o, de lado, a uns 2 metros. Voc\xEA deve ver tronco e bra\xE7os."],
  ["Telefono davanti a te, a circa 2 metri. Devi vedere busto e braccia.", "Phone in front of you, about 2 metres away. You must see torso and arms.", "Tel\xE9fono delante de ti, a unos 2 metros. Debes verte el tronco y los brazos.", "T\xE9l\xE9phone devant toi, \xE0 environ 2 m\xE8tres. On doit voir ton buste et tes bras.", "Handy vor dir, etwa 2 Meter entfernt. Oberk\xF6rper und Arme m\xFCssen sichtbar sein.", "Telefone \xE0 sua frente, a uns 2 metros. Voc\xEA deve ver tronco e bra\xE7os."],
  ["Telefono a terra, di lato, a circa 2 metri.", "Phone on the floor, to your side, about 2 metres away.", "Tel\xE9fono en el suelo, de lado, a unos 2 metros.", "T\xE9l\xE9phone au sol, de c\xF4t\xE9, \xE0 environ 2 m\xE8tres.", "Handy auf dem Boden, seitlich, etwa 2 Meter entfernt.", "Telefone no ch\xE3o, de lado, a uns 2 metros."],
  ["Elastico sotto i piedi, estremit\xE0 in mano all'altezza delle spalle.", "Band under your feet, ends in your hands at shoulder height.", "Banda bajo los pies, extremos en las manos a la altura de los hombros.", "\xC9lastique sous les pieds, extr\xE9mit\xE9s en main \xE0 hauteur des \xE9paules.", "Band unter den F\xFC\xDFen, Enden in den H\xE4nden auf Schulterh\xF6he.", "El\xE1stico sob os p\xE9s, pontas nas m\xE3os \xE0 altura dos ombros."],
  ["Piedi alla larghezza delle spalle, petto alto.", "Feet shoulder-width apart, chest up.", "Pies a la anchura de los hombros, pecho arriba.", "Pieds \xE9cart\xE9s largeur d'\xE9paules, poitrine haute.", "F\xFC\xDFe schulterbreit, Brust raus.", "P\xE9s na largura dos ombros, peito alto."],
  ["Scendi finch\xE9 le cosce sono parallele al suolo.", "Lower until your thighs are parallel to the floor.", "Baja hasta que los muslos est\xE9n paralelos al suelo.", "Descends jusqu'\xE0 ce que les cuisses soient parall\xE8les au sol.", "Geh runter, bis die Oberschenkel parallel zum Boden sind.", "Des\xE7a at\xE9 as coxas ficarem paralelas ao ch\xE3o."],
  ["Risali spingendo sui talloni contro la resistenza.", "Push back up through your heels against the resistance.", "Sube empujando con los talones contra la resistencia.", "Remonte en poussant sur les talons contre la r\xE9sistance.", "Dr\xFCck dich \xFCber die Fersen gegen den Widerstand hoch.", "Suba empurrando com os calcanhares contra a resist\xEAncia."],
  ["Elastico sotto i piedi, un capo per mano, braccia distese.", "Band under your feet, one end in each hand, arms straight.", "Banda bajo los pies, un extremo en cada mano, brazos estirados.", "\xC9lastique sous les pieds, une extr\xE9mit\xE9 par main, bras tendus.", "Band unter den F\xFC\xDFen, ein Ende pro Hand, Arme gestreckt.", "El\xE1stico sob os p\xE9s, uma ponta em cada m\xE3o, bra\xE7os estendidos."],
  ["Gomiti fermi ai fianchi.", "Elbows still at your sides.", "Codos quietos junto al cuerpo.", "Coudes fixes le long du corps.", "Ellbogen ruhig an den Seiten.", "Cotovelos parados junto ao corpo."],
  ["Piega i gomiti e porta le mani verso le spalle.", "Bend your elbows and bring your hands to your shoulders.", "Dobla los codos y lleva las manos hacia los hombros.", "Plie les coudes et am\xE8ne les mains vers les \xE9paules.", "Beuge die Ellbogen und f\xFChre die H\xE4nde zu den Schultern.", "Dobre os cotovelos e leve as m\xE3os aos ombros."],
  ["Torna gi\xF9 lentamente fino a braccia distese.", "Lower slowly until your arms are straight.", "Baja despacio hasta estirar los brazos.", "Redescends lentement jusqu'aux bras tendus.", "Langsam zur\xFCck, bis die Arme gestreckt sind.", "Des\xE7a devagar at\xE9 os bra\xE7os estendidos."],
  ["Gomiti che si spostano in avanti", "Elbows drifting forward", "Codos que se van hacia delante", "Coudes qui avancent", "Ellbogen wandern nach vorn", "Cotovelos indo para a frente"],
  ["Mani non portate alle spalle (non conta)", "Hands not brought to shoulders (doesn't count)", "Manos no llevadas a los hombros (no cuenta)", "Mains pas amen\xE9es aux \xE9paules (ne compte pas)", "H\xE4nde nicht bis zu den Schultern (z\xE4hlt nicht)", "M\xE3os n\xE3o levadas aos ombros (n\xE3o conta)"],
  ["Elastico sotto i piedi, mani all'altezza delle spalle.", "Band under your feet, hands at shoulder height.", "Banda bajo los pies, manos a la altura de los hombros.", "\xC9lastique sous les pieds, mains \xE0 hauteur des \xE9paules.", "Band unter den F\xFC\xDFen, H\xE4nde auf Schulterh\xF6he.", "El\xE1stico sob os p\xE9s, m\xE3os \xE0 altura dos ombros."],
  ["Addome contratto, schiena dritta.", "Core tight, back straight.", "Abdomen contra\xEDdo, espalda recta.", "Abdos serr\xE9s, dos droit.", "Bauch fest, R\xFCcken gerade.", "Abd\xF4men contra\xEDdo, costas retas."],
  ["Spingi le mani in alto fino a braccia tese.", "Press your hands up until your arms are straight.", "Empuja las manos hacia arriba hasta estirar los brazos.", "Pousse les mains vers le haut jusqu'aux bras tendus.", "Dr\xFCck die H\xE4nde nach oben, bis die Arme gestreckt sind.", "Empurre as m\xE3os para cima at\xE9 esticar os bra\xE7os."],
  ["Torna gi\xF9 controllando fino alle spalle.", "Lower with control back to your shoulders.", "Baja con control hasta los hombros.", "Redescends en contr\xF4lant jusqu'aux \xE9paules.", "Kontrolliert zur\xFCck auf Schulterh\xF6he.", "Des\xE7a com controle at\xE9 os ombros."],
  ["Braccia non tese in alto (non conta)", "Arms not straight overhead (doesn't count)", "Brazos no estirados arriba (no cuenta)", "Bras pas tendus en haut (ne compte pas)", "Arme oben nicht gestreckt (z\xE4hlt nicht)", "Bra\xE7os n\xE3o esticados em cima (n\xE3o conta)"],
  ["Seduto a terra, gambe distese, elastico attorno ai piedi.", "Sit on the floor, legs straight, band around your feet.", "Sentado en el suelo, piernas estiradas, banda alrededor de los pies.", "Assis au sol, jambes tendues, \xE9lastique autour des pieds.", "Auf dem Boden sitzen, Beine gestreckt, Band um die F\xFC\xDFe.", "Sentado no ch\xE3o, pernas estendidas, el\xE1stico em volta dos p\xE9s."],
  ["Busto dritto, braccia tese in avanti.", "Torso upright, arms straight in front.", "Tronco recto, brazos estirados hacia delante.", "Buste droit, bras tendus devant.", "Oberk\xF6rper aufrecht, Arme nach vorn gestreckt.", "Tronco reto, bra\xE7os esticados \xE0 frente."],
  ["Tira l'elastico portando i gomiti indietro vicino ai fianchi.", "Pull the band, bringing your elbows back close to your sides.", "Tira de la banda llevando los codos atr\xE1s junto al cuerpo.", "Tire l'\xE9lastique en ramenant les coudes pr\xE8s du corps.", "Zieh das Band und f\xFChre die Ellbogen eng am K\xF6rper nach hinten.", "Puxe o el\xE1stico levando os cotovelos para tr\xE1s junto ao corpo."],
  ["Torna avanti lentamente fino a braccia tese.", "Return slowly until your arms are straight.", "Vuelve despacio hasta estirar los brazos.", "Reviens lentement jusqu'aux bras tendus.", "Langsam zur\xFCck, bis die Arme gestreckt sind.", "Volte devagar at\xE9 os bra\xE7os esticados."],
  ["Busto che si inclina indietro", "Torso leaning back", "Tronco que se inclina hacia atr\xE1s", "Buste qui part en arri\xE8re", "Oberk\xF6rper kippt nach hinten", "Tronco inclinando para tr\xE1s"],
  ["Gomiti non portati indietro (non conta)", "Elbows not pulled back (doesn't count)", "Codos no llevados atr\xE1s (no cuenta)", "Coudes pas ramen\xE9s en arri\xE8re (ne compte pas)", "Ellbogen nicht zur\xFCckgezogen (z\xE4hlt nicht)", "Cotovelos n\xE3o puxados para tr\xE1s (n\xE3o conta)"],
  ["In piedi, braccia tese davanti al petto, elastico tra le mani.", "Stand, arms straight in front of your chest, band between your hands.", "De pie, brazos estirados delante del pecho, banda entre las manos.", "Debout, bras tendus devant la poitrine, \xE9lastique entre les mains.", "Im Stand, Arme vor der Brust gestreckt, Band zwischen den H\xE4nden.", "Em p\xE9, bra\xE7os esticados \xE0 frente do peito, el\xE1stico entre as m\xE3os."],
  ["Spalle basse, lontane dalle orecchie.", "Shoulders down, away from your ears.", "Hombros bajos, lejos de las orejas.", "\xC9paules basses, loin des oreilles.", "Schultern tief, weg von den Ohren.", "Ombros baixos, longe das orelhas."],
  ["Apri le braccia di lato tirando l'elastico verso il petto.", "Open your arms to the sides, pulling the band to your chest.", "Abre los brazos a los lados llevando la banda al pecho.", "Ouvre les bras sur les c\xF4t\xE9s en tirant l'\xE9lastique vers la poitrine.", "\xD6ffne die Arme seitlich und zieh das Band zur Brust.", "Abra os bra\xE7os para os lados puxando o el\xE1stico at\xE9 o peito."],
  ["Torna al centro lentamente.", "Return to the centre slowly.", "Vuelve al centro despacio.", "Reviens au centre lentement.", "Langsam zur\xFCck zur Mitte.", "Volte ao centro devagar."],
  ["Braccia non aperte abbastanza (non conta)", "Arms not opened enough (doesn't count)", "Brazos no abiertos lo suficiente (no cuenta)", "Bras pas assez ouverts (ne compte pas)", "Arme nicht weit genug ge\xF6ffnet (z\xE4hlt nicht)", "Bra\xE7os n\xE3o abertos o suficiente (n\xE3o conta)"],
  ["Mini band sopra le ginocchia.", "Mini band above your knees.", "Minibanda sobre las rodillas.", "Mini-bande au-dessus des genoux.", "Miniband \xFCber den Knien.", "Mini band acima dos joelhos."],
  ["Supina, ginocchia piegate, piedi a terra alla larghezza delle anche.", "On your back, knees bent, feet on the floor hip-width apart.", "Boca arriba, rodillas dobladas, pies en el suelo a la anchura de la cadera.", "Sur le dos, genoux pli\xE9s, pieds au sol largeur de hanches.", "R\xFCckenlage, Knie gebeugt, F\xFC\xDFe h\xFCftbreit am Boden.", "Deitada de costas, joelhos dobrados, p\xE9s no ch\xE3o na largura do quadril."],
  ["Spingi il bacino in alto aprendo le ginocchia contro l'elastico.", "Push your hips up, opening your knees against the band.", "Sube la cadera abriendo las rodillas contra la banda.", "Monte le bassin en ouvrant les genoux contre l'\xE9lastique.", "Dr\xFCck die H\xFCfte hoch und die Knie gegen das Band auseinander.", "Suba o quadril abrindo os joelhos contra o el\xE1stico."],
  ["Stringi i glutei in alto e torna gi\xF9 controllando.", "Squeeze your glutes at the top and lower with control.", "Aprieta los gl\xFAteos arriba y baja con control.", "Serre les fessiers en haut et redescends en contr\xF4lant.", "Spann oben den Po an und senk dich kontrolliert ab.", "Contraia os gl\xFAteos em cima e des\xE7a com controle."],
  ["Bacino non abbastanza alto (non conta)", "Hips not high enough (doesn't count)", "Cadera no lo bastante alta (no cuenta)", "Bassin pas assez haut (ne compte pas)", "H\xFCfte nicht hoch genug (z\xE4hlt nicht)", "Quadril n\xE3o alto o suficiente (n\xE3o conta)"],
  ["A quattro zampe, elastico attorno a un piede e tenuto con le mani.", "On all fours, band around one foot and held with your hands.", "A cuatro patas, banda alrededor de un pie y sujeta con las manos.", "\xC0 quatre pattes, \xE9lastique autour d'un pied et tenu avec les mains.", "Im Vierf\xFC\xDFlerstand, Band um einen Fu\xDF, mit den H\xE4nden gehalten.", "De quatro, el\xE1stico em volta de um p\xE9 e seguro com as m\xE3os."],
  ["Schiena dritta, addome contratto.", "Back straight, core tight.", "Espalda recta, abdomen contra\xEDdo.", "Dos droit, abdos serr\xE9s.", "R\xFCcken gerade, Bauch fest.", "Costas retas, abd\xF4men contra\xEDdo."],
  ["Spingi la gamba indietro e in alto fino a distenderla.", "Push your leg back and up until it is straight.", "Empuja la pierna atr\xE1s y arriba hasta estirarla.", "Pousse la jambe en arri\xE8re et vers le haut jusqu'\xE0 la tendre.", "Dr\xFCck das Bein nach hinten oben, bis es gestreckt ist.", "Empurre a perna para tr\xE1s e para cima at\xE9 estic\xE1-la."],
  ["Torna gi\xF9 lentamente. Fai met\xE0 serie per lato.", "Lower slowly. Do half the set on each side.", "Baja despacio. Haz media serie por lado.", "Redescends lentement. Fais la moiti\xE9 de la s\xE9rie de chaque c\xF4t\xE9.", "Langsam zur\xFCck. Mach die halbe Serie pro Seite.", "Des\xE7a devagar. Fa\xE7a metade da s\xE9rie de cada lado."],
  ["Gamba non distesa abbastanza (non conta)", "Leg not extended enough (doesn't count)", "Pierna no lo bastante estirada (no cuenta)", "Jambe pas assez tendue (ne compte pas)", "Bein nicht weit genug gestreckt (z\xE4hlt nicht)", "Perna n\xE3o estendida o suficiente (n\xE3o conta)"],
  ["Gomiti fermi ai fianchi", "Keep your elbows at your sides", "Codos quietos junto al cuerpo", "Coudes fixes le long du corps", "Ellbogen an den Seiten lassen", "Cotovelos parados junto ao corpo"],
  ["Busto dritto: tira con le braccia, non con la schiena", "Stay upright: pull with your arms, not your back", "Tronco recto: tira con los brazos, no con la espalda", "Buste droit : tire avec les bras, pas avec le dos", "Aufrecht bleiben: mit den Armen ziehen, nicht mit dem R\xFCcken", "Tronco reto: puxe com os bra\xE7os, n\xE3o com as costas"],
  ["Porta le mani fino alle spalle! Non conta", "Bring your hands up to your shoulders! Doesn't count", "\xA1Lleva las manos hasta los hombros! No cuenta", "Am\xE8ne les mains jusqu'aux \xE9paules ! \xC7a ne compte pas", "H\xE4nde bis zu den Schultern! Z\xE4hlt nicht", "Leve as m\xE3os at\xE9 os ombros! N\xE3o conta"],
  ["Braccia tese sopra la testa! Non conta", "Arms straight overhead! Doesn't count", "\xA1Brazos estirados sobre la cabeza! No cuenta", "Bras tendus au-dessus de la t\xEAte ! \xC7a ne compte pas", "Arme gestreckt \xFCber den Kopf! Z\xE4hlt nicht", "Bra\xE7os esticados acima da cabe\xE7a! N\xE3o conta"],
  ["Tira di pi\xF9, gomiti indietro! Non conta", "Pull harder, elbows back! Doesn't count", "\xA1Tira m\xE1s, codos atr\xE1s! No cuenta", "Tire plus, coudes en arri\xE8re ! \xC7a ne compte pas", "Zieh weiter, Ellbogen nach hinten! Z\xE4hlt nicht", "Puxe mais, cotovelos para tr\xE1s! N\xE3o conta"],
  ["Apri di pi\xF9 le braccia! Non conta", "Open your arms wider! Doesn't count", "\xA1Abre m\xE1s los brazos! No cuenta", "Ouvre plus les bras ! \xC7a ne compte pas", "Arme weiter \xF6ffnen! Z\xE4hlt nicht", "Abra mais os bra\xE7os! N\xE3o conta"],
  ["Spingi il bacino pi\xF9 in alto! Non conta", "Push your hips higher! Doesn't count", "\xA1Sube m\xE1s la cadera! No cuenta", "Monte plus le bassin ! \xC7a ne compte pas", "H\xFCfte h\xF6her dr\xFCcken! Z\xE4hlt nicht", "Suba mais o quadril! N\xE3o conta"],
  ["Spingi la gamba pi\xF9 indietro e in alto! Non conta", "Push your leg further back and up! Doesn't count", "\xA1Lleva la pierna m\xE1s atr\xE1s y arriba! No cuenta", "Pousse la jambe plus en arri\xE8re et en haut ! \xC7a ne compte pas", "Bein weiter nach hinten oben! Z\xE4hlt nicht", "Leve a perna mais para tr\xE1s e para cima! N\xE3o conta"],
  ["Inquadrati di lato: spalla, gomito e mano", "Get in frame from the side: shoulder, elbow and hand", "Ponte de lado: hombro, codo y mano", "Mets-toi de profil : \xE9paule, coude et main", "Stell dich seitlich ins Bild: Schulter, Ellbogen und Hand", "Fique de lado: ombro, cotovelo e m\xE3o"],
  ["Inquadrati di fronte, dalla vita alle mani alzate", "Face the camera, from waist to raised hands", "Ponte de frente, de la cintura a las manos levantadas", "Mets-toi de face, de la taille aux mains lev\xE9es", "Stell dich frontal ins Bild, von der Taille bis zu den erhobenen H\xE4nden", "Fique de frente, da cintura \xE0s m\xE3os levantadas"],
  ["Inquadrati di lato, seduto con le gambe distese", "Get in frame from the side, sitting with legs straight", "Ponte de lado, sentado con las piernas estiradas", "Mets-toi de profil, assis jambes tendues", "Stell dich seitlich ins Bild, sitzend mit gestreckten Beinen", "Fique de lado, sentado com as pernas estendidas"],

  ["Nella sala d'attesa, quando il tuo amico \xE8 entrato, girate la ruota: esce lo stesso esercizio per tutti e due.", "In the lobby, once your friend has joined, spin the wheel: the same exercise comes out for both of you.", "En la sala, cuando tu amigo haya entrado, girad la ruleta: sale el mismo ejercicio para los dos.", "Dans le salon, quand ton ami est arriv\xE9, faites tourner la roue : le m\xEAme exercice sort pour vous deux.", "In der Lobby, sobald dein Freund da ist, dreht ihr das Rad: F\xFCr beide kommt dieselbe \xDCbung.", "Na sala, quando seu amigo entrar, girem a roleta: sai o mesmo exerc\xEDcio para os dois."],
  ["Nella sala d'attesa tu e il tuo amico toccate l'esercizio che volete: quando scegliete lo stesso, si parte.", "In the lobby you and your friend tap the exercise you want: when you pick the same one, you start.", "En la sala t\xFA y tu amigo toc\xE1is el ejercicio que quer\xE9is: cuando eleg\xEDs el mismo, se empieza.", "Dans le salon, toi et ton ami touchez l'exercice voulu : quand vous choisissez le m\xEAme, c'est parti.", "In der Lobby tippt ihr beide die gew\xFCnschte \xDCbung an: W\xE4hlt ihr dieselbe, geht's los.", "Na sala voc\xEA e seu amigo tocam o exerc\xEDcio que querem: quando escolherem o mesmo, come\xE7a."],
  ["Vi dir\xF2 dove metterlo quando l'esercizio \xE8 deciso.", "I'll tell you where to put it once the exercise is decided.", "Os dir\xE9 d\xF3nde ponerlo cuando el ejercicio est\xE9 decidido.", "Je vous dirai o\xF9 le poser quand l'exercice sera choisi.", "Ich sage euch, wo es hin soll, sobald die \xDCbung feststeht.", "Direi onde colocar quando o exerc\xEDcio estiver decidido."],

  ["Tocca l'esercizio che vuoi fare. Quando scegliete lo stesso, si parte.", "Tap the exercise you want to do. When you both pick the same one, you start.", "Toca el ejercicio que quieres hacer. Cuando eleg\xEDs el mismo, se empieza.", "Touche l'exercice que tu veux faire. Quand vous choisissez le m\xEAme, c'est parti.", "Tippe die \xDCbung an, die du machen willst. W\xE4hlt ihr dieselbe, geht's los.", "Toque o exerc\xEDcio que quer fazer. Quando escolherem o mesmo, come\xE7a."],
  ["Non siete d'accordo? Decida la sorte", "Can't agree? Let chance decide", "\xBFNo os pon\xE9is de acuerdo? Que decida la suerte", "Pas d'accord ? Laissez le hasard d\xE9cider", "Nicht einig? Lasst den Zufall entscheiden", "N\xE3o concordam? Que a sorte decida"],
  ["Non siete d'accordo? Chi ha creato la sfida pu\xF2 far decidere alla sorte.", "Can't agree? Whoever created the challenge can let chance decide.", "\xBFNo os pon\xE9is de acuerdo? Quien cre\xF3 el reto puede dejarlo a la suerte.", "Pas d'accord ? Celui qui a cr\xE9\xE9 le d\xE9fi peut laisser faire le hasard.", "Nicht einig? Wer das Duell erstellt hat, kann den Zufall entscheiden lassen.", "N\xE3o concordam? Quem criou o desafio pode deixar a sorte decidir."],
  ["Giratela quando siete pronti: esce lo stesso esercizio per tutti e due.", "Spin it when you're ready: the same exercise comes out for both of you.", "Giradla cuando est\xE9is listos: sale el mismo ejercicio para los dos.", "Faites-la tourner quand vous \xEAtes pr\xEAts : le m\xEAme exercice sort pour vous deux.", "Dreht es, wenn ihr bereit seid: F\xFCr beide kommt dieselbe \xDCbung.", "Girem quando estiverem prontos: sai o mesmo exerc\xEDcio para os dois."],

  ["Elastico dietro la schiena, capi tenuti sul petto.", "Band behind your back, ends held on your chest.", "Banda detr\xE1s de la espalda, extremos sujetos en el pecho.", "\xC9lastique derri\xE8re le dos, extr\xE9mit\xE9s tenues sur la poitrine.", "Band hinter dem R\xFCcken, Enden auf der Brust halten.", "El\xE1stico atr\xE1s das costas, pontas seguras no peito."],
  ["Torna gi\xF9 lentamente senza appoggiare la testa.", "Lower slowly without resting your head.", "Baja despacio sin apoyar la cabeza.", "Redescends lentement sans poser la t\xEAte.", "Langsam zur\xFCck, ohne den Kopf abzulegen.", "Des\xE7a devagar sem apoiar a cabe\xE7a."],
  ["Mini band sopra le ginocchia, piedi uniti.", "Mini band above your knees, feet together.", "Minibanda sobre las rodillas, pies juntos.", "Mini-bande au-dessus des genoux, pieds joints.", "Miniband \xFCber den Knien, F\xFC\xDFe zusammen.", "Mini band acima dos joelhos, p\xE9s juntos."],
  ["Salta aprendo le gambe contro l'elastico e alza le braccia.", "Jump, opening your legs against the band, and raise your arms.", "Salta abriendo las piernas contra la banda y sube los brazos.", "Saute en ouvrant les jambes contre l'\xE9lastique et l\xE8ve les bras.", "Spring, \xF6ffne die Beine gegen das Band und heb die Arme.", "Salte abrindo as pernas contra o el\xE1stico e levante os bra\xE7os."],
  ["Salta di nuovo chiudendo gambe e braccia.", "Jump again, closing legs and arms.", "Salta otra vez cerrando piernas y brazos.", "Saute de nouveau en fermant jambes et bras.", "Spring wieder und schlie\xDF Beine und Arme.", "Salte de novo fechando pernas e bra\xE7os."],
  ["Tieni le ginocchia in fuori, non farle cadere verso l'interno.", "Keep your knees out, don't let them cave in.", "Mant\xE9n las rodillas hacia fuera, que no caigan hacia dentro.", "Garde les genoux vers l'ext\xE9rieur, ne les laisse pas rentrer.", "Knie nach au\xDFen, lass sie nicht nach innen fallen.", "Mantenha os joelhos para fora, n\xE3o deixe ca\xEDrem para dentro."],
  ["Elastico dietro la schiena, un capo sotto ogni mano.", "Band behind your back, one end under each hand.", "Banda detr\xE1s de la espalda, un extremo bajo cada mano.", "\xC9lastique derri\xE8re le dos, une extr\xE9mit\xE9 sous chaque main.", "Band hinter dem R\xFCcken, ein Ende unter jeder Hand.", "El\xE1stico atr\xE1s das costas, uma ponta sob cada m\xE3o."],
  ["Scendi finch\xE9 i gomiti sono a 90 gradi.", "Lower until your elbows are at 90 degrees.", "Baja hasta que los codos est\xE9n a 90 grados.", "Descends jusqu'\xE0 ce que les coudes soient \xE0 90 degr\xE9s.", "Geh runter, bis die Ellbogen 90 Grad haben.", "Des\xE7a at\xE9 os cotovelos ficarem a 90 graus."],
  ["Spingi forte contro l'elastico e torna su.", "Push hard against the band and come back up.", "Empuja fuerte contra la banda y vuelve arriba.", "Pousse fort contre l'\xE9lastique et remonte.", "Dr\xFCck kr\xE4ftig gegen das Band und komm wieder hoch.", "Empurre forte contra o el\xE1stico e volte para cima."],
  ["Braccia tese, mani sotto le spalle.", "Arms straight, hands under your shoulders.", "Brazos estirados, manos bajo los hombros.", "Bras tendus, mains sous les \xE9paules.", "Arme gestreckt, H\xE4nde unter den Schultern.", "Bra\xE7os esticados, m\xE3os sob os ombros."],
  ["Corpo dritto, addome e glutei contratti.", "Body straight, abs and glutes tight.", "Cuerpo recto, abdomen y gl\xFAteos contra\xEDdos.", "Corps droit, abdos et fessiers serr\xE9s.", "K\xF6rper gerade, Bauch und Po angespannt.", "Corpo reto, abd\xF4men e gl\xFAteos contra\xEDdos."],
  ["Spingi le ginocchia in fuori contro l'elastico e tieni la posizione.", "Push your knees out against the band and hold the position.", "Empuja las rodillas hacia fuera contra la banda y mant\xE9n la posici\xF3n.", "Pousse les genoux vers l'ext\xE9rieur contre l'\xE9lastique et tiens la position.", "Dr\xFCck die Knie gegen das Band nach au\xDFen und halte die Position.", "Empurre os joelhos para fora contra o el\xE1stico e mantenha a posi\xE7\xE3o."],
  ["In piedi, mini band sopra le ginocchia.", "Standing, mini band above your knees.", "De pie, minibanda sobre las rodillas.", "Debout, mini-bande au-dessus des genoux.", "Im Stand, Miniband \xFCber den Knien.", "Em p\xE9, mini band acima dos joelhos."],
  ["Scendi in accosciata e porta le mani a terra.", "Squat down and put your hands on the floor.", "Baja en sentadilla y apoya las manos en el suelo.", "Descends en accroupi et pose les mains au sol.", "Geh in die Hocke und setz die H\xE4nde auf den Boden.", "Agache e apoie as m\xE3os no ch\xE3o."],
  ["Salta indietro con i piedi in plank, poi torna avanti.", "Jump your feet back into a plank, then return.", "Salta atr\xE1s con los pies a plancha y vuelve.", "Saute les pieds en arri\xE8re en planche, puis reviens.", "Spring mit den F\xFC\xDFen in den St\xFCtz und zur\xFCck.", "Salte com os p\xE9s para tr\xE1s em prancha e volte."],
  ["Rialzati con un salto, ginocchia in fuori contro l'elastico.", "Jump up, knees out against the band.", "Lev\xE1ntate con un salto, rodillas hacia fuera contra la banda.", "Rel\xE8ve-toi d'un saut, genoux vers l'ext\xE9rieur contre l'\xE9lastique.", "Spring hoch, Knie gegen das Band nach au\xDFen.", "Levante com um salto, joelhos para fora contra o el\xE1stico."],

  ["Scivola gi\xF9 finch\xE9 le cosce sono parallele al suolo.", "Slide down until your thighs are parallel to the floor.", "Desliza hacia abajo hasta que los muslos est\xE9n paralelos al suelo.", "Glisse vers le bas jusqu'aux cuisses parall\xE8les au sol.", "Rutsch runter, bis die Oberschenkel parallel zum Boden sind.", "Deslize para baixo at\xE9 as coxas ficarem paralelas ao ch\xE3o."],
  ["Spingi le ginocchia in fuori contro l'elastico.", "Push your knees out against the band.", "Empuja las rodillas hacia fuera contra la banda.", "Pousse les genoux vers l'ext\xE9rieur contre l'\xE9lastique.", "Dr\xFCck die Knie gegen das Band nach au\xDFen.", "Empurre os joelhos para fora contra o el\xE1stico."],
  ["Tieni la posizione respirando con calma.", "Hold the position, breathing calmly.", "Mant\xE9n la posici\xF3n respirando con calma.", "Tiens la position en respirant calmement.", "Halte die Position und atme ruhig.", "Mantenha a posi\xE7\xE3o respirando com calma."],
  ["Supino, mini band attorno ai piedi, mani a terra.", "On your back, mini band around your feet, hands on the floor.", "Boca arriba, minibanda alrededor de los pies, manos en el suelo.", "Sur le dos, mini-bande autour des pieds, mains au sol.", "R\xFCckenlage, Miniband um die F\xFC\xDFe, H\xE4nde am Boden.", "De costas, mini band em volta dos p\xE9s, m\xE3os no ch\xE3o."],

  ["In piedi, elastico sotto i piedi, un capo per mano.", "Stand on the band, one end in each hand.", "De pie, banda bajo los pies, un extremo en cada mano.", "Debout, \xE9lastique sous les pieds, une extr\xE9mit\xE9 dans chaque main.", "Stehend, Band unter den F\xFC\xDFen, ein Ende in jeder Hand.", "De p\xE9, el\xE1stico sob os p\xE9s, uma ponta em cada m\xE3o."],

  ["Tira le mani verso i fianchi portando i gomiti indietro.", "Pull your hands towards your hips, driving your elbows back.", "Tira de las manos hacia las caderas llevando los codos atr\xE1s.", "Tire les mains vers les hanches en ramenant les coudes en arri\xE8re.", "Zieh die H\xE4nde zur H\xFCfte und f\xFChre die Ellbogen nach hinten.", "Puxa as m\xE3os para as ancas levando os cotovelos para tr\xE1s."],
