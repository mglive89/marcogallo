  ["Braccia lungo i fianchi, gomiti appena piegati.", "Arms by your sides, elbows slightly bent.", "Brazos junto al cuerpo, codos ligeramente flexionados.", "Bras le long du corps, coudes l\xE9g\xE8rement fl\xE9chis.", "Arme seitlich am K\xF6rper, Ellbogen leicht gebeugt.", "Bra\xE7os junto ao corpo, cotovelos ligeiramente dobrados."],
  ["Alza le braccia di lato fino all'altezza delle spalle.", "Raise your arms out to the sides up to shoulder height.", "Sube los brazos de lado hasta la altura de los hombros.", "L\xE8ve les bras sur les c\xF4t\xE9s jusqu'\xE0 hauteur des \xE9paules.", "Heb die Arme seitlich bis auf Schulterh\xF6he.", "Levanta os bra\xE7os para os lados at\xE9 \xE0 altura dos ombros."],
  ["Braccia non alzate fino alle spalle (non conta)", "Arms not raised to shoulder height (doesn't count)", "Brazos no subidos hasta los hombros (no cuenta)", "Bras pas lev\xE9s jusqu'aux \xE9paules (ne compte pas)", "Arme nicht bis zur Schulter gehoben (z\xE4hlt nicht)", "Bra\xE7os n\xE3o levantados at\xE9 aos ombros (n\xE3o conta)"],
  ["Alza le braccia fino alle spalle! Non conta", "Raise your arms to shoulder height! Doesn't count", "\xA1Sube los brazos hasta los hombros! No cuenta", "L\xE8ve les bras jusqu'aux \xE9paules ! \xC7a ne compte pas", "Heb die Arme bis zur Schulter! Z\xE4hlt nicht", "Levanta os bra\xE7os at\xE9 aos ombros! N\xE3o conta"],
  ["Inquadrati di lato, busto inclinato in avanti", "Get in frame from the side, torso leaning forward", "Ponte de lado, con el torso inclinado hacia delante", "Mets-toi de profil, buste pench\xE9 en avant", "Seitlich ins Bild, Oberk\xF6rper nach vorn geneigt", "P\xF5e-te de lado, tronco inclinado para a frente"],
  ["Inquadrati di lato, in piedi", "Get in frame from the side, standing", "Ponte de lado, de pie", "Mets-toi de profil, debout", "Seitlich ins Bild, stehend", "P\xF5e-te de lado, de p\xE9"],
  ["Spingi la gamba pi\xF9 indietro! Non conta", "Push your leg further back! Doesn't count", "\xA1Lleva la pierna m\xE1s atr\xE1s! No cuenta", "Pousse la jambe plus en arri\xE8re ! \xC7a ne compte pas", "Bein weiter nach hinten! Z\xE4hlt nicht", "Leva a perna mais para tr\xE1s! N\xE3o conta"],
  ["\u{1F50A} Tocca per sentire l'amico", "\u{1F50A} Tap to hear your friend", "\u{1F50A} Toca para o\xEDr a tu amigo", "\u{1F50A} Touche pour entendre ton ami", "\u{1F50A} Tippen, um deinen Freund zu h\xF6ren", "\u{1F50A} Toca para ouvir o teu amigo"],
  ["Ruota il telefono", "Turn your phone", "Gira el tel\xE9fono", "Tourne ton t\xE9l\xE9phone", "Dreh dein Handy", "Roda o telem\xF3vel"],
  ["FitQuest si usa in verticale.", "FitQuest works in portrait mode.", "FitQuest se usa en vertical.", "FitQuest s'utilise en mode portrait.", "FitQuest wird hochkant benutzt.", "O FitQuest usa-se na vertical."],
  ["Le sfide funzionano solo con internet", "Challenges only work online", "Los retos solo funcionan con internet", "Les d\xE9fis ne fonctionnent qu'avec internet", "Duelle funktionieren nur mit Internet", "Os desafios s\xF3 funcionam com internet"],
  ["Sei offline. Allenamenti, esercizi, progressi e profilo funzionano anche senza connessione: le sfide in videochiamata no.", "You're offline. Workouts, exercises, progress and profile work without a connection: video challenges don't.", "Est\xE1s sin conexi\xF3n. Entrenamientos, ejercicios, progreso y perfil funcionan sin conexi\xF3n: los retos en videollamada no.", "Tu es hors ligne. Entra\xEEnements, exercices, progr\xE8s et profil fonctionnent sans connexion : pas les d\xE9fis en visio.", "Du bist offline. Training, \xDCbungen, Fortschritt und Profil funktionieren ohne Verbindung, Video-Duelle nicht.", "Est\xE1s offline. Treinos, exerc\xEDcios, progresso e perfil funcionam sem liga\xE7\xE3o: os desafios por videochamada n\xE3o."],
  ["Riprova", "Try again", "Reintentar", "R\xE9essayer", "Erneut versuchen", "Tentar de novo"],
  ["Sei offline: per sfidare qualcuno serve internet.", "You're offline: challenging someone needs internet.", "Est\xE1s sin conexi\xF3n: para retar a alguien necesitas internet.", "Tu es hors ligne : pour d\xE9fier quelqu'un, il faut internet.", "Du bist offline: F\xFCr ein Duell brauchst du Internet.", "Est\xE1s offline: para desafiar algu\xE9m precisas de internet."],
  ["Gambe e glutei", "Legs and glutes", "Piernas y gl\xFAteos", "Jambes et fessiers", "Beine und Po", "Pernas e gl\xFAteos"],
  ["Petto, spalle, tricipiti", "Chest, shoulders, triceps", "Pecho, hombros, tr\xEDceps", "Pectoraux, \xE9paules, triceps", "Brust, Schultern, Trizeps", "Peito, ombros, tr\xEDceps"],
  ["Sit-up completi", "Full sit-ups", "Abdominales completos", "Abdos complets", "Komplette Sit-ups", "Abdominais completos"],
  ["Riscaldamento e cardio", "Warm-up and cardio", "Calentamiento y cardio", "\xC9chauffement et cardio", "Aufw\xE4rmen und Cardio", "Aquecimento e cardio"],
  ["Tenuta del core", "Core hold", "Resistencia del core", "Gainage du tronc", "Rumpfspannung", "Resist\xEAncia do core"],
  ["Gambe, equilibrio", "Legs, balance", "Piernas, equilibrio", "Jambes, \xE9quilibre", "Beine, Gleichgewicht", "Pernas, equil\xEDbrio"],
  ["Core e cardio", "Core and cardio", "Core y cardio", "Gainage et cardio", "Rumpf und Cardio", "Core e cardio"],
  ["L'esercizio pi\xF9 completo", "The most complete exercise", "El ejercicio m\xE1s completo", "L'exercice le plus complet", "Die kompletteste \xDCbung", "O exerc\xEDcio mais completo"],
  ["Telefono a terra, di lato, a circa 2\u20133 metri. Devi vedere testa e piedi.", "Phone on the floor, to your side, about 2\u20133 metres away. Your head and feet must be in view.", "Tel\xE9fono en el suelo, de lado, a unos 2\u20133 metros. Se te deben ver la cabeza y los pies.", "T\xE9l\xE9phone au sol, de c\xF4t\xE9, \xE0 environ 2\u20133 m\xE8tres. On doit voir ta t\xEAte et tes pieds.", "Handy auf dem Boden, seitlich, etwa 2\u20133 Meter entfernt. Kopf und F\xFC\xDFe m\xFCssen zu sehen sein.", "Celular no ch\xE3o, de lado, a uns 2\u20133 metros. Sua cabe\xE7a e seus p\xE9s precisam aparecer."],
  ["Telefono a terra, di lato, a circa 2 metri, all'altezza del pavimento.", "Phone on the floor, to your side, about 2 metres away, at floor level.", "Tel\xE9fono en el suelo, de lado, a unos 2 metros, a ras de suelo.", "T\xE9l\xE9phone au sol, de c\xF4t\xE9, \xE0 environ 2 m\xE8tres, au ras du sol.", "Handy auf dem Boden, seitlich, etwa 2 Meter entfernt, auf Bodenh\xF6he.", "Celular no ch\xE3o, de lado, a uns 2 metros, na altura do piso."],
  ["Telefono a terra, di lato, a circa 2 metri. Devi vedere spalle, bacino e ginocchia.", "Phone on the floor, to your side, about 2 metres away. Shoulders, hips and knees must be in view.", "Tel\xE9fono en el suelo, de lado, a unos 2 metros. Se te deben ver hombros, cadera y rodillas.", "T\xE9l\xE9phone au sol, de c\xF4t\xE9, \xE0 environ 2 m\xE8tres. On doit voir \xE9paules, bassin et genoux.", "Handy auf dem Boden, seitlich, etwa 2 Meter entfernt. Schultern, H\xFCfte und Knie m\xFCssen zu sehen sein.", "Celular no ch\xE3o, de lado, a uns 2 metros. Ombros, quadril e joelhos precisam aparecer."],
  ["Telefono in verticale, di fronte a te, a 2\u20133 metri. Devi vedere mani sopra la testa e piedi.", "Phone upright, facing you, 2\u20133 metres away. Your hands above your head and your feet must be in view.", "Tel\xE9fono en vertical, frente a ti, a 2\u20133 metros. Se te deben ver las manos sobre la cabeza y los pies.", "T\xE9l\xE9phone \xE0 la verticale, face \xE0 toi, \xE0 2\u20133 m\xE8tres. On doit voir tes mains au-dessus de la t\xEAte et tes pieds.", "Handy hochkant, vor dir, 2\u20133 Meter entfernt. H\xE4nde \xFCber dem Kopf und F\xFC\xDFe m\xFCssen zu sehen sein.", "Celular na vertical, de frente para voc\xEA, a 2\u20133 metros. M\xE3os acima da cabe\xE7a e p\xE9s precisam aparecer."],
  ["Telefono a terra, di lato, a circa 2 metri.", "Phone on the floor, to your side, about 2 metres away.", "Tel\xE9fono en el suelo, de lado, a unos 2 metros.", "T\xE9l\xE9phone au sol, de c\xF4t\xE9, \xE0 environ 2 m\xE8tres.", "Handy auf dem Boden, seitlich, etwa 2 Meter entfernt.", "Celular no ch\xE3o, de lado, a uns 2 metros."],
  ["Telefono in verticale, di lato, a circa 3 metri. Devi vederti in piedi e a terra.", "Phone upright, to your side, about 3 metres away. You must be in view standing and on the floor.", "Tel\xE9fono en vertical, de lado, a unos 3 metros. Te tiene que ver de pie y en el suelo.", "T\xE9l\xE9phone \xE0 la verticale, de c\xF4t\xE9, \xE0 environ 3 m\xE8tres. On doit te voir debout et au sol.", "Handy hochkant, seitlich, etwa 3 Meter entfernt. Du musst stehend und am Boden zu sehen sein.", "Celular na vertical, de lado, a uns 3 metros. Voc\xEA precisa aparecer de p\xE9 e no ch\xE3o."],
  ["Piedi alla larghezza delle spalle, punte leggermente in fuori.", "Feet shoulder-width apart, toes slightly out.", "Pies a la anchura de los hombros, puntas un poco hacia fuera.", "Pieds \xE9cart\xE9s \xE0 largeur d'\xE9paules, pointes l\xE9g\xE8rement vers l'ext\xE9rieur.", "F\xFC\xDFe schulterbreit, Fu\xDFspitzen leicht nach au\xDFen.", "P\xE9s na largura dos ombros, pontas levemente para fora."],
  ["Spingi il bacino indietro e scendi piegando le ginocchia, petto alto.", "Push your hips back and lower by bending your knees, chest up.", "Lleva la cadera atr\xE1s y baja doblando las rodillas, pecho arriba.", "Pousse le bassin en arri\xE8re et descends en pliant les genoux, poitrine haute.", "Schiebe die H\xFCfte nach hinten und beuge die Knie, Brust raus.", "Empurre o quadril para tr\xE1s e des\xE7a dobrando os joelhos, peito alto."],
  ["Scendi finch\xE9 le cosce sono parallele al suolo.", "Go down until your thighs are parallel to the floor.", "Baja hasta que los muslos queden paralelos al suelo.", "Descends jusqu'\xE0 ce que les cuisses soient parall\xE8les au sol.", "Geh runter, bis die Oberschenkel parallel zum Boden sind.", "Des\xE7a at\xE9 as coxas ficarem paralelas ao ch\xE3o."],
  ["Risali spingendo sui talloni fino a gambe distese.", "Drive up through your heels until your legs are straight.", "Sube empujando con los talones hasta estirar las piernas.", "Remonte en poussant sur les talons jusqu'\xE0 tendre les jambes.", "Dr\xFCck dich \xFCber die Fersen hoch, bis die Beine gestreckt sind.", "Suba empurrando com os calcanhares at\xE9 esticar as pernas."],
  ["Non scendi abbastanza (la ripetizione non conta)", "Not going low enough (the rep doesn't count)", "No bajas lo suficiente (la repetici\xF3n no cuenta)", "Tu ne descends pas assez (la r\xE9p\xE9tition ne compte pas)", "Nicht tief genug (die Wiederholung z\xE4hlt nicht)", "N\xE3o desce o suficiente (a repeti\xE7\xE3o n\xE3o conta)"],
  ["Busto troppo inclinato in avanti", "Torso leaning too far forward", "Tronco demasiado inclinado hacia delante", "Buste trop pench\xE9 en avant", "Oberk\xF6rper zu weit nach vorn geneigt", "Tronco inclinado demais para a frente"],
  ["Gambe non distese in cima", "Legs not straight at the top", "Piernas no estiradas arriba", "Jambes pas tendues en haut", "Beine oben nicht gestreckt", "Pernas n\xE3o esticadas no alto"],
  ["Mani sotto le spalle, corpo dritto dalla testa ai talloni.", "Hands under your shoulders, body straight from head to heels.", "Manos bajo los hombros, cuerpo recto de la cabeza a los talones.", "Mains sous les \xE9paules, corps droit de la t\xEAte aux talons.", "H\xE4nde unter den Schultern, K\xF6rper gerade von Kopf bis Ferse.", "M\xE3os abaixo dos ombros, corpo reto da cabe\xE7a aos calcanhares."],
  ["Contrai addome e glutei: il bacino non deve cedere.", "Brace your abs and glutes: your hips must not sag.", "Contrae abdomen y gl\xFAteos: la cadera no debe caer.", "Contracte abdos et fessiers : le bassin ne doit pas s'affaisser.", "Spann Bauch und Po an: Die H\xFCfte darf nicht durchh\xE4ngen.", "Contraia abd\xF4men e gl\xFAteos: o quadril n\xE3o pode cair."],
  ["Scendi finch\xE9 i gomiti sono piegati a 90\xB0 o meno.", "Go down until your elbows are bent to 90\xB0 or less.", "Baja hasta que los codos est\xE9n a 90\xB0 o menos.", "Descends jusqu'\xE0 ce que les coudes soient pli\xE9s \xE0 90\xB0 ou moins.", "Geh runter, bis die Ellbogen 90\xB0 oder weniger gebeugt sind.", "Des\xE7a at\xE9 os cotovelos ficarem a 90\xB0 ou menos."],
  ["Spingi fino a braccia distese.", "Push up until your arms are straight.", "Empuja hasta estirar los brazos.", "Pousse jusqu'\xE0 tendre les bras.", "Dr\xFCck dich hoch, bis die Arme gestreckt sind.", "Empurre at\xE9 esticar os bra\xE7os."],
  ["Bacino che cede verso il basso", "Hips sagging", "Cadera que cae", "Bassin qui s'affaisse", "H\xFCfte h\xE4ngt durch", "Quadril caindo"],
  ["Bacino troppo alto", "Hips too high", "Cadera demasiado alta", "Bassin trop haut", "H\xFCfte zu hoch", "Quadril alto demais"],
  ["Gomiti non piegati a 90\xB0 (non conta)", "Elbows not bent to 90\xB0 (doesn't count)", "Codos no doblados a 90\xB0 (no cuenta)", "Coudes pas pli\xE9s \xE0 90\xB0 (ne compte pas)", "Ellbogen nicht auf 90\xB0 gebeugt (z\xE4hlt nicht)", "Cotovelos n\xE3o dobrados a 90\xB0 (n\xE3o conta)"],
  ["Supino, ginocchia piegate a circa 90\xB0, piedi a terra.", "Lie on your back, knees bent to about 90\xB0, feet on the floor.", "Boca arriba, rodillas dobladas a unos 90\xB0, pies en el suelo.", "Sur le dos, genoux pli\xE9s \xE0 environ 90\xB0, pieds au sol.", "Auf dem R\xFCcken, Knie etwa 90\xB0 gebeugt, F\xFC\xDFe am Boden.", "Deitado de costas, joelhos dobrados a uns 90\xB0, p\xE9s no ch\xE3o."],
  ["Mani incrociate sul petto o dietro le orecchie.", "Hands crossed on your chest or behind your ears.", "Manos cruzadas sobre el pecho o detr\xE1s de las orejas.", "Mains crois\xE9es sur la poitrine ou derri\xE8re les oreilles.", "H\xE4nde vor der Brust gekreuzt oder hinter den Ohren.", "M\xE3os cruzadas no peito ou atr\xE1s das orelhas."],
  ["Sali con il busto fino a portare le spalle sopra il bacino.", "Sit up until your shoulders are over your hips.", "Sube el tronco hasta llevar los hombros sobre la cadera.", "Remonte le buste jusqu'\xE0 amener les \xE9paules au-dessus du bassin.", "Richte den Oberk\xF6rper auf, bis die Schultern \xFCber der H\xFCfte sind.", "Suba o tronco at\xE9 os ombros ficarem sobre o quadril."],
  ["Torna gi\xF9 finch\xE9 le scapole toccano terra.", "Lower back down until your shoulder blades touch the floor.", "Vuelve a bajar hasta que los om\xF3platos toquen el suelo.", "Redescends jusqu'\xE0 ce que les omoplates touchent le sol.", "Geh zur\xFCck, bis die Schulterbl\xE4tter den Boden ber\xFChren.", "Volte a descer at\xE9 as esc\xE1pulas tocarem o ch\xE3o."],
  ["Busto non abbastanza alto (non conta)", "Torso not high enough (doesn't count)", "Tronco no suficientemente alto (no cuenta)", "Buste pas assez haut (ne compte pas)", "Oberk\xF6rper nicht hoch genug (z\xE4hlt nicht)", "Tronco n\xE3o alto o suficiente (n\xE3o conta)"],
  ["Non torni gi\xF9 fino in fondo", "Not going all the way back down", "No bajas del todo", "Tu ne redescends pas jusqu'en bas", "Nicht ganz zur\xFCck nach unten", "N\xE3o volta at\xE9 o fim"],
  ["In piedi, piedi uniti, braccia lungo i fianchi.", "Stand with feet together, arms by your sides.", "De pie, pies juntos, brazos a los lados.", "Debout, pieds joints, bras le long du corps.", "Stehen, F\xFC\xDFe zusammen, Arme seitlich am K\xF6rper.", "De p\xE9, p\xE9s juntos, bra\xE7os ao lado do corpo."],
  ["Salta aprendo le gambe e portando le mani sopra la testa.", "Jump, spreading your legs and bringing your hands above your head.", "Salta abriendo las piernas y llevando las manos sobre la cabeza.", "Saute en \xE9cartant les jambes et en levant les mains au-dessus de la t\xEAte.", "Spring, spreize die Beine und f\xFChre die H\xE4nde \xFCber den Kopf.", "Salte abrindo as pernas e levando as m\xE3os acima da cabe\xE7a."],
  ["Salta di nuovo tornando a piedi uniti e braccia gi\xF9.", "Jump again back to feet together and arms down.", "Salta otra vez volviendo a pies juntos y brazos abajo.", "Saute \xE0 nouveau pour revenir pieds joints et bras en bas.", "Spring zur\xFCck: F\xFC\xDFe zusammen, Arme unten.", "Salte de novo voltando aos p\xE9s juntos e bra\xE7os para baixo."],
  ["Mantieni un ritmo costante.", "Keep a steady rhythm.", "Mant\xE9n un ritmo constante.", "Garde un rythme r\xE9gulier.", "Halte einen gleichm\xE4\xDFigen Rhythmus.", "Mantenha um ritmo constante."],
  ["Braccia non sopra la testa", "Arms not above your head", "Brazos no por encima de la cabeza", "Bras pas au-dessus de la t\xEAte", "Arme nicht \xFCber dem Kopf", "Bra\xE7os n\xE3o acima da cabe\xE7a"],
  ["Gambe non abbastanza aperte", "Legs not wide enough", "Piernas no suficientemente abiertas", "Jambes pas assez \xE9cart\xE9es", "Beine nicht weit genug gespreizt", "Pernas n\xE3o abertas o suficiente"],
  ["Avambracci a terra, gomiti sotto le spalle.", "Forearms on the floor, elbows under your shoulders.", "Antebrazos en el suelo, codos bajo los hombros.", "Avant-bras au sol, coudes sous les \xE9paules.", "Unterarme am Boden, Ellbogen unter den Schultern.", "Antebra\xE7os no ch\xE3o, cotovelos abaixo dos ombros."],
  ["Corpo dritto dalla testa ai talloni.", "Body straight from head to heels.", "Cuerpo recto de la cabeza a los talones.", "Corps droit de la t\xEAte aux talons.", "K\xF6rper gerade von Kopf bis Ferse.", "Corpo reto da cabe\xE7a aos calcanhares."],
  ["Contrai addome e glutei, respira regolarmente.", "Brace your abs and glutes, breathe steadily.", "Contrae abdomen y gl\xFAteos, respira con regularidad.", "Contracte abdos et fessiers, respire r\xE9guli\xE8rement.", "Spann Bauch und Po an, atme gleichm\xE4\xDFig.", "Contraia abd\xF4men e gl\xFAteos, respire normalmente."],
  ["Il tempo scorre solo quando la posizione \xE8 corretta.", "The clock only runs while your position is correct.", "El tiempo solo corre cuando la posici\xF3n es correcta.", "Le temps ne d\xE9file que si la position est correcte.", "Die Zeit l\xE4uft nur, solange die Haltung stimmt.", "O tempo s\xF3 corre quando a posi\xE7\xE3o est\xE1 correta."],
  ["Bacino che cede a terra", "Hips sagging on the floor", "Cadera que cae en el suelo", "Bassin qui s'affaisse au sol", "H\xFCfte h\xE4ngt am Boden durch", "Quadril caindo no ch\xE3o"],
  ["Bacino che cede", "Hips sagging", "Cadera que cae", "Bassin qui s'affaisse", "H\xFCfte h\xE4ngt durch", "Quadril caindo"],
  ["In piedi, busto dritto, mani sui fianchi.", "Stand tall, torso upright, hands on your hips.", "De pie, tronco recto, manos en la cintura.", "Debout, buste droit, mains sur les hanches.", "Aufrecht stehen, Oberk\xF6rper gerade, H\xE4nde an den H\xFCften.", "De p\xE9, tronco reto, m\xE3os na cintura."],
  ["Fai un passo lungo in avanti e scendi piegando entrambe le ginocchia.", "Take a long step forward and lower by bending both knees.", "Da un paso largo hacia delante y baja doblando ambas rodillas.", "Fais un grand pas en avant et descends en pliant les deux genoux.", "Mach einen gro\xDFen Schritt nach vorn und beuge beide Knie.", "D\xEA um passo longo \xE0 frente e des\xE7a dobrando os dois joelhos."],
  ["Il ginocchio dietro arriva vicino a terra, quello davanti resta sopra la caviglia.", "The back knee comes close to the floor, the front one stays over the ankle.", "La rodilla de atr\xE1s llega cerca del suelo, la de delante queda sobre el tobillo.", "Le genou arri\xE8re approche du sol, celui de devant reste au-dessus de la cheville.", "Das hintere Knie kommt nah an den Boden, das vordere bleibt \xFCber dem Kn\xF6chel.", "O joelho de tr\xE1s chega perto do ch\xE3o, o da frente fica sobre o tornozelo."],
  ["Spingi con la gamba davanti e torna su. Alterna le gambe.", "Push through the front leg and come back up. Alternate legs.", "Empuja con la pierna de delante y vuelve arriba. Alterna las piernas.", "Pousse sur la jambe avant et remonte. Alterne les jambes.", "Dr\xFCck dich mit dem vorderen Bein hoch. Beine abwechseln.", "Empurre com a perna da frente e volte. Alterne as pernas."],
  ["Non scendi abbastanza (non conta)", "Not going low enough (doesn't count)", "No bajas lo suficiente (no cuenta)", "Tu ne descends pas assez (ne compte pas)", "Nicht tief genug (z\xE4hlt nicht)", "N\xE3o desce o suficiente (n\xE3o conta)"],
  ["Busto inclinato in avanti", "Torso leaning forward", "Tronco inclinado hacia delante", "Buste pench\xE9 en avant", "Oberk\xF6rper nach vorn geneigt", "Tronco inclinado para a frente"],
  ["Posizione di piegamento a braccia tese, corpo dritto.", "Push-up position with straight arms, body straight.", "Posici\xF3n de flexi\xF3n con brazos estirados, cuerpo recto.", "Position de pompe bras tendus, corps droit.", "Liegest\xFCtzposition mit gestreckten Armen, K\xF6rper gerade.", "Posi\xE7\xE3o de flex\xE3o com bra\xE7os esticados, corpo reto."],
  ["Porta un ginocchio verso il petto, poi riportalo indietro.", "Drive one knee towards your chest, then take it back.", "Lleva una rodilla al pecho y luego devu\xE9lvela atr\xE1s.", "Am\xE8ne un genou vers la poitrine, puis ram\xE8ne-le en arri\xE8re.", "Zieh ein Knie zur Brust und dann wieder zur\xFCck.", "Leve um joelho ao peito e depois volte com ele."],
  ["Alterna le gambe con ritmo, come se corressi.", "Alternate legs with rhythm, as if you were running.", "Alterna las piernas con ritmo, como si corrieras.", "Alterne les jambes en rythme, comme si tu courais.", "Wechsle die Beine im Rhythmus, als w\xFCrdest du laufen.", "Alterne as pernas com ritmo, como se estivesse correndo."],
  ["Ogni ginocchio al petto vale una ripetizione.", "Each knee to the chest counts as one rep.", "Cada rodilla al pecho vale una repetici\xF3n.", "Chaque genou \xE0 la poitrine compte pour une r\xE9p\xE9tition.", "Jedes Knie zur Brust z\xE4hlt als eine Wiederholung.", "Cada joelho no peito vale uma repeti\xE7\xE3o."],
  ["Ginocchio non abbastanza vicino al petto", "Knee not close enough to the chest", "Rodilla no suficientemente cerca del pecho", "Genou pas assez pr\xE8s de la poitrine", "Knie nicht nah genug an der Brust", "Joelho n\xE3o perto o suficiente do peito"],
  ["In piedi, scendi in accosciata e appoggia le mani a terra.", "From standing, squat down and put your hands on the floor.", "De pie, baja en cuclillas y apoya las manos en el suelo.", "Debout, accroupis-toi et pose les mains au sol.", "Aus dem Stand in die Hocke gehen und die H\xE4nde auf den Boden setzen.", "De p\xE9, agache e apoie as m\xE3os no ch\xE3o."],
  ["Porta i piedi indietro in posizione di piegamento.", "Kick your feet back into a push-up position.", "Lleva los pies atr\xE1s en posici\xF3n de flexi\xF3n.", "Envoie les pieds en arri\xE8re en position de pompe.", "Spring mit den F\xFC\xDFen nach hinten in die Liegest\xFCtzposition.", "Leve os p\xE9s para tr\xE1s em posi\xE7\xE3o de flex\xE3o."],
  ["Riporta i piedi verso le mani e rialzati.", "Bring your feet back to your hands and stand up.", "Vuelve a llevar los pies hacia las manos y lev\xE1ntate.", "Ram\xE8ne les pieds vers les mains et rel\xE8ve-toi.", "Bring die F\xFC\xDFe zur\xFCck zu den H\xE4nden und steh auf.", "Traga os p\xE9s de volta \xE0s m\xE3os e levante-se."],
  ["Salta con le braccia sopra la testa: la ripetizione conta solo con il salto.", "Jump with your arms above your head: the rep only counts with the jump.", "Salta con los brazos sobre la cabeza: la repetici\xF3n solo cuenta con el salto.", "Saute bras au-dessus de la t\xEAte : la r\xE9p\xE9tition ne compte qu'avec le saut.", "Spring mit den Armen \xFCber dem Kopf: Die Wiederholung z\xE4hlt nur mit Sprung.", "Salte com os bra\xE7os acima da cabe\xE7a: a repeti\xE7\xE3o s\xF3 conta com o salto."],
  ["Salto senza braccia in alto (non conta)", "Jump without arms up (doesn't count)", "Salto sin brazos arriba (no cuenta)", "Saut sans bras lev\xE9s (ne compte pas)", "Sprung ohne Arme oben (z\xE4hlt nicht)", "Salto sem bra\xE7os para cima (n\xE3o conta)"],

  ["Al primo avvio il telefono ti chiede il permesso di usare la fotocamera: tocca Consenti. In alternativa puoi registrare un video della serie e farlo analizzare.", "The first time, your phone asks for permission to use the camera: tap Allow. You can also record a video of your set and have it analysed.", "La primera vez el tel\xE9fono te pide permiso para usar la c\xE1mara: toca Permitir. Tambi\xE9n puedes grabar un v\xEDdeo de la serie y que lo analice.", "La premi\xE8re fois, le t\xE9l\xE9phone demande l'autorisation d'utiliser la cam\xE9ra : touche Autoriser. Tu peux aussi filmer ta s\xE9rie et la faire analyser.", "Beim ersten Mal fragt dein Handy, ob die Kamera genutzt werden darf: Tippe auf Zulassen. Du kannst deinen Satz auch filmen und analysieren lassen.", "Na primeira vez, o celular pede permiss\xE3o para usar a c\xE2mera: toque em Permitir. Voc\xEA tamb\xE9m pode gravar um v\xEDdeo da s\xE9rie e mandar analisar."],
  ["Al primo avvio il telefono ti chiede il permesso di usare la fotocamera: tocca Consenti. In alternativa puoi registrare un video della serie e farlo analizzare.", "If the live camera doesn't open, use \u201CRecord a video\u201D: film your set and the trainer analyses it and counts the reps.", "Si la c\xE1mara en directo no se abre, usa \xABGrabar un v\xEDdeo\xBB: graba la serie y el instructor la analiza y cuenta las repeticiones.", "Si la cam\xE9ra en direct ne s'ouvre pas, utilise \xAB Filmer une vid\xE9o \xBB : filme ta s\xE9rie et l'instructeur l'analyse en comptant les r\xE9p\xE9titions.", "Wenn sich die Live-Kamera nicht \xF6ffnet, nutze \u201EVideo aufnehmen\u201C: Filme deinen Satz, der Ausbilder analysiert ihn und z\xE4hlt mit.", "Se a c\xE2mera ao vivo n\xE3o abrir, use \u201CGravar um v\xEDdeo\u201D: filme a s\xE9rie e o instrutor analisa e conta as repeti\xE7\xF5es."],
  ["Carico il sistema di visione\u2026", "Loading the vision system\u2026", "Cargando el sistema de visi\xF3n\u2026", "Chargement du syst\xE8me de vision\u2026", "Bildanalyse wird geladen\u2026", "Carregando o sistema de vis\xE3o\u2026"],
  ["Il sistema di visione non si \xE8 caricato. Controlla la connessione e riprova.", "The vision system didn't load. Check your connection and try again.", "El sistema de visi\xF3n no se ha cargado. Revisa la conexi\xF3n e int\xE9ntalo de nuevo.", "Le syst\xE8me de vision n'a pas pu se charger. V\xE9rifie ta connexion et r\xE9essaie.", "Die Bildanalyse wurde nicht geladen. Pr\xFCfe die Verbindung und versuch es erneut.", "O sistema de vis\xE3o n\xE3o carregou. Verifique a conex\xE3o e tente de novo."],

  ["Non riesco ad aprire la fotocamera.", "I can't open the camera.", "No puedo abrir la c\xE1mara.", "Je n'arrive pas \xE0 ouvrir la cam\xE9ra.", "Ich kann die Kamera nicht \xF6ffnen.", "N\xE3o consigo abrir a c\xE2mera."],
  ["Controlla di aver dato il permesso nelle impostazioni del browser, oppure registra un video della serie.", "Check that you allowed it in the browser settings, or record a video of your set.", "Comprueba que diste permiso en los ajustes del navegador, o graba un v\xEDdeo de la serie.", "V\xE9rifie que tu as donn\xE9 l'autorisation dans les r\xE9glages du navigateur, ou filme ta s\xE9rie.", "Pr\xFCfe die Berechtigung in den Browser-Einstellungen oder nimm ein Video deines Satzes auf.", "Verifique se deu permiss\xE3o nas configura\xE7\xF5es do navegador, ou grave um v\xEDdeo da s\xE9rie."],

  ["Forza, fammi vedere cosa sai fare!", "Come on, show me what you've got!", "\xA1Vamos, ens\xE9\xF1ame de qu\xE9 eres capaz!", "Allez, montre-moi ce que tu vaux !", "Los, zeig mir, was du kannst!", "Vamos, mostre do que voc\xEA \xE9 capaz!"],
  ["Testa alta, petto in fuori. Si comincia!", "Head up, chest out. Here we go!", "Cabeza alta, pecho fuera. \xA1Empezamos!", "T\xEAte haute, poitrine en avant. C'est parti !", "Kopf hoch, Brust raus. Es geht los!", "Cabe\xE7a erguida, peito para fora. Vamos come\xE7ar!"],
  ["Nessuna scusa oggi. Via!", "No excuses today. Go!", "Hoy no hay excusas. \xA1Ya!", "Pas d'excuses aujourd'hui. Go !", "Keine Ausreden heute. Los!", "Sem desculpas hoje. J\xE1!"],
  ["Concentrato. Ogni ripetizione conta!", "Focus. Every rep counts!", "Concentrado. \xA1Cada repetici\xF3n cuenta!", "Concentr\xE9. Chaque r\xE9p\xE9tition compte !", "Konzentration. Jede Wiederholung z\xE4hlt!", "Concentrado. Cada repeti\xE7\xE3o conta!"],
  ["Cos\xEC si fa!", "That's how it's done!", "\xA1As\xED se hace!", "C'est comme \xE7a qu'on fait !", "So wird's gemacht!", "\xC9 assim que se faz!"],
  ["Bravo, continua!", "Good, keep going!", "\xA1Bien, sigue!", "Bien, continue !", "Gut, weiter!", "Boa, continue!"],
  ["Non fermarti adesso!", "Don't stop now!", "\xA1No te pares ahora!", "Ne t'arr\xEAte pas maintenant !", "H\xF6r jetzt nicht auf!", "N\xE3o pare agora!"],
  ["Questo \xE8 il ritmo giusto!", "That's the right pace!", "\xA1Ese es el ritmo!", "C'est le bon rythme !", "Genau das richtige Tempo!", "Esse \xE9 o ritmo certo!"],
  ["Sei pi\xF9 forte di quanto pensi!", "You're stronger than you think!", "\xA1Eres m\xE1s fuerte de lo que crees!", "Tu es plus fort que tu ne le crois !", "Du bist st\xE4rker, als du denkst!", "Voc\xEA \xE9 mais forte do que pensa!"],
  ["Il dolore passa, l'orgoglio resta!", "Pain fades, pride stays!", "\xA1El dolor pasa, el orgullo queda!", "La douleur passe, la fiert\xE9 reste !", "Der Schmerz vergeht, der Stolz bleibt!", "A dor passa, o orgulho fica!"],
  ["Spingi forte!", "Push hard!", "\xA1Empuja fuerte!", "Pousse fort !", "Dr\xFCck kr\xE4ftig!", "For\xE7a total!"],
  ["Ottima forma, avanti!", "Great form, keep going!", "\xA1Muy buena t\xE9cnica, adelante!", "Excellente forme, continue !", "Saubere Technik, weiter!", "\xD3tima execu\xE7\xE3o, em frente!"],
  ["Met\xE0 fatta! Adesso viene il bello!", "Halfway there! Now the fun starts!", "\xA1Mitad hecha! \xA1Ahora viene lo bueno!", "La moiti\xE9 ! Maintenant le meilleur arrive !", "Halbzeit! Jetzt wird's spannend!", "Metade feita! Agora vem a parte boa!"],
  ["Sei a met\xE0 strada. Non mollare!", "You're halfway. Don't give up!", "Vas por la mitad. \xA1No te rindas!", "Tu es \xE0 mi-chemin. Ne l\xE2che rien !", "Du hast die H\xE4lfte. Nicht aufgeben!", "Voc\xEA est\xE1 na metade. N\xE3o desista!"],
  ["Ultime tre! Dai tutto!", "Last three! Give it everything!", "\xA1\xDAltimas tres! \xA1Dalo todo!", "Les trois derni\xE8res ! Donne tout !", "Die letzten drei! Gib alles!", "\xDAltimas tr\xEAs! D\xEA tudo!"],
  ["Tre alla fine! Stringi i denti!", "Three to go! Grit your teeth!", "\xA1Quedan tres! \xA1Aprieta los dientes!", "Plus que trois ! Serre les dents !", "Noch drei! Z\xE4hne zusammenbei\xDFen!", "Faltam tr\xEAs! Cerre os dentes!"],
  ["Ultima! Tutto quello che hai!", "Last one! Everything you've got!", "\xA1La \xFAltima! \xA1Todo lo que tienes!", "La derni\xE8re ! Tout ce que tu as !", "Die letzte! Alles, was du hast!", "A \xFAltima! Tudo o que voc\xEA tem!"],
  ["L'ultima \xE8 la pi\xF9 importante. Spingi!", "The last one matters most. Push!", "La \xFAltima es la m\xE1s importante. \xA1Empuja!", "La derni\xE8re est la plus importante. Pousse !", "Die letzte ist die wichtigste. Dr\xFCck!", "A \xFAltima \xE9 a mais importante. For\xE7a!"],
  ["Non mollare! Su!", "Don't quit! Come on!", "\xA1No te rindas! \xA1Vamos!", "Ne l\xE2che pas ! Allez !", "Nicht aufgeben! Los!", "N\xE3o desista! Vamos!"],
  ["Avanti, non ti ho detto di riposare!", "Move it, I didn't tell you to rest!", "\xA1Vamos, no te he dicho que descanses!", "Allez, je ne t'ai pas dit de te reposer !", "Weiter, ich habe nicht gesagt, dass du Pause machen sollst!", "Vamos, eu n\xE3o mandei descansar!"],
  ["Rialzati e continua!", "Get up and keep going!", "\xA1Lev\xE1ntate y sigue!", "Rel\xE8ve-toi et continue !", "Steh auf und mach weiter!", "Levante e continue!"],
  ["Respira e spingi! Ancora una!", "Breathe and push! One more!", "\xA1Respira y empuja! \xA1Una m\xE1s!", "Respire et pousse ! Encore une !", "Atme und dr\xFCck! Noch eine!", "Respire e empurre! Mais uma!"],
  ["Il traguardo \xE8 vicino, muoviti!", "The finish is close, move it!", "\xA1La meta est\xE1 cerca, mu\xE9vete!", "L'arriv\xE9e est proche, bouge-toi !", "Das Ziel ist nah, beweg dich!", "A chegada est\xE1 perto, mexa-se!"],
  ["Chi molla adesso? Non tu!", "Who quits now? Not you!", "\xBFQui\xE9n se rinde ahora? \xA1T\xFA no!", "Qui abandonne maintenant ? Pas toi !", "Wer gibt jetzt auf? Du nicht!", "Quem desiste agora? Voc\xEA n\xE3o!"],
  ["Tieni duro!", "Hang in there!", "\xA1Aguanta!", "Tiens bon !", "Halte durch!", "Aguente firme!"],
  ["Addome di ferro, non cedere!", "Iron core, don't give in!", "\xA1Abdomen de hierro, no cedas!", "Abdos d'acier, ne l\xE2che pas !", "Bauch aus Stahl, nicht nachgeben!", "Abd\xF4men de ferro, n\xE3o ceda!"],
  ["Il corpo vuole fermarsi, la testa no!", "Your body wants to stop, your mind doesn't!", "\xA1El cuerpo quiere parar, la cabeza no!", "Le corps veut s'arr\xEAter, la t\xEAte non !", "Der K\xF6rper will aufh\xF6ren, der Kopf nicht!", "O corpo quer parar, a cabe\xE7a n\xE3o!"],
  ["Respira. Resisti!", "Breathe. Hold on!", "Respira. \xA1Resiste!", "Respire. R\xE9siste !", "Atme. Halte durch!", "Respire. Resista!"],
  ["Ultimi secondi! Tieni duro!", "Last seconds! Hang in there!", "\xA1\xDAltimos segundos! \xA1Aguanta!", "Derni\xE8res secondes ! Tiens bon !", "Letzte Sekunden! Halte durch!", "\xDAltimos segundos! Aguente firme!"],
  ["Serie completata! Ottimo lavoro!", "Set complete! Great work!", "\xA1Serie completada! \xA1Buen trabajo!", "S\xE9rie termin\xE9e ! Excellent travail !", "Satz geschafft! Starke Arbeit!", "S\xE9rie conclu\xEDda! \xD3timo trabalho!"],
  ["Questo \xE8 lo spirito! Serie chiusa!", "That's the spirit! Set done!", "\xA1Ese es el esp\xEDritu! \xA1Serie cerrada!", "Voil\xE0 l'esprit ! S\xE9rie boucl\xE9e !", "So ist's richtig! Satz erledigt!", "Esse \xE9 o esp\xEDrito! S\xE9rie fechada!"],
  ["Bravo! Un passo pi\xF9 vicino al prossimo livello!", "Well done! One step closer to the next level!", "\xA1Bien! \xA1Un paso m\xE1s cerca del pr\xF3ximo nivel!", "Bravo ! Un pas de plus vers le prochain niveau !", "Gut gemacht! Ein Schritt n\xE4her am n\xE4chsten Level!", "Muito bem! Um passo mais perto do pr\xF3ximo n\xEDvel!"],
  ["Respira. Recupera. Tra poco si riparte.", "Breathe. Recover. We go again soon.", "Respira. Recupera. Enseguida seguimos.", "Respire. R\xE9cup\xE8re. On repart bient\xF4t.", "Atme. Erhol dich. Gleich geht's weiter.", "Respire. Recupere. Logo recome\xE7amos."],
  ["Bevi un sorso d'acqua. Il prossimo giro \xE8 tuo.", "Have a sip of water. The next round is yours.", "Bebe un sorbo de agua. La pr\xF3xima ronda es tuya.", "Bois une gorg\xE9e d'eau. Le prochain tour est \xE0 toi.", "Trink einen Schluck Wasser. Die n\xE4chste Runde geh\xF6rt dir.", "Beba um gole de \xE1gua. A pr\xF3xima rodada \xE9 sua."],
  ["Trenta secondi! Accelera!", "Thirty seconds! Speed up!", "\xA1Treinta segundos! \xA1Acelera!", "Trente secondes ! Acc\xE9l\xE8re !", "Drei\xDFig Sekunden! Gib Gas!", "Trinta segundos! Acelere!"],
  ["Dieci secondi! Tutto quello che hai!", "Ten seconds! Everything you've got!", "\xA1Diez segundos! \xA1Todo lo que tienes!", "Dix secondes ! Tout ce que tu as !", "Zehn Sekunden! Alles, was du hast!", "Dez segundos! Tudo o que voc\xEA tem!"],
  ["Sei in testa! Non rallentare!", "You're in the lead! Don't slow down!", "\xA1Vas en cabeza! \xA1No aflojes!", "Tu es en t\xEAte ! Ne ralentis pas !", "Du f\xFChrst! Nicht langsamer werden!", "Voc\xEA est\xE1 na frente! N\xE3o diminua!"],
  ["Stai vincendo, chiudi la partita!", "You're winning, finish it off!", "\xA1Vas ganando, cierra el reto!", "Tu gagnes, termine le travail !", "Du gewinnst, bring es zu Ende!", "Voc\xEA est\xE1 vencendo, feche a partida!"],
  ["Ti sta superando! Reagisci!", "They're overtaking you! Fight back!", "\xA1Te est\xE1 adelantando! \xA1Reacciona!", "Il te d\xE9passe ! R\xE9agis !", "Du wirst \xFCberholt! Wehr dich!", "Est\xE3o passando voc\xEA! Reaja!"],
  ["Sei indietro! Adesso o mai pi\xF9!", "You're behind! Now or never!", "\xA1Vas por detr\xE1s! \xA1Ahora o nunca!", "Tu es derri\xE8re ! C'est maintenant ou jamais !", "Du liegst hinten! Jetzt oder nie!", "Voc\xEA est\xE1 atr\xE1s! Agora ou nunca!"],
  ["Ci sono! Da adesso ti sprono io.", "I'm on it! From now on I'll keep you going.", "\xA1Aqu\xED estoy! A partir de ahora te animo yo.", "C'est parti ! D\xE9sormais je te motive.", "Bin dabei! Ab jetzt feuere ich dich an.", "Estou aqui! A partir de agora eu te incentivo."],
  ["Dieci! Non fermarti adesso!", "Ten! Don't stop now!", "\xA1Diez! \xA1No te pares ahora!", "Dix ! Ne t'arr\xEAte pas maintenant !", "Zehn! H\xF6r jetzt nicht auf!", "Dez! N\xE3o pare agora!"],

  ["Premi", "Prizes", "Premios", "Prix", "Preise", "Pr\xEAmios"],
  ["I primi 3 a fine mese sbloccano per tutto il mese successivo:", "The top 3 at the end of the month unlock for the whole next month:", "Los 3 primeros a final de mes desbloquean durante todo el mes siguiente:", "Les 3 premiers en fin de mois d\xE9bloquent pour tout le mois suivant :", "Die Top 3 am Monatsende schalten f\xFCr den ganzen n\xE4chsten Monat frei:", "Os 3 primeiros no fim do m\xEAs desbloqueiam durante todo o m\xEAs seguinte:"],
  ["La classifica \xE8 mensile: il primo di ogni mese i punti del mese ripartono da zero. I punti totali e il livello restano.", "The leaderboard is monthly: on the 1st of each month the monthly points start again from zero. Total points and level stay.", "La clasificaci\xF3n es mensual: el d\xEDa 1 de cada mes los puntos del mes vuelven a cero. Los puntos totales y el nivel se mantienen.", "Le classement est mensuel : le 1er de chaque mois, les points du mois repartent de z\xE9ro. Les points totaux et le niveau restent.", "Die Rangliste ist monatlich: Am 1. jedes Monats starten die Monatspunkte wieder bei null. Gesamtpunkte und Level bleiben.", "A classifica\xE7\xE3o \xE9 mensal: no dia 1 de cada m\xEAs os pontos do m\xEAs voltam a zero. Os pontos totais e o n\xEDvel continuam."],
  ["Ci sei tu e gli amici che hai sfidato: ogni sfida scambia nomi, livelli e punti.", "It's you and the friends you've challenged: every challenge swaps names, levels and points.", "Est\xE1s t\xFA y los amigos que has retado: cada reto intercambia nombres, niveles y puntos.", "Il y a toi et les amis que tu as d\xE9fi\xE9s : chaque d\xE9fi \xE9change noms, niveaux et points.", "Dabei sind du und die Freunde, die du herausgefordert hast: Jedes Duell tauscht Namen, Level und Punkte aus.", "Est\xE3o voc\xEA e os amigos que voc\xEA desafiou: cada desafio troca nomes, n\xEDveis e pontos."],
  ["Nella classifica mondiale ci sono tutti; sotto vedi anche te e gli amici che hai sfidato.", "Everyone is in the world leaderboard; below you also see yourself and the friends you've challenged.", "En la clasificaci\xF3n mundial est\xE1n todos; abajo ves tambi\xE9n a ti y a los amigos que has retado.", "Tout le monde est dans le classement mondial ; en dessous tu vois aussi toi et les amis d\xE9fi\xE9s.", "In der Weltrangliste sind alle; darunter siehst du dich und die Freunde, die du herausgefordert hast.", "Na classifica\xE7\xE3o mundial est\xE3o todos; abaixo voc\xEA v\xEA tamb\xE9m voc\xEA e os amigos que desafiou."],
  ["A fine mese i primi 3 vincono il premio (servono almeno 4 partecipanti).", "At the end of the month the top 3 win the prize (at least 4 players needed).", "A final de mes los 3 primeros ganan el premio (hacen falta al menos 4 participantes).", "En fin de mois, les 3 premiers gagnent le prix (il faut au moins 4 participants).", "Am Monatsende gewinnen die Top 3 den Preis (mindestens 4 Teilnehmer n\xF6tig).", "No fim do m\xEAs os 3 primeiros ganham o pr\xEAmio (s\xE3o necess\xE1rios pelo menos 4 participantes)."],
  ["I primi 3 della classifica mondiale a fine mese vincono il premio.", "The top 3 of the world leaderboard at the end of the month win the prize.", "Los 3 primeros de la clasificaci\xF3n mundial a final de mes ganan el premio.", "Les 3 premiers du classement mondial en fin de mois gagnent le prix.", "Die Top 3 der Weltrangliste am Monatsende gewinnen den Preis.", "Os 3 primeiros da classifica\xE7\xE3o mundial no fim do m\xEAs ganham o pr\xEAmio."],
  ["Chi vince 3 sfide di fila contro lo stesso avversario conquista una corona, che resta accanto al nome.", "Win 3 challenges in a row against the same opponent to earn a crown that stays next to your name.", "Quien gane 3 retos seguidos contra el mismo rival conquista una corona que queda junto a su nombre.", "Gagne 3 d\xE9fis d'affil\xE9e contre le m\xEAme adversaire pour conqu\xE9rir une couronne qui reste \xE0 c\xF4t\xE9 de ton nom.", "Wer 3 Duelle in Folge gegen denselben Gegner gewinnt, erobert eine Krone, die neben dem Namen bleibt.", "Quem vencer 3 desafios seguidos contra o mesmo advers\xE1rio conquista uma coroa que fica ao lado do nome."],
  ["I primi 3 a fine mese sbloccano per tutto il mese successivo:", "The top 3 at the end of the month unlock for the whole next month:", "Los 3 primeros a final de mes desbloquean durante todo el mes siguiente:", "Le top 3 en fin de mois d\xE9bloque pour tout le mois suivant :", "Die Top 3 am Monatsende schalten f\xFCr den ganzen n\xE4chsten Monat frei:", "Os 3 primeiros no fim do m\xEAs desbloqueiam durante todo o m\xEAs seguinte:"],
  ["Il tuo nome in classifica", "Your name on the leaderboard", "Tu nombre en la clasificaci\xF3n", "Ton nom dans le classement", "Dein Name in der Rangliste", "Seu nome no ranking"],
  ["Salva nome", "Save name", "Guardar nombre", "Enregistrer le nom", "Namen speichern", "Salvar nome"],

  ["Carico la classifica\u2026", "Loading the leaderboard\u2026", "Cargando la clasificaci\xF3n\u2026", "Chargement du classement\u2026", "Rangliste wird geladen\u2026", "Carregando o ranking\u2026"],
  ["Tu e gli amici che hai sfidato", "You and the friends you've challenged", "T\xFA y los amigos que has retado", "Toi et les amis que tu as d\xE9fi\xE9s", "Du und die Freunde, die du herausgefordert hast", "Voc\xEA e os amigos que desafiou"],
  ["Sfida un amico: dopo la prima sfida compare qui con il suo livello e i suoi punti.", "Challenge a friend: after your first challenge they show up here with their level and points.", "Reta a un amigo: tras el primer reto aparece aqu\xED con su nivel y sus puntos.", "D\xE9fie un ami : apr\xE8s le premier d\xE9fi, il appara\xEEt ici avec son niveau et ses points.", "Fordere einen Freund heraus: Nach dem ersten Duell erscheint er hier mit Level und Punkten.", "Desafie um amigo: depois do primeiro desafio ele aparece aqui com o n\xEDvel e os pontos."],
  ["Finch\xE9 la classifica mondiale non \xE8 attiva, il premio va ai primi 3 tra te e gli amici sfidati (servono almeno 4 partecipanti).", "Until the world leaderboard is live, the prize goes to the top 3 among you and the friends you've challenged (at least 4 players needed).", "Mientras la clasificaci\xF3n mundial no est\xE9 activa, el premio es para los 3 primeros entre t\xFA y tus amigos retados (hacen falta al menos 4).", "Tant que le classement mondial n'est pas actif, la r\xE9compense va au top 3 entre toi et tes amis d\xE9fi\xE9s (au moins 4 participants).", "Solange die Weltrangliste nicht aktiv ist, geht der Preis an die Top 3 unter dir und deinen Freunden (mindestens 4 Teilnehmer).", "Enquanto o ranking mundial n\xE3o estiver ativo, o pr\xEAmio vai para os 3 primeiros entre voc\xEA e os amigos desafiados (m\xEDnimo de 4 participantes)."],
  ["Nessuno in classifica questo mese: fai il primo allenamento e conquista il primo posto.", "Nobody on the leaderboard this month: do the first workout and take first place.", "Nadie en la clasificaci\xF3n este mes: haz el primer entrenamiento y ll\xE9vate el primer puesto.", "Personne au classement ce mois-ci : fais le premier entra\xEEnement et prends la premi\xE8re place.", "Diesen Monat steht noch niemand in der Rangliste: Trainiere als Erster und hol dir Platz eins.", "Ningu\xE9m no ranking este m\xEAs: fa\xE7a o primeiro treino e conquiste o primeiro lugar."],
  ["Non riesco a caricare la classifica. Controlla la connessione.", "I can't load the leaderboard. Check your connection.", "No puedo cargar la clasificaci\xF3n. Revisa la conexi\xF3n.", "Je n'arrive pas \xE0 charger le classement. V\xE9rifie ta connexion.", "Die Rangliste l\xE4sst sich nicht laden. Pr\xFCfe die Verbindung.", "N\xE3o consigo carregar o ranking. Verifique a conex\xE3o."],
  ["Non riesco a caricare la classifica. Riprova tra poco.", "I can't load the leaderboard. Try again shortly.", "No puedo cargar la clasificaci\xF3n. Int\xE9ntalo dentro de un rato.", "Je n'arrive pas \xE0 charger le classement. R\xE9essaie dans un instant.", "Die Rangliste l\xE4sst sich nicht laden. Versuch es gleich noch mal.", "N\xE3o consigo carregar o ranking. Tente daqui a pouco."],

  ["Telefono in verticale, di fronte a te, a 2\u20133 metri. Devi vedere dalla testa ai piedi.", "Phone upright, facing you, 2\u20133 metres away. You must be visible from head to feet.", "Tel\xE9fono en vertical, frente a ti, a 2\u20133 metros. Se te debe ver de la cabeza a los pies.", "T\xE9l\xE9phone \xE0 la verticale, face \xE0 toi, \xE0 2\u20133 m\xE8tres. On doit te voir de la t\xEAte aux pieds.", "Handy hochkant, vor dir, 2\u20133 Meter entfernt. Du musst von Kopf bis Fu\xDF zu sehen sein.", "Celular na vertical, de frente para voc\xEA, a 2\u20133 metros. Voc\xEA deve aparecer da cabe\xE7a aos p\xE9s."],
  ["In piedi, piedi uniti, mani giunte al petto.", "Stand with feet together, hands clasped at your chest.", "De pie, pies juntos, manos juntas al pecho.", "Debout, pieds joints, mains jointes devant la poitrine.", "Steh mit geschlossenen F\xFC\xDFen, H\xE4nde vor der Brust gefaltet.", "Em p\xE9, p\xE9s juntos, m\xE3os unidas no peito."],
  ["Salta aprendo i piedi e atterra in squat largo.", "Jump your feet apart and land in a wide squat.", "Salta abriendo los pies y cae en sentadilla abierta.", "Saute en \xE9cartant les pieds et atterris en squat large.", "Spring mit gegr\xE4tschten F\xFC\xDFen in eine breite Kniebeuge.", "Salte abrindo os p\xE9s e aterrisse em agachamento aberto."],
  ["Salta di nuovo richiudendo i piedi e risali.", "Jump again bringing your feet together and stand up.", "Salta otra vez juntando los pies y sube.", "Saute \xE0 nouveau en refermant les pieds et remonte.", "Spring wieder mit geschlossenen F\xFC\xDFen zur\xFCck und richte dich auf.", "Salte de novo fechando os p\xE9s e suba."],
  ["Atterra morbido, sulle punte e poi sui talloni.", "Land softly, toes first and then heels.", "Aterriza suave, primero puntas y luego talones.", "Atterris en douceur, sur la pointe puis sur les talons.", "Lande weich, erst auf den Zehen, dann auf den Fersen.", "Aterrisse suave, nas pontas e depois nos calcanhares."],
  ["Telefono a terra, di lato, a circa 2\u20133 metri. Devi vedere testa, piedi e il rialzo.", "Phone on the floor, side-on, about 2\u20133 metres away. Your head, feet and the box must be visible.", "Tel\xE9fono en el suelo, de lado, a unos 2\u20133 metros. Se deben ver la cabeza, los pies y el caj\xF3n.", "T\xE9l\xE9phone au sol, de c\xF4t\xE9, \xE0 environ 2\u20133 m\xE8tres. On doit voir la t\xEAte, les pieds et le support.", "Handy auf dem Boden, seitlich, etwa 2\u20133 Meter entfernt. Kopf, F\xFC\xDFe und Erh\xF6hung m\xFCssen zu sehen sein.", "Celular no ch\xE3o, de lado, a cerca de 2\u20133 metros. Devem aparecer a cabe\xE7a, os p\xE9s e o apoio."],
  ["Mettiti davanti a una sedia o a un rialzo stabile.", "Stand in front of a chair or a sturdy box.", "Ponte delante de una silla o un caj\xF3n estable.", "Place-toi devant une chaise ou un support stable.", "Stell dich vor einen Stuhl oder eine stabile Erh\xF6hung.", "Fique na frente de uma cadeira ou de um apoio firme."],
  ["Scendi con il bacino indietro finch\xE9 sfiori il rialzo, braccia avanti.", "Sit your hips back until you brush the box, arms forward.", "Baja llevando la cadera atr\xE1s hasta rozar el caj\xF3n, brazos al frente.", "Descends en reculant le bassin jusqu'\xE0 effleurer le support, bras devant.", "Schieb die H\xFCfte nach hinten, bis du die Erh\xF6hung ber\xFChrst, Arme nach vorn.", "Des\xE7a levando o quadril para tr\xE1s at\xE9 encostar no apoio, bra\xE7os \xE0 frente."],
  ["Non sederti del tutto: tocca e risali subito.", "Don't sit all the way: touch and come straight back up.", "No te sientes del todo: toca y sube enseguida.", "Ne t'assieds pas compl\xE8tement : touche et remonte aussit\xF4t.", "Setz dich nicht ganz hin: kurz antippen und sofort hoch.", "N\xE3o sente totalmente: encoste e suba logo."],
  ["Non arrivi al rialzo (non conta)", "You don't reach the box (doesn't count)", "No llegas al caj\xF3n (no cuenta)", "Tu n'atteins pas le support (ne compte pas)", "Du erreichst die Erh\xF6hung nicht (z\xE4hlt nicht)", "Voc\xEA n\xE3o chega ao apoio (n\xE3o conta)"],
  ["In piedi, mani giunte al petto, busto dritto.", "Stand tall, hands clasped at your chest.", "De pie, manos juntas al pecho, tronco recto.", "Debout, mains jointes devant la poitrine, buste droit.", "Steh aufrecht, H\xE4nde vor der Brust gefaltet.", "Em p\xE9, m\xE3os unidas no peito, tronco reto."],
  ["Fai un passo lungo all'indietro e scendi piegando entrambe le ginocchia.", "Take a long step back and lower by bending both knees.", "Da un paso largo hacia atr\xE1s y baja doblando ambas rodillas.", "Fais un grand pas en arri\xE8re et descends en pliant les deux genoux.", "Mach einen gro\xDFen Schritt zur\xFCck und geh mit beiden Knien in die Beuge.", "D\xEA um passo longo para tr\xE1s e des\xE7a dobrando os dois joelhos."],
  ["Il ginocchio dietro arriva vicino a terra.", "Your back knee comes close to the floor.", "La rodilla de atr\xE1s llega cerca del suelo.", "Le genou arri\xE8re arrive pr\xE8s du sol.", "Das hintere Knie kommt nah an den Boden.", "O joelho de tr\xE1s chega perto do ch\xE3o."],
  ["Torna su riportando la gamba avanti. Alterna i lati.", "Come back up bringing the leg forward. Alternate sides.", "Vuelve arriba llevando la pierna adelante. Alterna los lados.", "Remonte en ramenant la jambe devant. Alterne les c\xF4t\xE9s.", "Komm hoch und bring das Bein wieder nach vorn. Seiten wechseln.", "Volte trazendo a perna para frente. Alterne os lados."],
  ["Telefono in verticale, di fronte a te, a circa 3 metri. Devi vedere dalla testa ai piedi.", "Phone upright, facing you, about 3 metres away. You must be visible from head to feet.", "Tel\xE9fono en vertical, frente a ti, a unos 3 metros. Se te debe ver de la cabeza a los pies.", "T\xE9l\xE9phone \xE0 la verticale, face \xE0 toi, \xE0 environ 3 m\xE8tres. On doit te voir de la t\xEAte aux pieds.", "Handy hochkant, vor dir, etwa 3 Meter entfernt. Du musst von Kopf bis Fu\xDF zu sehen sein.", "Celular na vertical, de frente para voc\xEA, a cerca de 3 metros. Voc\xEA deve aparecer da cabe\xE7a aos p\xE9s."],
  ["Piedi larghi, mani giunte al petto.", "Feet wide, hands clasped at your chest.", "Pies separados, manos juntas al pecho.", "Pieds \xE9cart\xE9s, mains jointes devant la poitrine.", "F\xFC\xDFe weit auseinander, H\xE4nde vor der Brust gefaltet.", "P\xE9s afastados, m\xE3os unidas no peito."],
  ["Piega un ginocchio e sposta il peso su quel lato, l'altra gamba resta tesa.", "Bend one knee and shift your weight to that side, keeping the other leg straight.", "Dobla una rodilla y lleva el peso a ese lado, la otra pierna queda estirada.", "Plie un genou et porte le poids de ce c\xF4t\xE9, l'autre jambe reste tendue.", "Beuge ein Knie und verlagere das Gewicht auf diese Seite, das andere Bein bleibt gestreckt.", "Dobre um joelho e leve o peso para esse lado, a outra perna fica esticada."],
  ["Scendi finch\xE9 la coscia \xE8 quasi parallela al suolo.", "Lower until the thigh is almost parallel to the floor.", "Baja hasta que el muslo est\xE9 casi paralelo al suelo.", "Descends jusqu'\xE0 ce que la cuisse soit presque parall\xE8le au sol.", "Geh runter, bis der Oberschenkel fast parallel zum Boden ist.", "Des\xE7a at\xE9 a coxa ficar quase paralela ao ch\xE3o."],
  ["Torna al centro e alterna i lati.", "Return to the centre and alternate sides.", "Vuelve al centro y alterna los lados.", "Reviens au centre et alterne les c\xF4t\xE9s.", "Zur\xFCck zur Mitte und Seiten wechseln.", "Volte ao centro e alterne os lados."],
  ["Piedi troppo stretti", "Feet too close together", "Pies demasiado juntos", "Pieds trop serr\xE9s", "F\xFC\xDFe zu eng", "P\xE9s muito juntos"],
  ["Telefono a terra, di lato, a circa 3 metri. Devi vedere te e il rialzo.", "Phone on the floor, side-on, about 3 metres away. You and the step must be visible.", "Tel\xE9fono en el suelo, de lado, a unos 3 metros. Se te debe ver a ti y al escal\xF3n.", "T\xE9l\xE9phone au sol, de c\xF4t\xE9, \xE0 environ 3 m\xE8tres. On doit te voir avec la marche.", "Handy auf dem Boden, seitlich, etwa 3 Meter entfernt. Du und die Stufe m\xFCssen zu sehen sein.", "Celular no ch\xE3o, de lado, a cerca de 3 metros. Voc\xEA e o step devem aparecer."],
  ["Mettiti davanti a un gradino o a un rialzo stabile.", "Stand in front of a step or a sturdy box.", "Ponte delante de un escal\xF3n o un caj\xF3n estable.", "Place-toi devant une marche ou un support stable.", "Stell dich vor eine Stufe oder eine stabile Erh\xF6hung.", "Fique na frente de um degrau ou de um apoio firme."],
  ["Appoggia tutto il piede sul rialzo.", "Place your whole foot on the step.", "Apoya todo el pie en el escal\xF3n.", "Pose tout le pied sur la marche.", "Setz den ganzen Fu\xDF auf die Stufe.", "Apoie o p\xE9 inteiro no step."],
  ["Sali spingendo con quella gamba fino a stare dritto sopra.", "Push through that leg until you stand tall on top.", "Sube empujando con esa pierna hasta quedar recto arriba.", "Monte en poussant sur cette jambe jusqu'\xE0 \xEAtre droit dessus.", "Dr\xFCck dich mit diesem Bein hoch, bis du aufrecht oben stehst.", "Suba empurrando com essa perna at\xE9 ficar reto em cima."],
  ["Scendi controllando e alterna i lati.", "Step down with control and alternate sides.", "Baja con control y alterna los lados.", "Redescends en contr\xF4lant et alterne les c\xF4t\xE9s.", "Kontrolliert heruntersteigen und Seiten wechseln.", "Des\xE7a com controle e alterne os lados."],
  ["Non arrivi dritto in cima (non conta)", "You don't stand tall on top (doesn't count)", "No llegas recto arriba (no cuenta)", "Tu n'arrives pas droit en haut (ne compte pas)", "Du stehst oben nicht aufrecht (z\xE4hlt nicht)", "Voc\xEA n\xE3o fica reto em cima (n\xE3o conta)"],
  ["Telefono a terra, di lato, a circa 2 metri. Devi vedere te e il muro.", "Phone on the floor, side-on, about 2 metres away. You and the wall must be visible.", "Tel\xE9fono en el suelo, de lado, a unos 2 metros. Se te debe ver a ti y la pared.", "T\xE9l\xE9phone au sol, de c\xF4t\xE9, \xE0 environ 2 m\xE8tres. On doit te voir avec le mur.", "Handy auf dem Boden, seitlich, etwa 2 Meter entfernt. Du und die Wand m\xFCssen zu sehen sein.", "Celular no ch\xE3o, de lado, a cerca de 2 metros. Voc\xEA e a parede devem aparecer."],
  ["Schiena appoggiata al muro, piedi avanti alla larghezza delle anche.", "Back against the wall, feet forward at hip width.", "Espalda apoyada en la pared, pies adelante a la anchura de la cadera.", "Dos contre le mur, pieds devant \xE0 largeur de hanches.", "R\xFCcken an der Wand, F\xFC\xDFe h\xFCftbreit nach vorn.", "Costas apoiadas na parede, p\xE9s \xE0 frente na largura do quadril."],
  ["Scivola gi\xF9 finch\xE9 le ginocchia sono a 90\xB0.", "Slide down until your knees are at 90\xB0.", "Desliza hacia abajo hasta que las rodillas est\xE9n a 90\xB0.", "Glisse vers le bas jusqu'\xE0 ce que les genoux soient \xE0 90\xB0.", "Rutsch nach unten, bis die Knie bei 90\xB0 sind.", "Deslize para baixo at\xE9 os joelhos ficarem a 90\xB0."],
  ["Mani sulle cosce, schiena tutta appoggiata.", "Hands on your thighs, whole back against the wall.", "Manos sobre los muslos, toda la espalda apoyada.", "Mains sur les cuisses, tout le dos appuy\xE9.", "H\xE4nde auf den Oberschenkeln, ganzer R\xFCcken an der Wand.", "M\xE3os nas coxas, costas inteiras apoiadas."],
  ["Non scendi abbastanza", "Not low enough", "No bajas lo suficiente", "Tu ne descends pas assez", "Nicht tief genug", "Voc\xEA n\xE3o desce o suficiente"],
  ["Scendi troppo", "Too low", "Bajas demasiado", "Tu descends trop", "Zu tief", "Voc\xEA desce demais"],
  ["Mani pi\xF9 larghe delle spalle, corpo dritto. Puoi appoggiare le ginocchia.", "Hands wider than your shoulders, body straight. You can rest on your knees.", "Manos m\xE1s abiertas que los hombros, cuerpo recto. Puedes apoyar las rodillas.", "Mains plus \xE9cart\xE9es que les \xE9paules, corps droit. Tu peux poser les genoux.", "H\xE4nde weiter als schulterbreit, K\xF6rper gerade. Du kannst die Knie aufsetzen.", "M\xE3os mais abertas que os ombros, corpo reto. Pode apoiar os joelhos."],
  ["Contrai addome e glutei.", "Brace your abs and glutes.", "Contrae abdomen y gl\xFAteos.", "Contracte abdos et fessiers.", "Spann Bauch und Po an.", "Contraia abd\xF4men e gl\xFAteos."],
  ["Scendi con il petto verso terra, gomiti verso l'esterno.", "Lower your chest to the floor, elbows out.", "Baja el pecho hacia el suelo, codos hacia fuera.", "Descends la poitrine vers le sol, coudes vers l'ext\xE9rieur.", "Senk die Brust zum Boden, Ellbogen nach au\xDFen.", "Des\xE7a o peito em dire\xE7\xE3o ao ch\xE3o, cotovelos para fora."],
  ["Seduta a terra, mani dietro di te, ginocchia piegate, piedi a terra.", "Sit on the floor, hands behind you, knees bent, feet flat.", "Sentada en el suelo, manos detr\xE1s, rodillas dobladas, pies en el suelo.", "Assise au sol, mains derri\xE8re toi, genoux pli\xE9s, pieds au sol.", "Setz dich auf den Boden, H\xE4nde hinter dir, Knie gebeugt, F\xFC\xDFe am Boden.", "Sentada no ch\xE3o, m\xE3os atr\xE1s de voc\xEA, joelhos dobrados, p\xE9s no ch\xE3o."],
  ["Spingi il bacino in alto finch\xE9 il corpo forma un tavolo.", "Push your hips up until your body forms a table.", "Empuja la cadera hacia arriba hasta que el cuerpo forme una mesa.", "Pousse le bassin vers le haut jusqu'\xE0 former une table.", "Dr\xFCck die H\xFCfte hoch, bis dein K\xF6rper einen Tisch bildet.", "Empurre o quadril para cima at\xE9 o corpo formar uma mesa."],
  ["Stringi i glutei per un istante.", "Squeeze your glutes for a moment.", "Aprieta los gl\xFAteos un instante.", "Serre les fessiers un instant.", "Spann den Po kurz an.", "Aperte os gl\xFAteos por um instante."],
  ["Torna gi\xF9 controllando, senza sederti del tutto.", "Lower with control, without sitting all the way down.", "Baja con control, sin sentarte del todo.", "Redescends en contr\xF4lant, sans t'asseoir compl\xE8tement.", "Kontrolliert absenken, ohne dich ganz hinzusetzen.", "Des\xE7a com controle, sem sentar totalmente."],
  ["Bacino non abbastanza alto (non conta)", "Hips not high enough (doesn't count)", "Cadera no suficientemente alta (no cuenta)", "Bassin pas assez haut (ne compte pas)", "H\xFCfte nicht hoch genug (z\xE4hlt nicht)", "Quadril n\xE3o alto o suficiente (n\xE3o conta)"],
  ["Supina, ginocchia piegate, piedi sollevati o a terra.", "Lie on your back, knees bent, feet raised or on the floor.", "Boca arriba, rodillas dobladas, pies elevados o en el suelo.", "Sur le dos, genoux pli\xE9s, pieds lev\xE9s ou au sol.", "R\xFCckenlage, Knie gebeugt, F\xFC\xDFe angehoben oder am Boden.", "Deitada de costas, joelhos dobrados, p\xE9s elevados ou no ch\xE3o."],
  ["Braccia incrociate sul petto.", "Arms crossed on your chest.", "Brazos cruzados sobre el pecho.", "Bras crois\xE9s sur la poitrine.", "Arme vor der Brust verschr\xE4nkt.", "Bra\xE7os cruzados sobre o peito."],
  ["Solleva le spalle da terra contraendo l'addome.", "Lift your shoulders off the floor by tightening your abs.", "Levanta los hombros del suelo contrayendo el abdomen.", "D\xE9colle les \xE9paules du sol en contractant les abdos.", "Heb die Schultern vom Boden, indem du den Bauch anspannst.", "Levante os ombros do ch\xE3o contraindo o abd\xF4men."],
  ["Torna gi\xF9 lentamente.", "Lower back down slowly.", "Vuelve abajo despacio.", "Redescends lentement.", "Langsam wieder absenken.", "Des\xE7a devagar."],
  ["Spalle non abbastanza sollevate (non conta)", "Shoulders not lifted enough (doesn't count)", "Hombros no suficientemente levantados (no cuenta)", "\xC9paules pas assez d\xE9coll\xE9es (ne compte pas)", "Schultern nicht genug angehoben (z\xE4hlt nicht)", "Ombros n\xE3o levantados o suficiente (n\xE3o conta)"],

  ["Solleva le gambe tese da terra.", "Lift your straight legs off the floor.", "Levanta las piernas estiradas del suelo.", "D\xE9colle les jambes tendues du sol.", "Heb die gestreckten Beine vom Boden.", "Levante as pernas esticadas do ch\xE3o."],

  ["Il tempo scorre solo con le gambe sollevate.", "The timer only runs while your legs are up.", "El tiempo solo corre con las piernas levantadas.", "Le temps ne d\xE9file que jambes lev\xE9es.", "Die Zeit l\xE4uft nur mit angehobenen Beinen.", "O tempo s\xF3 corre com as pernas levantadas."],

  ["Sali fino in cima, gamba distesa! Non conta", "Step all the way up, leg straight! Doesn't count", "\xA1Sube hasta arriba, pierna estirada! No cuenta", "Monte jusqu'en haut, jambe tendue ! \xC7a ne compte pas", "Ganz nach oben, Bein gestreckt! Z\xE4hlt nicht", "Suba at\xE9 o topo, perna esticada! N\xE3o conta"],

  ["Eliminare l'account e il backup online? Non si pu\xF2 annullare. I dati su questo telefono restano.", "Delete your account and online backup? This can't be undone. The data on this phone stays.", "\xBFEliminar la cuenta y la copia online? No se puede deshacer. Los datos de este m\xF3vil se quedan.", "Supprimer le compte et la sauvegarde en ligne ? C'est d\xE9finitif. Les donn\xE9es de ce t\xE9l\xE9phone restent.", "Konto und Online-Backup l\xF6schen? Das l\xE4sst sich nicht r\xFCckg\xE4ngig machen. Die Daten auf diesem Handy bleiben.", "Excluir a conta e o backup online? N\xE3o d\xE1 para desfazer. Os dados deste celular ficam."],
  ["Sul tuo account c'\xE8 un backup con pi\xF9 punti di questo telefono.", "Your account has a backup with more points than this phone.", "Tu cuenta tiene una copia con m\xE1s puntos que este m\xF3vil.", "Ton compte a une sauvegarde avec plus de points que ce t\xE9l\xE9phone.", "Dein Konto hat ein Backup mit mehr Punkten als dieses Handy.", "Sua conta tem um backup com mais pontos que este celular."],
  ["Vuoi recuperarlo? Se scegli Annulla, il backup verr\xE0 sostituito con i dati di questo telefono.", "Restore it? If you choose Cancel, the backup will be replaced with this phone's data.", "\xBFRecuperarla? Si eliges Cancelar, la copia se sustituir\xE1 por los datos de este m\xF3vil.", "La r\xE9cup\xE9rer ? Si tu choisis Annuler, la sauvegarde sera remplac\xE9e par les donn\xE9es de ce t\xE9l\xE9phone.", "Wiederherstellen? Wenn du Abbrechen w\xE4hlst, wird das Backup durch die Daten dieses Handys ersetzt.", "Recuperar? Se escolher Cancelar, o backup ser\xE1 substitu\xEDdo pelos dados deste celular."],

  ["FitQuest legge solo i tuoi passi, anche quelli dei 30 giorni passati. Il telefono li conta tutto il giorno, anche con l'app chiusa.", "FitQuest only reads your steps, including the past 30 days. Your phone counts them all day, even with the app closed.", "FitQuest solo lee tus pasos, tambi\xE9n los de los \xFAltimos 30 d\xEDas. El m\xF3vil los cuenta todo el d\xEDa, incluso con la app cerrada.", "FitQuest lit seulement tes pas, y compris ceux des 30 derniers jours. Ton t\xE9l\xE9phone les compte toute la journ\xE9e, m\xEAme app ferm\xE9e.", "FitQuest liest nur deine Schritte, auch die der letzten 30 Tage. Dein Handy z\xE4hlt sie den ganzen Tag, auch wenn die App geschlossen ist.", "O FitQuest s\xF3 l\xEA seus passos, inclusive os dos \xFAltimos 30 dias. O celular conta o dia todo, mesmo com o app fechado."],

  ["Permesso del contapassi negato. Puoi riattivarlo dalle impostazioni del browser.", "Step counter permission denied. You can turn it back on in your browser settings.", "Permiso del pod\xF3metro denegado. Puedes activarlo en los ajustes del navegador.", "Autorisation du podom\xE8tre refus\xE9e. Tu peux la r\xE9activer dans les r\xE9glages du navigateur.", "Schrittz\xE4hler-Berechtigung verweigert. Du kannst sie in den Browser-Einstellungen wieder erlauben.", "Permiss\xE3o do contador de passos negada. Voc\xEA pode reativ\xE1-la nas configura\xE7\xF5es do navegador."],

  ["Troppi passi in pochissimo tempo: quell'aggiornamento non \xE8 stato contato.", "Too many steps in very little time: that update wasn't counted.", "Demasiados pasos en muy poco tiempo: esa actualizaci\xF3n no se ha contado.", "Trop de pas en tr\xE8s peu de temps : cette mise \xE0 jour n'a pas \xE9t\xE9 compt\xE9e.", "Zu viele Schritte in sehr kurzer Zeit: Diese Aktualisierung wurde nicht gez\xE4hlt.", "Passos demais em pouqu\xEDssimo tempo: essa atualiza\xE7\xE3o n\xE3o foi contada."],

  ["Sul sito i passi si contano solo con FitQuest aperta e lo schermo acceso, e non danno WalkPoints.", "On the website steps only count with FitQuest open and the screen on, and they don't give WalkPoints.", "En la web los pasos solo se cuentan con FitQuest abierta y la pantalla encendida, y no dan WalkPoints.", "Sur le site, les pas ne comptent qu'avec FitQuest ouverte et l'\xE9cran allum\xE9, et ne donnent pas de WalkPoints.", "Auf der Website z\xE4hlen Schritte nur bei ge\xF6ffnetem FitQuest und eingeschaltetem Bildschirm und geben keine WalkPoints.", "No site os passos s\xF3 contam com o FitQuest aberto e a tela ligada, e n\xE3o d\xE3o WalkPoints."],

  ["Senza il permesso ai passi la camminata nell'app non pu\xF2 contare i passi. Puoi attivarlo in Privacy e permessi.", "Without step permission the app can't count the walk's steps. You can turn it on in Privacy and permissions.", "Sin permiso de pasos la app no puede contar los pasos de la caminata. Puedes activarlo en Privacidad y permisos.", "Sans l'autorisation des pas, l'app ne peut pas compter les pas de la marche. Tu peux l'activer dans Confidentialit\xE9 et autorisations.", "Ohne Schritt-Berechtigung kann die App die Schritte nicht z\xE4hlen. Du kannst sie unter Datenschutz und Berechtigungen aktivieren.", "Sem permiss\xE3o de passos o app n\xE3o conta os passos da caminhada. Voc\xEA pode ativar em Privacidade e permiss\xF5es."],
