<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>FitLoo · Premi dei giochi</title>
<link rel="icon" href="../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --bg:#f3f5f9; --panel:#fff; --line:#e1e6ee; --fg:#16202c; --muted:#667283; --acc:#2e86de; --soft:#e6f1fc; --ok:#24a148; --bad:#e0473a; --gold:#c9971c; --pro:#b02a91; --prosoft:#f8e6f3;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif; --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg:#0b1220; --panel:#151e2d; --line:#27344b; --fg:#eef2f8; --muted:#9aa8bb; --soft:#16304d; --prosoft:#3a1733; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 var(--f-body); }
main { max-width:880px; margin:0 auto; padding:18px 16px 60px; }
h1,h2 { font-family:var(--f-display); letter-spacing:.01em; margin:0; }
h1 { font-size:30px; } h2 { font-size:22px; margin-bottom:10px; }
.top { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
.who { color:var(--muted); font-size:14px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:14px; }
.kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.kpi { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; }
.kpi b { display:block; font:700 28px var(--f-display); }
.kpi span { color:var(--muted); font-size:13px; }
.chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.chip { border:1px solid var(--line); background:var(--panel); color:var(--fg); border-radius:999px; padding:7px 14px; font:600 15px var(--f-body); cursor:pointer; }
.chip[aria-pressed=true] { background:var(--acc); border-color:var(--acc); color:#fff; }
.tier { border-radius:12px; padding:12px; margin-top:10px; }
.tier.pro { background:var(--prosoft); } .tier.free { background:var(--soft); }
.tier h3 { margin:0 0 8px; font:700 18px var(--f-display); }
.row { display:grid; grid-template-columns:34px 1fr; gap:8px; align-items:start; margin-top:8px; }
.medal { font-size:24px; line-height:38px; text-align:center; }
.fields { display:grid; grid-template-columns:1fr; gap:6px; }
.fields.free { grid-template-columns:1fr 110px; }
.fields .wide { grid-column:1/-1; }
input, textarea { width:100%; border:1px solid var(--line); background:var(--panel); color:var(--fg); border-radius:10px; padding:9px 10px; font:15px var(--f-body); }
textarea { resize:vertical; min-height:40px; }
label.small { font-size:12px; color:var(--muted); display:block; margin-bottom:2px; }
.btn { border:0; border-radius:12px; padding:11px 18px; font:700 16px var(--f-body); background:var(--acc); color:#fff; cursor:pointer; }
.btn.ghost { background:transparent; border:1px solid var(--line); color:var(--fg); }
.btn.small { padding:6px 12px; font-size:14px; }
.btn:disabled { opacity:.5; cursor:default; }
.actions { display:flex; gap:10px; align-items:center; margin-top:12px; flex-wrap:wrap; }
.msg { font-size:14px; color:var(--muted); }
.msg.ok { color:var(--ok); } .msg.bad { color:var(--bad); }
.note { font-size:13px; color:var(--muted); margin:6px 0 0; }
table { width:100%; border-collapse:collapse; font-size:15px; }
th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
th { font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
td.n { text-align:right; font-variant-numeric:tabular-nums; }
.em { color:var(--muted); font-size:13px; word-break:break-all; }
.tag { display:inline-block; border-radius:999px; padding:2px 9px; font-size:12px; font-weight:600; }
.tag.pro { background:var(--pro); color:#fff; } .tag.free { background:var(--acc); color:#fff; }
.tag.ok { background:var(--ok); color:#fff; } .tag.wait { background:var(--line); color:var(--fg); }
.empty { color:var(--muted); padding:8px 0; }
.photo { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.photo .ph { width:72px; height:72px; border-radius:12px; border:1px dashed var(--line); background:var(--panel) center/cover no-repeat; display:grid; place-items:center; color:var(--muted); font-size:26px; flex:none; }
.photo .ph.has { border-style:solid; }
.photo input[type=file] { display:none; }
.photo .pmsg { font-size:13px; color:var(--muted); }
.assist { display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; background:linear-gradient(120deg, var(--soft), var(--prosoft)); border-radius:12px; padding:12px; margin-bottom:12px; }
.assist b { display:block; } .assist span { font-size:14px; color:var(--muted); }
.draft { background:var(--soft); border:1px solid var(--acc); border-radius:12px; padding:10px 12px; margin-bottom:10px; font-size:14px; }
.form3 { display:grid; grid-template-columns:1fr 90px 1fr auto; gap:8px; align-items:end; }
.center { text-align:center; padding:30px 10px; }
.poster-ed { display:grid; grid-template-columns:1fr minmax(0,360px); gap:14px; align-items:start; margin-top:6px; }
.themes { display:flex; gap:8px; flex-wrap:wrap; }
.theme { width:44px; height:44px; border-radius:12px; border:2px solid transparent; cursor:pointer; padding:0; }
.theme[aria-pressed=true] { border-color:var(--fg); box-shadow:0 0 0 2px var(--panel) inset; }
.theme.th-oro { background:linear-gradient(150deg,#2a1a00,#7a4b00); } .theme.th-notte { background:linear-gradient(150deg,#0b1130,#3a2a8a); }
.theme.th-energia { background:linear-gradient(150deg,#c3124a,#ff8a2b); } .theme.th-estate { background:linear-gradient(150deg,#0087b8,#f2a500); }
.theme.th-inverno { background:linear-gradient(150deg,#173a73,#5aa7e8); }
.langs { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:8px; }
.langs .chip { padding:4px 10px; font-size:13px; }
.tr-ok { color:var(--ok); } .tr-no { color:var(--gold); }
.pv { max-width:360px; }
.pv .gm-poster { font-family:var(--f-body); }
@media (max-width:720px) { .poster-ed { grid-template-columns:1fr; } }
/* the same poster as the app (from prova/games.css) */
.gm-pro { display: inline-block; font-style: normal; font-family: var(--f-display); font-weight: 800; font-size: 11px; letter-spacing: .08em; padding: 2px 7px; border-radius: 999px; color: #3a2400; background: linear-gradient(135deg, #ffe08a, #f5a623); vertical-align: middle; box-shadow: 0 2px 8px rgba(245,166,35,.35); }
/* the Pro poster on the prize board */
.gm-poster { --p1: #2a1a00; --p2: #7a4b00; --pa: #ffd36b; --pt: #fff8e6; --ps: rgba(255,248,230,.78); --pc: rgba(255,255,255,.12);
  position: relative; overflow: hidden; border-radius: 22px; padding: 16px; color: var(--pt); background: linear-gradient(150deg, var(--p1), var(--p2)); box-shadow: 0 14px 30px rgba(0,0,0,.22); display: grid; gap: 12px; }
.gm-poster.th-notte { --p1: #0b1130; --p2: #3a2a8a; --pa: #9fb8ff; }
.gm-poster.th-energia { --p1: #c3124a; --p2: #ff8a2b; --pa: #fff1a8; }
.gm-poster.th-estate { --p1: #0087b8; --p2: #f2a500; --pa: #fff4b8; }
.gm-poster.th-inverno { --p1: #173a73; --p2: #5aa7e8; --pa: #e4f3ff; }
.gm-pt-glow { position: absolute; inset: -40% -30% auto auto; width: 70%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.28), transparent 65%); pointer-events: none; }
.gm-pt-h { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
.gm-pt-k { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-display); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
.gm-pt-m { text-transform: capitalize; color: var(--ps); font-weight: 600; }
.gm-pt-hl { position: relative; margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(26px, 8vw, 36px); line-height: 1; text-transform: uppercase; color: var(--pa); text-wrap: balance; text-shadow: 0 2px 12px rgba(0,0,0,.25); }
.gm-pt-1 { position: relative; display: grid; grid-template-columns: 112px 1fr; gap: 12px; align-items: center; padding: 10px; border-radius: 16px; background: var(--pc); }
.gm-pt-img { width: 112px; height: 112px; border-radius: 14px; object-fit: cover; background: rgba(255,255,255,.9); }
.gm-pt-img.s { width: 100%; height: auto; aspect-ratio: 4 / 3; }
.gm-pt-medal { display: grid; place-items: center; font-size: 52px; background: rgba(255,255,255,.14); }
.gm-pt-img.s.gm-pt-medal { font-size: 38px; }
.gm-pt-1t { display: grid; gap: 4px; min-width: 0; }
.gm-pt-pl { justify-self: start; font-family: var(--f-display); font-weight: 800; font-size: 13px; padding: 2px 9px; border-radius: 999px; background: var(--pa); color: #1d1300; }
.gm-poster b { color: var(--pt); font-size: 16px; line-height: 1.2; }
.gm-poster .gm-pt-t { font-size: 20px; }
.gm-poster small { display: block; color: var(--ps); font-size: 13px; line-height: 1.3; }
.gm-pt-23 { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.gm-pt-s { display: grid; gap: 5px; align-content: start; padding: 8px; border-radius: 14px; background: var(--pc); min-width: 0; }
.gm-pt-f { position: relative; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--ps); border-top: 1px solid rgba(255,255,255,.2); padding-top: 8px; }
.scroll { overflow-x:auto; }
@media (max-width:620px) { .form3 { grid-template-columns:1fr 1fr; } .form3 .btn { grid-column:1/-1; } .kpi b { font-size:24px; } .fields.free { grid-template-columns:1fr 90px; } }
.info-it { display:grid; grid-template-columns:150px 1fr 1.4fr auto; gap:8px; align-items:center; margin-top:8px; }
select { border:1px solid var(--line); background:var(--panel); color:var(--fg); border-radius:10px; padding:9px 8px; font:15px var(--f-body); width:100%; }
@media (max-width:620px) { .info-it { grid-template-columns:1fr 1fr 44px; padding-top:10px; border-top:1px solid var(--line); } .info-it input[data-il] { grid-column:2/4; } .info-it .val { grid-column:1/3; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1>Premi dei giochi</h1><div class="who" id="who">Caricamento…</div></div>
    <a class="btn ghost small" href="../">Apri FitLoo</a>
  </div>
  <div id="app"><div class="card center">Caricamento…</div></div>
</main>
<script src="../supabase.min.js"></script>
<script>
const SB_URL = "https://maypmqnjkdrdqcssnvty.supabase.co";
const SB_KEY = "sb_publishable_uorMl6G618tavZGF8MQpfQ_2Pg3AIlE"; // chiave pubblica: i permessi li decide il database
const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { flowType: "pkce", persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const MEDAL = ["🥇", "🥈", "🥉"];
const ASSISTENTE = "https://claude.ai/artifact/DaLtTj6An8CntwSmz28Q4z"; // the "Assistente premi" page on claude.ai: you write the prizes in your words, it fills this form
const PHOTO_BASE = SB_URL + "/storage/v1/object/public/premi/";
const LANGS = ["it", "en", "es", "fr", "de", "pt"];
const THEMES = [["oro", "Oro"], ["notte", "Notte"], ["energia", "Energia"], ["estate", "Estate"], ["inverno", "Inverno"]];
// the poster words in the app languages, as the app shows them
const PW = {
  it: ["Concorso Pro", "Premi del mese", "Finisce il", "Solo per abbonati Pro", "Premio da annunciare"],
  en: ["Pro contest", "Prizes of the month", "Ends on", "Pro subscribers only", "Prize to be announced"],
  es: ["Concurso Pro", "Premios del mes", "Termina el", "Solo para suscriptores Pro", "Premio por anunciar"],
  fr: ["Concours Pro", "Prix du mois", "Se termine le", "Réservé aux abonnés Pro", "Prix à annoncer"],
  de: ["Pro-Wettbewerb", "Preise des Monats", "Endet am", "Nur für Pro-Abonnenten", "Preis wird bekanntgegeben"],
  pt: ["Concurso Pro", "Prêmios do mês", "Termina em", "Só para assinantes Pro", "Prêmio a anunciar"] };
const MESI = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];
const monthName = d => { const [y, m] = d.split("-").map(Number); return MESI[m - 1] + " " + y; };
const addMonths = (d, n) => { const [y, m] = d.split("-").map(Number); const t = new Date(Date.UTC(y, m - 1 + n, 1)); return t.toISOString().slice(0, 10); };
const fmtDate = t => t ? new Date(t).toLocaleDateString("it-IT", { day: "numeric", month: "short", year: "numeric" }) : "";
// Contatti e informazioni app: everyone sees them in FitLoo (Profilo › Impostazioni › Informazioni app e contatti), see supabase/05_app_info.sql
const INFO_KINDS = [["email", "Email"], ["phone", "Telefono"], ["whatsapp", "WhatsApp"], ["instagram", "Instagram"], ["tiktok", "TikTok"], ["facebook", "Facebook"], ["youtube", "YouTube"], ["web", "Sito web"], ["address", "Indirizzo"], ["other", "Altro (link)"]];
const INFO_HINT = { email: "nome@email.it", phone: "+39 333 1234567", whatsapp: "+39 333 1234567", instagram: "@nomeprofilo", tiktok: "@nomeprofilo", facebook: "nomepagina", youtube: "@canale", web: "www.sito.it", address: "Via Roma 1, Milano", other: "https://…" };
const S = { info: null, infoErr: "", infoAt: null, user: undefined, img: {}, form: {}, tr: {}, theme: "oro", hl: {}, hlSrc: "", plang: "it", draft: null, cur: null, sel: null, over: null, selOver: null, board: "free" };

async function rpc(fn, args) {
  const { data, error } = await sb.rpc(fn, args || {});
  if (error) throw error;
  return data;
}
function errText(e) {
  const m = String(e && (e.message || e) || "");
  if (/solo amministratore/.test(m)) return "Questo account non è amministratore.";
  if (/does not exist|Could not find the function|schema cache/i.test(m)) return "Il database dei giochi non è ancora pronto: esegui 04_games.sql nell'SQL Editor di Supabase.";
  if (/Failed to fetch|NetworkError/i.test(m)) return "Nessuna connessione. Riprova.";
  return m;
}

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  S.user = session?.user?.id || null;
  if (!session) return renderLogin();
  $("who").textContent = session.user.email || "";
  try {
    S.over = await rpc("game_admin_overview");
    try { await loadInfo(); } catch (e) { S.info = null; S.infoErr = errText(e); }
    S.cur = S.over.current;
    if (!S.draft) S.draft = readDraft();
    if (S.draft && S.draft.month >= S.cur) S.sel = S.draft.month;
    if (!S.sel) S.sel = S.cur;
    S.selOver = S.sel === S.cur ? S.over : await rpc("game_admin_overview", { p_month: S.sel });
    initForm(); render();
  } catch (e) {
    $("app").innerHTML = `<div class="card center"><p>${esc(errText(e))}</p><div class="actions" style="justify-content:center"><button class="btn ghost" id="out">Cambia account</button> <button class="btn" id="again">Riprova</button></div></div>`;
    $("out").onclick = async () => { await sb.auth.signOut(); start(); };
    $("again").onclick = start;
  }
}

function renderLogin() {
  $("who").textContent = "Non hai fatto l'accesso";
  $("app").innerHTML = `<div class="card center"><p>Accedi con l'account amministratore di FitLoo.</p>
    <button class="btn" id="google">Accedi con Google</button>
    <p class="note">Se ti riporta nell'app, fai l'accesso lì e poi riapri questa pagina.</p></div>`;
  $("google").onclick = () => sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + location.pathname } });
}

function prizeOf(list, tier, place) { return (list || []).find(p => p.tier === tier && p.place === place) || {}; }

// the prize form of the selected month: saved prizes, then the assistant's draft on top
// a translation stays only while the Italian text is the one it was made from (tr[key].src)
function initForm() {
  const so = S.selOver;
  S.img = {}; S.form = {}; S.tr = {};
  for (const t of ["pro", "free"]) for (const pl of [1, 2, 3]) {
    const p = prizeOf(so.prizes, t, pl), k = t + "-" + pl;
    S.img[k] = p.image || null;
    S.form[k] = { title: p.title || "", details: p.details || "", points: p.points ?? (t === "free" ? [500, 300, 150][pl - 1] : null) };
    S.tr[k] = { src: srcOf(S.form[k]), i18n: p.i18n || {} };
  }
  S.theme = (so.poster && so.poster.theme) || "oro";
  S.hl = Object.assign({}, so.poster && so.poster.headline); S.hlSrc = S.hl.it || "";
  if (S.draft && S.draft.month === S.sel) applyDraft(S.draft);
}
const srcOf = f => (f.title || "").trim() + "\n" + (f.details || "").trim();
const trOk = k => S.tr[k] && S.tr[k].src === srcOf(S.form[k]) && Object.keys(S.tr[k].i18n || {}).length > 0;
const hlOk = () => (S.hl.it || "") === S.hlSrc && Object.keys(S.hl).some(l => l !== "it" && S.hl[l]);

// the poster as the app shows it, in the language picked above the preview
function posterHtml(lg) {
  const w = PW[lg] || PW.it;
  const text = (k, big) => {
    const f = S.form[k] || {}, t = (lg !== "it" && trOk(k) && S.tr[k].i18n[lg]) || {};
    const title = t.title || f.title.trim() || w[4], details = t.details || f.details.trim();
    return `<b${big ? ' class="gm-pt-t"' : ""}>${esc(title)}</b>${details ? `<small>${esc(details)}</small>` : ""}`;
  };
  const pic = (k, cls) => S.img[k] ? `<img class="${cls}" src="${esc(S.img[k])}" alt="">` : `<span class="${cls} gm-pt-medal">${MEDAL[+k.slice(-1) - 1]}</span>`;
  const hl = (lg === "it" || hlOk() ? S.hl[lg] : "") || S.hl.it || w[1];
  const [y, m] = S.sel.split("-").map(Number);
  const mName = new Date(Date.UTC(y, m - 1, 15)).toLocaleDateString(lg, { month: "long", year: "numeric", timeZone: "UTC" });
  const last = new Date(Date.UTC(y, m, 0, 12)).toLocaleDateString(lg, { day: "numeric", month: "long", timeZone: "UTC" });
  return `<article class="gm-poster th-${esc(S.theme)}"><div class="gm-pt-glow"></div>
    <header class="gm-pt-h"><span class="gm-pt-k"><i class="gm-pro">PRO</i> <span>${esc(w[0])}</span></span><span class="gm-pt-m">${esc(mName)}</span></header>
    <h3 class="gm-pt-hl">${esc(hl)}</h3>
    <div class="gm-pt-1">${pic("pro-1", "gm-pt-img")}<div class="gm-pt-1t"><span class="gm-pt-pl">1°</span>${text("pro-1", true)}</div></div>
    <div class="gm-pt-23">${["pro-2", "pro-3"].map(k => `<div class="gm-pt-s">${pic(k, "gm-pt-img s")}<span class="gm-pt-pl">${k.slice(-1)}°</span>${text(k)}</div>`).join("")}</div>
    <footer class="gm-pt-f"><span>${esc(w[2])} ${esc(last)}</span><span>${esc(w[3])}</span></footer></article>`;
}
function paintPreview() {
  const pv = $("pv"); if (pv) pv.innerHTML = posterHtml(S.plang);
  const ht = $("hlTr"); if (ht) { const ok = hlOk(); ht.className = "note " + (ok ? "tr-ok" : "tr-no"); ht.textContent = ok ? "✓ Tradotto nelle 6 lingue dell'app." : "Solo in italiano: per le altre lingue fallo scrivere all'assistente."; }
  document.querySelectorAll("[data-trk]").forEach(el => { const ok = trOk(el.dataset.trk); el.className = "note " + (ok ? "tr-ok" : "tr-no"); el.textContent = ok ? "✓ Tradotto nelle 6 lingue" : "Solo in italiano (le traduzioni le fa l'assistente)"; });
}

function render() {
  const o = S.over, so = S.selOver, st = o.stats || {};
  const months = [S.cur, addMonths(S.cur, 1), addMonths(S.cur, 2), addMonths(S.cur, 3)];
  const today = new Date(); const showNext = today.getDate() >= 26;
  const tierRows = (tier) => [1, 2, 3].map(pl => {
    const k = tier + "-" + pl, p = Object.assign({}, S.form[k], { image: S.img[k] });
    return `<div class="row"><div class="medal">${MEDAL[pl - 1]}</div><div class="fields ${tier}">
      <div><label class="small">Premio del ${pl}° posto</label><input data-t="${tier}" data-p="${pl}" data-k="title" maxlength="80" value="${esc(p.title)}" placeholder="${tier === "pro" ? "Es. Smartwatch" : "Es. 500 punti"}"></div>
      ${tier === "free" ? `<div><label class="small">Punti</label><input type="number" min="0" max="5000" step="10" data-t="${tier}" data-p="${pl}" data-k="points" value="${p.points ?? ""}"></div>` : ""}
      <div class="wide"><label class="small">Dettagli (si vedono in bacheca)</label><textarea data-t="${tier}" data-p="${pl}" data-k="details" maxlength="300" rows="2">${esc(p.details)}</textarea><div data-trk="${k}"></div></div>
      <div class="wide photo"><div class="ph${p.image ? " has" : ""}" data-ph="${tier}-${pl}" ${p.image ? `style="background-image:url('${esc(p.image)}')"` : ""}>${p.image ? "" : "📷"}</div>
        <label class="btn ghost small" for="f-${tier}-${pl}">${p.image ? "Cambia foto" : "Aggiungi foto"}</label><input type="file" accept="image/*" id="f-${tier}-${pl}" data-file="${tier}-${pl}">
        <button class="btn ghost small" type="button" data-nophoto="${tier}-${pl}" ${p.image ? "" : "hidden"}>Togli</button><span class="pmsg" data-pmsg="${tier}-${pl}"></span></div>
    </div></div>`;
  }).join("");
  const board = (o.boards || {})[S.board] || [];
  const winners = o.winners || [];
  const wRow = w => `<tr><td>${MEDAL[w.place - 1]}</td><td>${esc(w.name)}<div class="em">${esc(w.email)}</div>${w.tier === "pro" && w.email ? `<a class="btn ghost small" style="margin-top:4px;display:inline-block;text-decoration:none" href="${esc(mailTo(w, o.prev))}">✉️ Chiedi l'indirizzo</a>` : ""}</td><td class="n">${w.total}</td>
    <td>${esc(w.prize || (w.tier === "free" ? [500, 300, 150][w.place - 1] + " punti" : ""))}</td>
    <td>${w.tier === "free" ? (w.claimed ? `<span class="tag ok">Punti ricevuti</span>` : `<span class="tag wait">Li riceve aprendo l'app</span>`)
      : (w.delivered_at ? `<span class="tag ok">Consegnato ${esc(fmtDate(w.delivered_at))}</span> <button class="btn ghost small" data-undo="${w.place}">Annulla</button>` : `<button class="btn small" data-deliver="${w.place}">Segna consegnato</button>`)}</td></tr>`;
  const wTable = tier => {
    const ws = winners.filter(w => w.tier === tier);
    return ws.length ? `<div class="scroll"><table><tr><th></th><th>Chi</th><th class="n">Punti</th><th>Premio</th><th></th></tr>${ws.map(wRow).join("")}</table></div>` : `<div class="empty">Nessun vincitore.</div>`;
  };
  const pros = o.pro_users || [];
  $("app").innerHTML = `
  <div class="kpis">
    <div class="kpi"><b>${st.players ?? 0}</b><span>giocatori a ${esc(MESI[+S.cur.slice(5, 7) - 1])}</span></div>
    <div class="kpi"><b>${st.games ?? 0}</b><span>partite del mese</span></div>
    <div class="kpi"><b>${st.pro_active ?? 0}</b><span>abbonati Pro</span></div>
  </div>

  <section class="card">
    <h2>Premi del mese</h2>
    <div class="assist"><div><b>🤖 Assistente premi</b><span>Scrivigli i premi con parole tue: li sistema e li mette qui, tu aggiungi le foto e salvi.</span></div><a class="btn small" href="${ASSISTENTE}" target="_blank" rel="noopener">Apri l'assistente</a></div>
    ${S.draft && S.draft.month === S.sel ? `<div class="draft" id="draftNote">✍️ Bozza dell'assistente inserita qui sotto. Controlla, aggiungi le foto e premi <b>Salva</b>.</div>` : ""}
    <div class="chips">${months.map(m => `<button class="chip" data-m="${m}" aria-pressed="${m === S.sel}">${esc(monthName(m))}</button>`).join("")}</div>
    <p class="note">${S.sel === S.cur ? "Questi premi sono già in bacheca." : S.sel === addMonths(S.cur, 1) ? (showNext ? "Sono già in bacheca: dal 26 si vedono i premi del mese dopo." : "Compaiono in bacheca dal 26 di " + esc(MESI[+S.cur.slice(5, 7) - 1]) + ".") : "Compaiono in bacheca dal 26 del mese prima."}</p>
    <div class="tier pro"><h3><span class="tag pro">PRO</span> Concorso a premi</h3>${tierRows("pro")}
      <h3 style="margin-top:16px">🖼️ Locandina in bacheca</h3>
      <div class="poster-ed"><div>
        <label class="small">Stile</label><div class="themes">${THEMES.map(([t, n]) => `<button class="theme th-${t}" type="button" data-th="${t}" title="${n}" aria-label="${n}" aria-pressed="${t === S.theme}"></button>`).join("")}</div>
        <label class="small" style="margin-top:10px">Titolo grande (italiano)</label><input id="hl" maxlength="60" value="${esc(S.hl.it || "")}" placeholder="Es. Sfida d'autunno">
        <div id="hlTr"></div>
        <p class="note">Nell'app la locandina si vede nella lingua del telefono. Le traduzioni le scrive l'assistente; se cambi un testo a mano resta in italiano finché non rifai la bozza.</p>
      </div><div class="pv">
        <div class="langs">${LANGS.map(l => `<button class="chip" type="button" data-pl="${l}" aria-pressed="${l === S.plang}">${l.toUpperCase()}</button>`).join("")}</div>
        <div id="pv"></div></div></div>
    </div>
    <div class="tier free"><h3><span class="tag free">FREE</span> Classifica generale: punti per sbloccare esercizi</h3>${tierRows("free")}</div>
    <div class="actions"><button class="btn" id="save">Salva i premi di ${esc(monthName(S.sel))}</button><span class="msg" id="saveMsg"></span></div>
  </section>

  <section class="card">
    <h2>Classifica di ${esc(monthName(S.cur))}</h2>
    <div class="chips"><button class="chip" data-b="free" aria-pressed="${S.board === "free"}">Generale (Free)</button><button class="chip" data-b="pro" aria-pressed="${S.board === "pro"}">Pro</button></div>
    ${board.length ? `<div class="scroll"><table><tr><th>#</th><th>Chi</th><th class="n">Punti</th></tr>${board.map(r => `<tr><td>${r.rank <= 3 ? MEDAL[r.rank - 1] : r.rank}</td><td>${esc(r.name)}<div class="em">${esc(r.email)}</div></td><td class="n">${r.total}</td></tr>`).join("")}</table></div>` : `<div class="empty">Ancora nessuna partita questo mese.</div>`}
    <p class="note">Il punteggio è la somma del miglior risultato in ogni gioco. Finisce l'ultimo giorno del mese a mezzanotte (ora italiana).</p>
  </section>

  <section class="card">
    <h2>Vincitori di ${esc(monthName(o.prev))}</h2>
    <div class="tier pro"><h3><span class="tag pro">PRO</span> Premi da consegnare</h3>${wTable("pro")}<p class="note">Nell'app i vincitori leggono che li contatterai all'email del loro account per l'indirizzo di spedizione.</p></div>
    <div class="tier free"><h3><span class="tag free">FREE</span> Punti</h3>${wTable("free")}</div>
    <span class="msg" id="winMsg"></span>
  </section>

  <section class="card">
    <h2>Abbonati Pro</h2>
    <p class="note">Il pagamento vero non c'è ancora: qui puoi dare il Pro a mano, per esempio a chi prova l'app.</p>
    <div class="form3" style="margin-top:10px">
      <div><label class="small">Email dell'account</label><input id="proEmail" type="email" placeholder="nome@email.it"></div>
      <div><label class="small">Giorni</label><input id="proDays" type="number" min="1" max="3660" value="30"></div>
      <div><label class="small">Nota (facoltativa)</label><input id="proNote" maxlength="80" placeholder="Es. tester"></div>
      <button class="btn" id="proAdd">Dai il Pro</button>
    </div>
    <span class="msg" id="proMsg"></span>
    ${pros.length ? `<div class="scroll" style="margin-top:10px"><table><tr><th>Account</th><th>Fino al</th><th>Nota</th><th></th></tr>${pros.map(p => `<tr><td class="em">${esc(p.email)}</td><td>${p.active ? "" : `<span class="tag wait">Scaduto</span> `}${esc(fmtDate(p.until))}</td><td>${esc(p.note)}</td><td><button class="btn ghost small" data-unpro="${esc(p.email)}">Togli</button></td></tr>`).join("")}</table></div>` : `<div class="empty">Nessun abbonato.</div>`}
  </section>
  ${infoCard()}`;
  wire();
  infoWire();
}

function wire() {
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = async () => {
    S.sel = b.dataset.m;
    try { S.selOver = S.sel === S.cur ? S.over : await rpc("game_admin_overview", { p_month: S.sel }); initForm(); render(); }
    catch (e) { $("saveMsg").textContent = errText(e); $("saveMsg").className = "msg bad"; }
  });
  document.querySelectorAll("[data-b]").forEach(b => b.onclick = () => { S.board = b.dataset.b; render(); });
  document.querySelectorAll("[data-k]").forEach(el => el.oninput = () => { S.form[el.dataset.t + "-" + el.dataset.p][el.dataset.k] = el.value; paintPreview(); });
  document.querySelectorAll("[data-th]").forEach(b => b.onclick = () => { S.theme = b.dataset.th; document.querySelectorAll("[data-th]").forEach(x => x.setAttribute("aria-pressed", x === b)); paintPreview(); });
  document.querySelectorAll("[data-pl]").forEach(b => b.onclick = () => { S.plang = b.dataset.pl; document.querySelectorAll("[data-pl]").forEach(x => x.setAttribute("aria-pressed", x === b)); paintPreview(); });
  $("hl").oninput = () => { S.hl.it = $("hl").value; paintPreview(); };
  paintPreview();
  $("save").onclick = async () => {
    const msg = $("saveMsg"), btn = $("save");
    const jobs = [];
    for (const t of ["pro", "free"]) for (const p of [1, 2, 3]) {
      const k = t + "-" + p, f = S.form[k], title = f.title.trim();
      if (!title) { msg.textContent = `Scrivi il premio del ${p}° posto (${t === "pro" ? "Pro" : "Free"}).`; msg.className = "msg bad"; return; }
      jobs.push({ p_month: S.sel, p_tier: t, p_place: p, p_title: title, p_details: f.details.trim() || null, p_points: t === "free" ? parseInt(f.points, 10) : null, p_image: S.img[k] || null, p_i18n: trOk(k) ? S.tr[k].i18n : {} });
    }
    const hlIt = (S.hl.it || "").trim();
    const headline = hlOk() ? Object.assign({}, S.hl, { it: hlIt }) : (hlIt ? { it: hlIt } : {});
    btn.disabled = true; msg.textContent = "Salvataggio…"; msg.className = "msg";
    try {
      for (const j of jobs) await rpc("game_admin_set_prize", j);
      await rpc("game_admin_set_poster", { p_month: S.sel, p_theme: S.theme, p_headline: headline });
      S.selOver = await rpc("game_admin_overview", { p_month: S.sel });
      if (S.sel === S.cur) S.over = S.selOver;
      S.draft = null;
      initForm(); render(); $("saveMsg").textContent = "Premi salvati: li vedono tutti in bacheca."; $("saveMsg").className = "msg ok";
    } catch (e) { btn.disabled = false; msg.textContent = errText(e); msg.className = "msg bad"; }
  };
  document.querySelectorAll("[data-file]").forEach(inp => inp.onchange = async () => {
    const key = inp.dataset.file, f = inp.files && inp.files[0]; inp.value = "";
    if (!f) return;
    const m = document.querySelector(`[data-pmsg="${key}"]`);
    m.textContent = "Carico la foto…"; m.style.color = "";
    try {
      const blob = await shrink(f);
      const path = `${S.sel}/${key}-${Date.now()}.jpg`;
      const { error } = await sb.storage.from("premi").upload(path, blob, { contentType: "image/jpeg", upsert: false });
      if (error) throw error;
      S.img[key] = PHOTO_BASE + path;
      paintPhoto(key); paintPreview();
      m.textContent = "Foto pronta: premi Salva per pubblicarla.";
    } catch (e) { m.textContent = /row-level|security|Unauthorized|403/i.test(String(e && e.message)) ? "Solo l'amministratore può caricare foto." : /Bucket not found/i.test(String(e && e.message)) ? "Prima esegui di nuovo 04_games.sql (cartella foto)." : "Foto non caricata: " + errText(e); m.style.color = "var(--bad)"; }
  });
  document.querySelectorAll("[data-nophoto]").forEach(b => b.onclick = () => { S.img[b.dataset.nophoto] = null; paintPhoto(b.dataset.nophoto); paintPreview(); document.querySelector(`[data-pmsg="${b.dataset.nophoto}"]`).textContent = "Foto tolta: premi Salva."; });
  const winAct = async (place, done) => {
    try { await rpc("game_admin_delivered", { p_month: S.over.prev, p_place: place, p_done: done }); await reload(); }
    catch (e) { $("winMsg").textContent = errText(e); $("winMsg").className = "msg bad"; }
  };
  document.querySelectorAll("[data-deliver]").forEach(b => b.onclick = () => winAct(+b.dataset.deliver, true));
  document.querySelectorAll("[data-undo]").forEach(b => b.onclick = () => winAct(+b.dataset.undo, false));
  $("proAdd").onclick = async () => {
    const email = $("proEmail").value.trim(), days = parseInt($("proDays").value, 10), note = $("proNote").value.trim();
    if (!email || !(days > 0)) { $("proMsg").textContent = "Scrivi l'email e i giorni."; $("proMsg").className = "msg bad"; return; }
    try { await rpc("game_admin_set_pro", { p_email: email, p_days: days, p_note: note || null }); await reload(); $("proMsg").textContent = `Pro attivo per ${email}.`; $("proMsg").className = "msg ok"; }
    catch (e) { $("proMsg").textContent = errText(e); $("proMsg").className = "msg bad"; }
  };
  document.querySelectorAll("[data-unpro]").forEach(b => b.onclick = async () => {
    if (!confirm(`Togliere il Pro a ${b.dataset.unpro}?`)) return;
    try { await rpc("game_admin_set_pro", { p_email: b.dataset.unpro, p_days: 0 }); await reload(); }
    catch (e) { $("proMsg").textContent = errText(e); $("proMsg").className = "msg bad"; }
  });
}

// the email to a Pro winner, ready in the mail app: asks where to ship the prize
function mailTo(w, month) {
  const sub = `FitLoo: hai vinto il Concorso Pro di ${monthName(month)}!`;
  const body = `Ciao ${w.name || ""},\n\ncomplimenti! Sei arrivato ${w.place}° nel Concorso Pro di ${monthName(month)} su FitLoo${w.prize ? " e hai vinto: " + w.prize : ""}.\n\nPer spedirti il premio rispondi a questa email con:\n- nome e cognome\n- indirizzo completo (via, numero, CAP, città, paese)\n- un numero di telefono per il corriere\n\nGrazie e continua ad allenarti!\nFitLoo`;
  return "mailto:" + encodeURIComponent(w.email).replace(/%40/g, "@") + "?subject=" + encodeURIComponent(sub) + "&body=" + encodeURIComponent(body);
}

function paintPhoto(key) {
  const url = S.img[key], ph = document.querySelector(`[data-ph="${key}"]`);
  ph.classList.toggle("has", !!url); ph.style.backgroundImage = url ? `url('${url}')` : ""; ph.textContent = url ? "" : "📷";
  document.querySelector(`label[for="f-${key}"]`).textContent = url ? "Cambia foto" : "Aggiungi foto";
  document.querySelector(`[data-nophoto="${key}"]`).hidden = !url;
}
// photos are made smaller before upload (max 1200 px, JPEG), so they load fast in the app
async function shrink(file) {
  if (!/^image\//.test(file.type)) throw new Error("Scegli un'immagine.");
  const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(new Error("Immagine non leggibile.")); i.src = URL.createObjectURL(file); });
  const k = Math.min(1, 1200 / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src);
  return await new Promise((ok, ko) => c.toBlob(b => b ? ok(b) : ko(new Error("Immagine non leggibile.")), "image/jpeg", .85));
}
// a draft from the assistant arrives in the link: #bozza=<base64url JSON {month, theme, headline:{it,en,…}, prizes:[{tier, place, title, details, points, i18n:{en:{title, details},…}}]}>
function readDraft() {
  const m = location.hash.match(/bozza=([A-Za-z0-9_-]+)/); if (!m) return null;
  try { history.replaceState(null, "", location.pathname); } catch {}
  try {
    const b = m[1].replace(/-/g, "+").replace(/_/g, "/");
    const j = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b + "===".slice((b.length + 3) % 4)), c => c.charCodeAt(0))));
    if (!/^\d{4}-\d{2}-01$/.test(j.month) || !Array.isArray(j.prizes)) return null;
    j.prizes = j.prizes.filter(p => (p.tier === "pro" || p.tier === "free") && [1, 2, 3].includes(p.place)).slice(0, 6);
    return j;
  } catch { return null; }
}
const cut = (v, n) => typeof v === "string" ? v.trim().slice(0, n) : "";
function applyDraft(d) {
  for (const p of d.prizes) {
    const k = p.tier + "-" + p.place, f = S.form[k];
    if (cut(p.title, 80)) f.title = cut(p.title, 80);
    if (cut(p.details, 300)) f.details = cut(p.details, 300);
    if (p.tier === "free" && p.points != null && Number.isFinite(+p.points)) f.points = Math.max(0, Math.min(5000, Math.round(+p.points)));
    const i18n = {};
    for (const l of LANGS.slice(1)) { const t = p.i18n && p.i18n[l]; if (t && cut(t.title, 80)) i18n[l] = { title: cut(t.title, 80), details: cut(t.details, 300) || undefined }; }
    S.tr[k] = { src: srcOf(f), i18n };
  }
  if (THEMES.some(t => t[0] === d.theme)) S.theme = d.theme;
  if (d.headline && cut(d.headline.it, 60)) {
    S.hl = {}; for (const l of LANGS) if (cut(d.headline[l], 60)) S.hl[l] = cut(d.headline[l], 60);
    S.hlSrc = S.hl.it;
  }
}

async function loadInfo() {
  const { data, error } = await sb.from("app_info").select("data,updated_at").eq("id", 1).maybeSingle();
  if (error) { S.info = null; S.infoErr = /does not exist|schema cache|Could not find/i.test(error.message) ? "Prima esegui 05_app_info.sql nell'SQL Editor di Supabase." : errText(error); return; }
  const d = data && data.data && typeof data.data === "object" ? data.data : {};
  S.info = { note: typeof d.note === "string" ? d.note : "", items: Array.isArray(d.items) ? d.items.map(it => ({ kind: it.kind || "other", label: it.label || "", value: it.value || "" })) : [] };
  S.infoAt = data ? data.updated_at : null; S.infoErr = "";
}
function infoCard() {
  if (!S.info) return `<section class="card" id="infoCard"><h2>Contatti e informazioni app</h2><div class="empty">${esc(S.infoErr || "Caricamento…")}</div></section>`;
  const it = (x, i) => `<div class="info-it"><select data-ik="${i}">${INFO_KINDS.map(([k, n]) => `<option value="${k}"${k === x.kind ? " selected" : ""}>${n}</option>`).join("")}</select>
    <input data-il="${i}" maxlength="60" value="${esc(x.label)}" placeholder="Nome (facoltativo)">
    <input class="val" data-iv="${i}" maxlength="300" value="${esc(x.value)}" placeholder="${esc(INFO_HINT[x.kind] || "")}">
    <button class="btn ghost small" type="button" data-idel="${i}" aria-label="Togli">✕</button></div>`;
  return `<section class="card" id="infoCard">
    <h2>Contatti e informazioni app</h2>
    <p class="note">Li vedono tutti nell'app in Profilo › Impostazioni › Informazioni app e contatti. Puoi anche chiederlo a Claude nella chat degli agenti o nel progetto.</p>
    <label class="small" style="margin-top:10px;display:block">Messaggio (facoltativo)</label><textarea id="infoNote" maxlength="600" rows="2" placeholder="Es. Per domande o collaborazioni scrivimi qui.">${esc(S.info.note)}</textarea>
    ${S.info.items.map(it).join("") || `<div class="empty">Nessun contatto. Aggiungine uno.</div>`}
    <div class="actions"><button class="btn ghost" id="infoAdd" type="button">+ Aggiungi contatto</button> <button class="btn" id="infoSave" type="button">Salva i contatti</button><span class="msg" id="infoMsg">${S.infoAt ? "Ultima modifica: " + esc(fmtDate(S.infoAt)) : ""}</span></div>
  </section>`;
}
function infoWire() {
  const c = $("infoCard"); if (!c || !S.info) return;
  const repaint = () => { c.outerHTML = infoCard(); infoWire(); };
  c.querySelectorAll("[data-ik]").forEach(e => e.onchange = () => { S.info.items[e.dataset.ik].kind = e.value; repaint(); });
  c.querySelectorAll("[data-il]").forEach(e => e.oninput = () => { S.info.items[e.dataset.il].label = e.value; });
  c.querySelectorAll("[data-iv]").forEach(e => e.oninput = () => { S.info.items[e.dataset.iv].value = e.value; });
  c.querySelectorAll("[data-idel]").forEach(e => e.onclick = () => { S.info.items.splice(+e.dataset.idel, 1); repaint(); });
  $("infoNote").oninput = e => { S.info.note = e.target.value; };
  $("infoAdd").onclick = () => { if (S.info.items.length >= 30) return; S.info.items.push({ kind: "email", label: "", value: "" }); repaint(); [...document.querySelectorAll("#infoCard .val")].pop()?.focus(); };
  $("infoSave").onclick = async () => {
    const b = $("infoSave"), m = $("infoMsg");
    const items = S.info.items.map(x => ({ kind: x.kind, label: x.label.trim(), value: x.value.trim() })).filter(x => x.value);
    b.disabled = true;
    try {
      await rpc("app_admin_set_info", { p_data: { note: S.info.note.trim(), items } });
      await loadInfo(); repaint(); $("infoMsg").textContent = "Salvato: nell'app si vede subito."; $("infoMsg").className = "msg ok";
    } catch (e) { b.disabled = false; m.textContent = /app_admin_set_info|does not exist|schema cache/i.test(String(e && e.message)) ? "Prima esegui 05_app_info.sql nell'SQL Editor di Supabase." : errText(e); m.className = "msg bad"; }
  };
}

async function reload() {
  S.over = await rpc("game_admin_overview");
  S.selOver = S.sel === S.cur ? S.over : await rpc("game_admin_overview", { p_month: S.sel });
  render();
}

// only a real change of account reloads the page data (Supabase also repeats SIGNED_IN when the tab comes back)
sb.auth.onAuthStateChange((ev, session) => { const id = session?.user?.id || null; if ((ev === "SIGNED_IN" || ev === "SIGNED_OUT") && id !== S.user) start(); });
addEventListener("hashchange", () => { if (/bozza=/.test(location.hash)) { S.draft = readDraft(); start(); } });
start();
</script>
