<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}</style>
<title>Istruttore Recluta</title>
<meta name="theme-color" content="#12150e">
<meta name="description" content="Allenamento a corpo libero in stile militare: la fotocamera conta le ripetizioni e corregge la postura.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recluta">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Saira+Condensed:wght@500;600;700;800&family=Saira:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen field manual. Home = program card + exercise list; Session = camera fills the screen with a big rep counter and an order banner. */
:root {
  --bg: #12150e;
  --panel: #1c2116;
  --panel-2: #262d1d;
  --line: #3a4230;
  --fg: #e8e5d3;
  --muted: #a3a38a;
  --brass: #d2b85c;
  --brass-ink: #1a1606;
  --ok: #7cbf62;
  --bad: #e2603f;
  --warn: #e8b23a;
  --f-display: "Black Ops One", "Impact", "Arial Black", sans-serif;
  --f-cond: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Saira", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

.screen { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 32px; display: flex; flex-direction: column; gap: 22px; }

/* Header */
.mast { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; border-bottom: 2px solid var(--line); padding-bottom: 12px; }
.mast h1 { font-family: var(--f-display); font-weight: 400; font-size: 30px; letter-spacing: .02em; line-height: 1; color: var(--brass); }
.mast .sub { font-family: var(--f-cond); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.callsign { font-family: var(--f-cond); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-align: right; }
.callsign b { display: block; font-size: 22px; color: var(--fg); letter-spacing: .02em; font-variant-numeric: tabular-nums; }

.label { font-family: var(--f-cond); font-weight: 600; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.section { display: flex; flex-direction: column; gap: 10px; }

/* Today's order card */
.order { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
.order::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 6px; background: repeating-linear-gradient(-45deg, var(--brass) 0 10px, var(--brass-ink) 10px 20px); }
.order h2 { font-family: var(--f-cond); font-weight: 800; font-size: 24px; letter-spacing: .01em; margin-top: 4px; }
.order .meta { color: var(--muted); font-size: 14px; }
.blocks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.blocks li { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-family: var(--f-cond); font-size: 17px; font-weight: 600; }
.blocks li:last-child { border-bottom: 0; }
.blocks li span:last-child { color: var(--brass); font-variant-numeric: tabular-nums; }

.weeks { display: flex; gap: 6px; flex-wrap: wrap; }
.wk { flex: 1 1 0; min-width: 64px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font-family: var(--f-cond); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.wk.now { border-color: var(--brass); color: var(--fg); }
.dots { display: flex; gap: 4px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted); }
.dots i.done { background: var(--ok); border-color: var(--ok); }

.btn { border: 0; border-radius: 4px; padding: 14px 18px; font-family: var(--f-cond); font-weight: 700; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; }
.btn.primary { background: var(--brass); color: var(--brass-ink); }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--fg); }
.btn.small { min-height: 40px; padding: 8px 12px; font-size: 15px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 160px; }

/* Exercise list */
.exlist { display: grid; gap: 8px; }
.ex { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 12px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.ex:hover { border-color: var(--muted); }
.ex canvas, .ex svg { width: 52px; height: 52px; }
.ex b { font-family: var(--f-cond); font-size: 19px; font-weight: 700; display: block; line-height: 1.15; }
.ex small { color: var(--muted); font-size: 13px; }
.ex .go { font-family: var(--f-cond); color: var(--brass); font-size: 22px; }

.note { font-size: 13px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; }

/* Briefing */
.brief h2 { font-family: var(--f-display); font-weight: 400; font-size: 32px; color: var(--brass); line-height: 1.05; }
.brief .goal { font-family: var(--f-cond); font-size: 18px; font-weight: 600; }
.steps { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.steps li::marker { font-family: var(--f-cond); font-weight: 700; color: var(--brass); }
.faults { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.faults li { display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: baseline; font-size: 14px; }
.faults li::before { content: ""; width: 10px; height: 10px; background: var(--bad); transform: rotate(45deg); }
.camtip { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; font-size: 14px; }
.camtip svg { width: 64px; height: 48px; }
.back { align-self: flex-start; background: none; border: 0; color: var(--muted); font-family: var(--f-cond); font-size: 15px; letter-spacing: .1em; text-transform: uppercase; padding: 6px 0; }

/* Session */
#session { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; z-index: 10; }
.stage { position: relative; flex: 1 1 auto; overflow: hidden; background: #000; }
.stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.stage.mirror video, .stage.mirror canvas { transform: scaleX(-1); }
.hud-top { position: absolute; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; background: linear-gradient(rgba(0,0,0,.75), rgba(0,0,0,0)); }
.hud-ex { font-family: var(--f-cond); font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--brass); }
.hud-ex b { display: block; font-size: 22px; letter-spacing: .02em; color: #f2efe0; }
.hud-timer { font-family: var(--f-cond); font-size: 22px; font-weight: 700; color: #f2efe0; font-variant-numeric: tabular-nums; }
.counter { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; align-items: flex-end; text-shadow: 0 2px 12px rgba(0,0,0,.8); }
.counter .n { font-family: var(--f-display); font-size: 112px; line-height: .9; color: #f2efe0; font-variant-numeric: tabular-nums; }
.counter .of { font-family: var(--f-cond); font-size: 18px; font-weight: 700; letter-spacing: .1em; color: var(--brass); text-transform: uppercase; }
.counter .n.bump { animation: bump .35s ease-out; }
@keyframes bump { 0% { transform: scale(1.25); color: var(--brass); } 100% { transform: scale(1); } }
.meter { position: absolute; left: 12px; bottom: 16px; width: 14px; height: 40%; border: 2px solid rgba(242,239,224,.6); border-radius: 3px; overflow: hidden; }
.meter i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--brass); height: 0%; transition: height .08s linear; }
.meter b { position: absolute; left: -2px; right: -2px; height: 2px; background: var(--ok); }
.banner { position: absolute; left: 12px; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 74px); padding: 10px 14px; border-radius: 4px; font-family: var(--f-cond); font-weight: 700; font-size: 22px; line-height: 1.15; text-align: center; background: rgba(18,21,14,.86); border: 2px solid var(--line); color: #f2efe0; }
.banner.ok { border-color: var(--ok); }
.banner.bad { border-color: var(--bad); background: rgba(80,22,10,.88); }
.banner.warn { border-color: var(--warn); }
.loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; color: #f2efe0; background: rgba(0,0,0,.7); font-family: var(--f-cond); font-size: 18px; }
.loading .bar { width: min(260px, 70vw); height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
.loading .bar i { display: block; height: 100%; width: 30%; background: var(--brass); animation: slide 1.1s ease-in-out infinite alternate; }
@keyframes slide { from { transform: translateX(-30%); } to { transform: translateX(260%); } }
.dock { flex: 0 0 auto; background: var(--bg); padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 10px); display: flex; gap: 8px; align-items: center; }
.dock .btn { flex: 1 1 auto; }
.dock .adj { flex: 0 0 52px; padding: 0; font-size: 24px; }

.rest { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(18,21,14,.94); padding: 24px; text-align: center; }
.rest .big { font-family: var(--f-display); font-size: 96px; color: var(--brass); font-variant-numeric: tabular-nums; line-height: 1; }
.rest .next { font-family: var(--f-cond); font-size: 20px; font-weight: 600; color: var(--fg); }

/* Summary */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--f-display); font-weight: 400; font-size: 34px; font-variant-numeric: tabular-nums; line-height: 1; }
.stat span { font-family: var(--f-cond); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.log li { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.log li span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); }

.toggle { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.toggle input { width: 20px; height: 20px; accent-color: var(--brass); }

/* Duel: friend's camera picture-in-picture + lobby */
.stage .opp { position: absolute; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 70px); width: 32%; max-width: 200px; aspect-ratio: 3 / 4; border: 2px solid var(--brass); border-radius: 4px; overflow: hidden; background: #000; }
.stage .opp video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.oppTag { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; padding: 4px 8px; background: rgba(0,0,0,.7); font-family: var(--f-cond); font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #f2efe0; }
.oppTag span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.oppTag b { font-family: var(--f-display); font-weight: 400; font-size: 30px; line-height: 1; color: var(--brass); font-variant-numeric: tabular-nums; }
.duel .banner { right: calc(min(32%, 200px) + 24px); font-size: 18px; }
.duel .counter .of { color: var(--ok); }
.code { font-family: var(--f-display); font-size: 44px; letter-spacing: .12em; color: var(--brass); line-height: 1; font-variant-numeric: tabular-nums; }
.lobvids { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.lobvid { position: relative; aspect-ratio: 3 / 4; background: #000; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.lobvid video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.lobvid span { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 8px; background: rgba(0,0,0,.65); font-family: var(--f-cond); font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: #f2efe0; }
.lobvid .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 12px; text-align: center; color: var(--muted); font-size: 13px; }
.status { display: flex; align-items: center; gap: 10px; font-family: var(--f-cond); font-size: 18px; font-weight: 600; }
.status i { width: 12px; height: 12px; border-radius: 50%; background: var(--warn); flex: 0 0 auto; }
.status.on i { background: var(--ok); }
.status.off i { background: var(--bad); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field input { font: inherit; font-size: 18px; padding: 12px; border-radius: 4px; border: 1.5px solid var(--line); background: var(--panel); color: var(--fg); min-width: 0; }
.field select, .field textarea { font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 4px; border: 1.5px solid var(--line); background: var(--panel); color: var(--fg); min-width: 0; width: 100%; }
.field textarea { resize: vertical; line-height: 1.4; }
.field input[type="range"] { padding: 0; border: 0; background: none; accent-color: var(--brass); height: 32px; }
.field input:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.choice { background: var(--panel); border: 1.5px solid var(--line); border-radius: 6px; padding: 10px 12px; text-align: left; font-family: var(--f-cond); font-size: 17px; font-weight: 700; }
.choice small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 12px; color: var(--muted); }
.choice[aria-pressed="true"] { border-color: var(--brass); background: var(--panel-2); }
.verdict { font-family: var(--f-display); font-weight: 400; font-size: 40px; line-height: 1.05; color: var(--brass); }
.vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; text-align: center; }
.vs div { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 8px; display: flex; flex-direction: column; gap: 4px; }
.vs div.win { border-color: var(--brass); }
.vs b { font-family: var(--f-display); font-weight: 400; font-size: 48px; line-height: 1; font-variant-numeric: tabular-nums; }
.vs span { font-family: var(--f-cond); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vs em { font-family: var(--f-display); font-style: normal; color: var(--muted); }
/* Ranks, points, leaderboard */
.rk { display: inline-flex; align-items: center; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--brass); color: var(--brass); font-family: var(--f-cond); font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; vertical-align: middle; white-space: nowrap; }
.rk.gold { background: linear-gradient(135deg, #f3d36b, #b8902a); color: #1a1406; border-color: #f3d36b; }
.rankcard { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: end; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; }
.rankcard .rname { font-family: var(--f-cond); font-weight: 800; font-size: 22px; line-height: 1.1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rankcard .pts { font-family: var(--f-display); font-size: 28px; color: var(--brass); font-variant-numeric: tabular-nums; text-align: right; line-height: 1; }
.rankcard .pts small { display: block; font-family: var(--f-cond); font-size: 11px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; margin-top: 4px; }
.xp { grid-column: 1 / -1; height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.xp i { display: block; height: 100%; background: var(--brass); }
.rankcard .meta { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
.ex.locked { opacity: .55; }
.ex.locked .go { color: var(--muted); }
.ex .go svg { width: 20px; height: 20px; }
.lb { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.lb li { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
.lb li.podium .pos { color: var(--brass); }
.lb li.me { border-color: var(--brass); }
.lb .pos { font-family: var(--f-display); font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lb .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--f-cond); font-weight: 700; font-size: 17px; }
.lb .pts { font-family: var(--f-cond); font-weight: 700; font-size: 18px; color: var(--brass); font-variant-numeric: tabular-nums; }
.lb .lbmsg { display: block; color: var(--muted); font-size: 14px; }
.elite .ex { border-style: dashed; }
body.goldtheme { --brass: #e9c24a; }
@media (prefers-reduced-motion: reduce) { .counter .n.bump, .loading .bar i { animation: none; } }
</style>

</head>
<body>
<main id="app"></main>

<section id="session" hidden>
  <div class="stage mirror" id="stage">
    <video id="vid" playsinline muted></video>
    <canvas id="cv"></canvas>
    <div class="hud-top">
      <div class="hud-ex"><span id="hudSet">Serie</span><b id="hudName">Esercizio</b></div>
      <div class="hud-timer" id="hudTimer">00:00</div>
    </div>
    <div class="banner" id="banner">Mettiti in posizione</div>
    <div class="meter" id="meter"><i id="meterFill"></i><b id="meterMark"></b></div>
    <div class="opp" id="opp" hidden><video id="oppVid" playsinline autoplay></video><div class="oppTag"><span id="oppName">Amico</span><b id="oppCount">0</b></div></div>
    <div class="counter"><div class="n" id="count">0</div><div class="of" id="countOf">ripetizioni</div></div>
    <div class="loading" id="loading"><div id="loadingMsg">Carico il sistema di visione…</div><div class="bar"><i></i></div></div>
    <div class="rest" id="rest" hidden>
      <div class="label">Recupero</div>
      <div class="big" id="restN">60</div>
      <div class="next" id="restNext"></div>
      <button class="btn primary" id="restSkip" type="button">Salta recupero</button>
    </div>
  </div>
  <div class="dock">
    <button class="btn ghost adj" id="minus" type="button" aria-label="Togli una ripetizione">−</button>
    <button class="btn ghost adj" id="plus" type="button" aria-label="Aggiungi una ripetizione">+</button>
    <button class="btn ghost small" id="flip" type="button">Camera</button>
    <button class="btn primary small" id="stop" type="button">Fine serie</button>
  </div>
</section>

<input type="file" id="fileIn" accept="video/*" capture="user" hidden>

<script type="module">
const LANGS = {
  it: { name: "Italiano", tts: "it-IT" },
  en: { name: "English", tts: "en-US" },
  es: { name: "Espa\xF1ol", tts: "es-ES" },
  fr: { name: "Fran\xE7ais", tts: "fr-FR" },
  de: { name: "Deutsch", tts: "de-DE" },
  pt: { name: "Portugu\xEAs", tts: "pt-BR" }
};
const LANG_ORDER = ["it", "en", "es", "fr", "de", "pt"];
function detectLang() {
  const list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
  for (const l of list) {
    const k = String(l).slice(0, 2).toLowerCase();
    if (LANGS[k]) return k;
  }
  return "en";
}
let lang = (() => {
  try {
    const v = JSON.parse(localStorage.getItem("recluta:lang"));
    if (LANGS[v]) return v;
  } catch (e) {
  }
  return detectLang();
})();
const ttsLang = () => {
  const own = (navigator.languages || [navigator.language || ""]).find((l) => String(l).slice(0, 2).toLowerCase() === lang);
  return own && own.length > 2 ? own : LANGS[lang].tts;

  ["Piedi alla larghezza delle spalle, punte leggermente in fuori.", "Feet shoulder-width apart, toes slightly out.", "Pies a la anchura de los hombros, puntas un poco hacia fuera.", "Pieds \xE9cart\xE9s \xE0 largeur d'\xE9paules, pointes l\xE9g\xE8rement vers l'ext\xE9rieur.", "F\xFC\xDFe schulterbreit, Fu\xDFspitzen leicht nach au\xDFen.", "P\xE9s na largura dos ombros, pontas levemente para fora."],
  ["Spingi il bacino indietro e scendi piegando le ginocchia, petto alto.", "Push your hips back and lower by bending your knees, chest up.", "Lleva la cadera atr\xE1s y baja doblando las rodillas, pecho arriba.", "Pousse le bassin en arri\xE8re et descends en pliant les genoux, poitrine haute.", "Schiebe die H\xFCfte nach hinten und beuge die Knie, Brust raus.", "Empurre o quadril para tr\xE1s e des\xE7a dobrando os joelhos, peito alto."],
  ["Scendi finch\xE9 le cosce sono parallele al suolo.", "Go down until your thighs are parallel to the floor.", "Baja hasta que los muslos queden paralelos al suelo.", "Descends jusqu'\xE0 ce que les cuisses soient parall\xE8les au sol.", "Geh runter, bis die Oberschenkel parallel zum Boden sind.", "Des\xE7a at\xE9 as coxas ficarem paralelas ao ch\xE3o."],
  ["Risali spingendo sui talloni fino a gambe distese.", "Drive up through your heels until your legs are straight.", "Sube empujando con los talones hasta estirar las piernas.", "Remonte en poussant sur les talons jusqu'\xE0 tendre les jambes.", "Dr\xFCck dich \xFCber die Fersen hoch, bis die Beine gestreckt sind.", "Suba empurrando com os calcanhares at\xE9 esticar as pernas."],
  ["Non scendi abbastanza (la ripetizione non conta)", "Not going low enough (the rep doesn't count)", "No bajas lo suficiente (la repetici\xF3n no cuenta)", "Tu ne descends pas assez (la r\xE9p\xE9tition ne compte pas)", "Nicht tief genug (die Wiederholung z\xE4hlt nicht)", "N\xE3o desce o suficiente (a repeti\xE7\xE3o n\xE3o conta)"],
  ["Busto troppo inclinato in avanti", "Torso leaning too far forward", "Tronco demasiado inclinado hacia delante", "Buste trop pench\xE9 en avant", "Oberk\xF6rper zu weit nach vorn geneigt", "Tronco inclinado demais para a frente"],
  ["Gambe non distese in cima", "Legs not straight at the top", "Piernas no estiradas arriba", "Jambes pas tendues en haut", "Beine oben nicht gestreckt", "Pernas n\xE3o esticadas no alto"],
  ["Mani sotto le spalle, corpo dritto dalla testa ai talloni.", "Hands under your shoulders, body straight from head to heels.", "Manos bajo los hombros, cuerpo recto de la cabeza a los talones.", "Mains sous les \xE9paules, corps droit de la t\xEAte aux talons.", "H\xE4nde unter den Schultern, K\xF6rper gerade von Kopf bis Ferse.", "M\xE3os abaixo dos ombros, corpo reto da cabe\xE7a aos calcanhares."],
  ["Contrai addome e glutei: il bacino non deve cedere.", "Brace your abs and glutes: your hips must not sag.", "Contrae abdomen y gl\xFAteos: la cadera no debe caer.", "Contracte abdos et fessiers : le bassin ne doit pas s'affaisser.", "Spann Bauch und Po an: Die H\xFCfte darf nicht durchh\xE4ngen.", "Contraia abd\xF4men e gl\xFAteos: o quadril n\xE3o pode cair."],
  ["Scendi finch\xE9 i gomiti sono piegati a 90\xB0 o meno.", "Go down until your elbows are bent to 90\xB0 or less.", "Baja hasta que los codos est\xE9n a 90\xB0 o menos.", "Descends jusqu'\xE0 ce que les coudes soient pli\xE9s \xE0 90\xB0 ou moins.", "Geh runter, bis die Ellbogen 90\xB0 oder weniger gebeugt sind.", "Des\xE7a at\xE9 os cotovelos ficarem a 90\xB0 ou menos."],
  ["Spingi fino a braccia distese.", "Push up until your arms are straight.", "Empuja hasta estirar los brazos.", "Pousse jusqu'\xE0 tendre les bras.", "Dr\xFCck dich hoch, bis die Arme gestreckt sind.", "Empurre at\xE9 esticar os bra\xE7os."],

  ["Gomiti non piegati a 90\xB0 (non conta)", "Elbows not bent to 90\xB0 (doesn't count)", "Codos no doblados a 90\xB0 (no cuenta)", "Coudes pas pli\xE9s \xE0 90\xB0 (ne compte pas)", "Ellbogen nicht auf 90\xB0 gebeugt (z\xE4hlt nicht)", "Cotovelos n\xE3o dobrados a 90\xB0 (n\xE3o conta)"],
  ["Supino, ginocchia piegate a circa 90\xB0, piedi a terra.", "Lie on your back, knees bent to about 90\xB0, feet on the floor.", "Boca arriba, rodillas dobladas a unos 90\xB0, pies en el suelo.", "Sur le dos, genoux pli\xE9s \xE0 environ 90\xB0, pieds au sol.", "Auf dem R\xFCcken, Knie etwa 90\xB0 gebeugt, F\xFC\xDFe am Boden.", "Deitado de costas, joelhos dobrados a uns 90\xB0, p\xE9s no ch\xE3o."],
  ["Mani incrociate sul petto o dietro le orecchie.", "Hands crossed on your chest or behind your ears.", "Manos cruzadas sobre el pecho o detr\xE1s de las orejas.", "Mains crois\xE9es sur la poitrine ou derri\xE8re les oreilles.", "H\xE4nde vor der Brust gekreuzt oder hinter den Ohren.", "M\xE3os cruzadas no peito ou atr\xE1s das orelhas."],
  ["Sali con il busto fino a portare le spalle sopra il bacino.", "Sit up until your shoulders are over your hips.", "Sube el tronco hasta llevar los hombros sobre la cadera.", "Remonte le buste jusqu'\xE0 amener les \xE9paules au-dessus du bassin.", "Richte den Oberk\xF6rper auf, bis die Schultern \xFCber der H\xFCfte sind.", "Suba o tronco at\xE9 os ombros ficarem sobre o quadril."],
  ["Torna gi\xF9 finch\xE9 le scapole toccano terra.", "Lower back down until your shoulder blades touch the floor.", "Vuelve a bajar hasta que los om\xF3platos toquen el suelo.", "Redescends jusqu'\xE0 ce que les omoplates touchent le sol.", "Geh zur\xFCck, bis die Schulterbl\xE4tter den Boden ber\xFChren.", "Volte a descer at\xE9 as esc\xE1pulas tocarem o ch\xE3o."],
  ["Busto non abbastanza alto (non conta)", "Torso not high enough (doesn't count)", "Tronco no suficientemente alto (no cuenta)", "Buste pas assez haut (ne compte pas)", "Oberk\xF6rper nicht hoch genug (z\xE4hlt nicht)", "Tronco n\xE3o alto o suficiente (n\xE3o conta)"],
  ["Non torni gi\xF9 fino in fondo", "Not going all the way back down", "No bajas del todo", "Tu ne redescends pas jusqu'en bas", "Nicht ganz zur\xFCck nach unten", "N\xE3o volta at\xE9 o fim"],
  ["In piedi, piedi uniti, braccia lungo i fianchi.", "Stand with feet together, arms by your sides.", "De pie, pies juntos, brazos a los lados.", "Debout, pieds joints, bras le long du corps.", "Stehen, F\xFC\xDFe zusammen, Arme seitlich am K\xF6rper.", "De p\xE9, p\xE9s juntos, bra\xE7os ao lado do corpo."],
  ["Salta aprendo le gambe e portando le mani sopra la testa.", "Jump, spreading your legs and bringing your hands above your head.", "Salta abriendo las piernas y llevando las manos sobre la cabeza.", "Saute en \xE9cartant les jambes et en levant les mains au-dessus de la t\xEAte.", "Spring, spreize die Beine und f\xFChre die H\xE4nde \xFCber den Kopf.", "Salte abrindo as pernas e levando as m\xE3os acima da cabe\xE7a."],
  ["Salta di nuovo tornando a piedi uniti e braccia gi\xF9.", "Jump again back to feet together and arms down.", "Salta otra vez volviendo a pies juntos y brazos abajo.", "Saute \xE0 nouveau pour revenir pieds joints et bras en bas.", "Spring zur\xFCck: F\xFC\xDFe zusammen, Arme unten.", "Salte de novo voltando aos p\xE9s juntos e bra\xE7os para baixo."],
  ["Mantieni un ritmo costante.", "Keep a steady rhythm.", "Mant\xE9n un ritmo constante.", "Garde un rythme r\xE9gulier.", "Halte einen gleichm\xE4\xDFigen Rhythmus.", "Mantenha um ritmo constante."],
  ["Braccia non sopra la testa", "Arms not above your head", "Brazos no por encima de la cabeza", "Bras pas au-dessus de la t\xEAte", "Arme nicht \xFCber dem Kopf", "Bra\xE7os n\xE3o acima da cabe\xE7a"],
  ["Gambe non abbastanza aperte", "Legs not wide enough", "Piernas no suficientemente abiertas", "Jambes pas assez \xE9cart\xE9es", "Beine nicht weit genug gespreizt", "Pernas n\xE3o abertas o suficiente"],
  ["Avambracci a terra, gomiti sotto le spalle.", "Forearms on the floor, elbows under your shoulders.", "Antebrazos en el suelo, codos bajo los hombros.", "Avant-bras au sol, coudes sous les \xE9paules.", "Unterarme am Boden, Ellbogen unter den Schultern.", "Antebra\xE7os no ch\xE3o, cotovelos abaixo dos ombros."],
  ["Corpo dritto dalla testa ai talloni.", "Body straight from head to heels.", "Cuerpo recto de la cabeza a los talones.", "Corps droit de la t\xEAte aux talons.", "K\xF6rper gerade von Kopf bis Ferse.", "Corpo reto da cabe\xE7a aos calcanhares."],
  ["Contrai addome e glutei, respira regolarmente.", "Brace your abs and glutes, breathe steadily.", "Contrae abdomen y gl\xFAteos, respira con regularidad.", "Contracte abdos et fessiers, respire r\xE9guli\xE8rement.", "Spann Bauch und Po an, atme gleichm\xE4\xDFig.", "Contraia abd\xF4men e gl\xFAteos, respire normalmente."],
  ["Il tempo scorre solo quando la posizione \xE8 corretta.", "The clock only runs while your position is correct.", "El tiempo solo corre cuando la posici\xF3n es correcta.", "Le temps ne d\xE9file que si la position est correcte.", "Die Zeit l\xE4uft nur, solange die Haltung stimmt.", "O tempo s\xF3 corre quando a posi\xE7\xE3o est\xE1 correta."],
  ["Bacino che cede a terra", "Hips sagging on the floor", "Cadera que cae en el suelo", "Bassin qui s'affaisse au sol", "H\xFCfte h\xE4ngt am Boden durch", "Quadril caindo no ch\xE3o"],
  ["Bacino che cede", "Hips sagging", "Cadera que cae", "Bassin qui s'affaisse", "H\xFCfte h\xE4ngt durch", "Quadril caindo"],
  ["In piedi, busto dritto, mani sui fianchi.", "Stand tall, torso upright, hands on your hips.", "De pie, tronco recto, manos en la cintura.", "Debout, buste droit, mains sur les hanches.", "Aufrecht stehen, Oberk\xF6rper gerade, H\xE4nde an den H\xFCften.", "De p\xE9, tronco reto, m\xE3os na cintura."],
  ["Fai un passo lungo in avanti e scendi piegando entrambe le ginocchia.", "Take a long step forward and lower by bending both knees.", "Da un paso largo hacia delante y baja doblando ambas rodillas.", "Fais un grand pas en avant et descends en pliant les deux genoux.", "Mach einen gro\xDFen Schritt nach vorn und beuge beide Knie.", "D\xEA um passo longo \xE0 frente e des\xE7a dobrando os dois joelhos."],
  ["Il ginocchio dietro arriva vicino a terra, quello davanti resta sopra la caviglia.", "The back knee comes close to the floor, the front one stays over the ankle.", "La rodilla de atr\xE1s llega cerca del suelo, la de delante queda sobre el tobillo.", "Le genou arri\xE8re approche du sol, celui de devant reste au-dessus de la cheville.", "Das hintere Knie kommt nah an den Boden, das vordere bleibt \xFCber dem Kn\xF6chel.", "O joelho de tr\xE1s chega perto do ch\xE3o, o da frente fica sobre o tornozelo."],
  ["Spingi con la gamba davanti e torna su. Alterna le gambe.", "Push through the front leg and come back up. Alternate legs.", "Empuja con la pierna de delante y vuelve arriba. Alterna las piernas.", "Pousse sur la jambe avant et remonte. Alterne les jambes.", "Dr\xFCck dich mit dem vorderen Bein hoch. Beine abwechseln.", "Empurre com a perna da frente e volte. Alterne as pernas."],
  ["Non scendi abbastanza (non conta)", "Not going low enough (doesn't count)", "No bajas lo suficiente (no cuenta)", "Tu ne descends pas assez (ne compte pas)", "Nicht tief genug (z\xE4hlt nicht)", "N\xE3o desce o suficiente (n\xE3o conta)"],
  ["Busto inclinato in avanti", "Torso leaning forward", "Tronco inclinado hacia delante", "Buste pench\xE9 en avant", "Oberk\xF6rper nach vorn geneigt", "Tronco inclinado para a frente"],
  ["Posizione di piegamento a braccia tese, corpo dritto.", "Push-up position with straight arms, body straight.", "Posici\xF3n de flexi\xF3n con brazos estirados, cuerpo recto.", "Position de pompe bras tendus, corps droit.", "Liegest\xFCtzposition mit gestreckten Armen, K\xF6rper gerade.", "Posi\xE7\xE3o de flex\xE3o com bra\xE7os esticados, corpo reto."],
  ["Porta un ginocchio verso il petto, poi riportalo indietro.", "Drive one knee towards your chest, then take it back.", "Lleva una rodilla al pecho y luego devu\xE9lvela atr\xE1s.", "Am\xE8ne un genou vers la poitrine, puis ram\xE8ne-le en arri\xE8re.", "Zieh ein Knie zur Brust und dann wieder zur\xFCck.", "Leve um joelho ao peito e depois volte com ele."],
  ["Alterna le gambe con ritmo, come se corressi.", "Alternate legs with rhythm, as if you were running.", "Alterna las piernas con ritmo, como si corrieras.", "Alterne les jambes en rythme, comme si tu courais.", "Wechsle die Beine im Rhythmus, als w\xFCrdest du laufen.", "Alterne as pernas com ritmo, como se estivesse correndo."],
  ["Ogni ginocchio al petto vale una ripetizione.", "Each knee to the chest counts as one rep.", "Cada rodilla al pecho vale una repetici\xF3n.", "Chaque genou \xE0 la poitrine compte pour une r\xE9p\xE9tition.", "Jedes Knie zur Brust z\xE4hlt als eine Wiederholung.", "Cada joelho no peito vale uma repeti\xE7\xE3o."],
  ["Ginocchio non abbastanza vicino al petto", "Knee not close enough to the chest", "Rodilla no suficientemente cerca del pecho", "Genou pas assez pr\xE8s de la poitrine", "Knie nicht nah genug an der Brust", "Joelho n\xE3o perto o suficiente do peito"],
  ["In piedi, scendi in accosciata e appoggia le mani a terra.", "From standing, squat down and put your hands on the floor.", "De pie, baja en cuclillas y apoya las manos en el suelo.", "Debout, accroupis-toi et pose les mains au sol.", "Aus dem Stand in die Hocke gehen und die H\xE4nde auf den Boden setzen.", "De p\xE9, agache e apoie as m\xE3os no ch\xE3o."],
  ["Porta i piedi indietro in posizione di piegamento.", "Kick your feet back into a push-up position.", "Lleva los pies atr\xE1s en posici\xF3n de flexi\xF3n.", "Envoie les pieds en arri\xE8re en position de pompe.", "Spring mit den F\xFC\xDFen nach hinten in die Liegest\xFCtzposition.", "Leve os p\xE9s para tr\xE1s em posi\xE7\xE3o de flex\xE3o."],
  ["Riporta i piedi verso le mani e rialzati.", "Bring your feet back to your hands and stand up.", "Vuelve a llevar los pies hacia las manos y lev\xE1ntate.", "Ram\xE8ne les pieds vers les mains et rel\xE8ve-toi.", "Bring die F\xFC\xDFe zur\xFCck zu den H\xE4nden und steh auf.", "Traga os p\xE9s de volta \xE0s m\xE3os e levante-se."],
  ["Salta con le braccia sopra la testa: la ripetizione conta solo con il salto.", "Jump with your arms above your head: the rep only counts with the jump.", "Salta con los brazos sobre la cabeza: la repetici\xF3n solo cuenta con el salto.", "Saute bras au-dessus de la t\xEAte : la r\xE9p\xE9tition ne compte qu'avec le saut.", "Spring mit den Armen \xFCber dem Kopf: Die Wiederholung z\xE4hlt nur mit Sprung.", "Salte com os bra\xE7os acima da cabe\xE7a: a repeti\xE7\xE3o s\xF3 conta com o salto."],
  ["Salto senza braccia in alto (non conta)", "Jump without arms up (doesn't count)", "Salto sin brazos arriba (no cuenta)", "Saut sans bras lev\xE9s (ne compte pas)", "Sprung ohne Arme oben (z\xE4hlt nicht)", "Salto sem bra\xE7os para cima (n\xE3o conta)"],

  ["Massimo numero di ripetizioni valide in 2:00.", "As many valid reps as you can in 2:00.", "El m\xE1ximo de repeticiones v\xE1lidas en 2:00.", "Le maximum de r\xE9p\xE9titions valides en 2:00.", "So viele g\xFCltige Wiederholungen wie m\xF6glich in 2:00.", "O m\xE1ximo de repeti\xE7\xF5es v\xE1lidas em 2:00."],

  ["Al primo avvio il telefono ti chiede il permesso di usare la fotocamera: tocca Consenti. In alternativa puoi registrare un video della serie e farlo analizzare.", "The first time, your phone asks for permission to use the camera: tap Allow. You can also record a video of your set and have it analysed.", "La primera vez el tel\xE9fono te pide permiso para usar la c\xE1mara: toca Permitir. Tambi\xE9n puedes grabar un v\xEDdeo de la serie y que lo analice.", "La premi\xE8re fois, le t\xE9l\xE9phone demande l'autorisation d'utiliser la cam\xE9ra : touche Autoriser. Tu peux aussi filmer ta s\xE9rie et la faire analyser.", "Beim ersten Mal fragt dein Handy, ob die Kamera genutzt werden darf: Tippe auf Zulassen. Du kannst deinen Satz auch filmen und analysieren lassen.", "Na primeira vez, o celular pede permiss\xE3o para usar a c\xE2mera: toque em Permitir. Voc\xEA tamb\xE9m pode gravar um v\xEDdeo da s\xE9rie e mandar analisar."],
  ["Al primo avvio il telefono ti chiede il permesso di usare la fotocamera: tocca Consenti. In alternativa puoi registrare un video della serie e farlo analizzare.", "If the live camera doesn't open, use \u201CRecord a video\u201D: film your set and the trainer analyses it and counts the reps.", "Si la c\xE1mara en directo no se abre, usa \xABGrabar un v\xEDdeo\xBB: graba la serie y el instructor la analiza y cuenta las repeticiones.", "Si la cam\xE9ra en direct ne s'ouvre pas, utilise \xAB Filmer une vid\xE9o \xBB : filme ta s\xE9rie et l'instructeur l'analyse en comptant les r\xE9p\xE9titions.", "Wenn sich die Live-Kamera nicht \xF6ffnet, nutze \u201EVideo aufnehmen\u201C: Filme deinen Satz, der Ausbilder analysiert ihn und z\xE4hlt mit.", "Se a c\xE2mera ao vivo n\xE3o abrir, use \u201CGravar um v\xEDdeo\u201D: filme a s\xE9rie e o instrutor analisa e conta as repeti\xE7\xF5es."],
  ["Carico il sistema di visione\u2026", "Loading the vision system\u2026", "Cargando el sistema de visi\xF3n\u2026", "Chargement du syst\xE8me de vision\u2026", "Bildanalyse wird geladen\u2026", "Carregando o sistema de vis\xE3o\u2026"],
  ["Il sistema di visione non si \xE8 caricato. Controlla la connessione e riprova.", "The vision system didn't load. Check your connection and try again.", "El sistema de visi\xF3n no se ha cargado. Revisa la conexi\xF3n e int\xE9ntalo de nuevo.", "Le syst\xE8me de vision n'a pas pu se charger. V\xE9rifie ta connexion et r\xE9essaie.", "Die Bildanalyse wurde nicht geladen. Pr\xFCfe die Verbindung und versuch es erneut.", "O sistema de vis\xE3o n\xE3o carregou. Verifique a conex\xE3o e tente de novo."],
  ["Il sistema di visione non si \xE8 caricato. Controlla la connessione.", "The vision system didn't load. Check your connection.", "El sistema de visi\xF3n no se ha cargado. Revisa la conexi\xF3n.", "Le syst\xE8me de vision n'a pas pu se charger. V\xE9rifie ta connexion.", "Die Bildanalyse wurde nicht geladen. Pr\xFCfe die Verbindung.", "O sistema de vis\xE3o n\xE3o carregou. Verifique a conex\xE3o."],
  ["Non riesco ad aprire la fotocamera.", "I can't open the camera.", "No puedo abrir la c\xE1mara.", "Je n'arrive pas \xE0 ouvrir la cam\xE9ra.", "Ich kann die Kamera nicht \xF6ffnen.", "N\xE3o consigo abrir a c\xE2mera."],
  ["Controlla di aver dato il permesso nelle impostazioni del browser, oppure registra un video della serie.", "Check that you allowed it in the browser settings, or record a video of your set.", "Comprueba que diste permiso en los ajustes del navegador, o graba un v\xEDdeo de la serie.", "V\xE9rifie que tu as donn\xE9 l'autorisation dans les r\xE9glages du navigateur, ou filme ta s\xE9rie.", "Pr\xFCfe die Berechtigung in den Browser-Einstellungen oder nimm ein Video deines Satzes auf.", "Verifique se deu permiss\xE3o nas configura\xE7\xF5es do navegador, ou grave um v\xEDdeo da s\xE9rie."],
  ["La telecamera dal vivo non \xE8 disponibile in questa pagina.", "The live camera isn't available on this page.", "La c\xE1mara en directo no est\xE1 disponible en esta p\xE1gina.", "La cam\xE9ra en direct n'est pas disponible sur cette page.", "Die Live-Kamera ist auf dieser Seite nicht verf\xFCgbar.", "A c\xE2mera ao vivo n\xE3o est\xE1 dispon\xEDvel nesta p\xE1gina."],
  ["Usa \u201CRegistra un video\u201D: filma la serie e l'istruttore la analizza.", "Use \u201CRecord a video\u201D: film your set and the trainer analyses it.", "Usa \xABGrabar un v\xEDdeo\xBB: graba la serie y el instructor la analiza.", "Utilise \xAB Filmer une vid\xE9o \xBB : filme ta s\xE9rie et l'instructeur l'analyse.", "Nutze \u201EVideo aufnehmen\u201C: Filme deinen Satz und der Ausbilder analysiert ihn.", "Use \u201CGravar um v\xEDdeo\u201D: filme a s\xE9rie e o instrutor analisa."],
  ["Non riesco a leggere questo video. Prova a registrarlo di nuovo.", "I can't read this video. Try recording it again.", "No puedo leer este v\xEDdeo. Prueba a grabarlo otra vez.", "Je n'arrive pas \xE0 lire cette vid\xE9o. Essaie de la filmer \xE0 nouveau.", "Ich kann dieses Video nicht lesen. Nimm es bitte neu auf.", "N\xE3o consigo ler este v\xEDdeo. Tente gravar de novo."],

  // --- sergente
  ["Forza soldato, fammi vedere cosa sai fare!", "Come on soldier, show me what you've got!", "\xA1Vamos soldado, ens\xE9\xF1ame de qu\xE9 eres capaz!", "Allez soldat, montre-moi ce que tu vaux !", "Los, Soldat, zeig mir, was du kannst!", "Vamos, soldado, mostre do que \xE9 capaz!"],
  ["Testa alta, petto in fuori. Si comincia!", "Head up, chest out. Here we go!", "Cabeza alta, pecho fuera. \xA1Empezamos!", "T\xEAte haute, poitrine en avant. C'est parti !", "Kopf hoch, Brust raus. Es geht los!", "Cabe\xE7a erguida, peito para fora. Vamos come\xE7ar!"],
  ["Nessuna scusa oggi. Via!", "No excuses today. Go!", "Hoy no hay excusas. \xA1Ya!", "Pas d'excuses aujourd'hui. Go !", "Keine Ausreden heute. Los!", "Sem desculpas hoje. J\xE1!"],
  ["Concentrato. Ogni ripetizione conta!", "Focus. Every rep counts!", "Concentrado. \xA1Cada repetici\xF3n cuenta!", "Concentr\xE9. Chaque r\xE9p\xE9tition compte !", "Konzentration. Jede Wiederholung z\xE4hlt!", "Concentrado. Cada repeti\xE7\xE3o conta!"],
  ["Cos\xEC si fa!", "That's how it's done!", "\xA1As\xED se hace!", "C'est comme \xE7a qu'on fait !", "So wird's gemacht!", "\xC9 assim que se faz!"],
  ["Bravo, continua!", "Good, keep going!", "\xA1Bien, sigue!", "Bien, continue !", "Gut, weiter!", "Boa, continue!"],
  ["Non fermarti adesso!", "Don't stop now!", "\xA1No te pares ahora!", "Ne t'arr\xEAte pas maintenant !", "H\xF6r jetzt nicht auf!", "N\xE3o pare agora!"],
  ["Questo \xE8 il ritmo giusto!", "That's the right pace!", "\xA1Ese es el ritmo!", "C'est le bon rythme !", "Genau das richtige Tempo!", "Esse \xE9 o ritmo certo!"],
  ["Sei pi\xF9 forte di quanto pensi!", "You're stronger than you think!", "\xA1Eres m\xE1s fuerte de lo que crees!", "Tu es plus fort que tu ne le crois !", "Du bist st\xE4rker, als du denkst!", "Voc\xEA \xE9 mais forte do que pensa!"],
  ["Il dolore passa, l'orgoglio resta!", "Pain fades, pride stays!", "\xA1El dolor pasa, el orgullo queda!", "La douleur passe, la fiert\xE9 reste !", "Der Schmerz vergeht, der Stolz bleibt!", "A dor passa, o orgulho fica!"],
  ["Spingi, soldato!", "Push, soldier!", "\xA1Empuja, soldado!", "Pousse, soldat !", "Dr\xFCck, Soldat!", "For\xE7a, soldado!"],
  ["Ottima forma, avanti!", "Great form, keep going!", "\xA1Muy buena t\xE9cnica, adelante!", "Excellente forme, continue !", "Saubere Technik, weiter!", "\xD3tima execu\xE7\xE3o, em frente!"],
  ["Met\xE0 fatta! Adesso viene il bello!", "Halfway there! Now the fun starts!", "\xA1Mitad hecha! \xA1Ahora viene lo bueno!", "La moiti\xE9 ! Maintenant le meilleur arrive !", "Halbzeit! Jetzt wird's spannend!", "Metade feita! Agora vem a parte boa!"],
  ["Sei a met\xE0 strada. Non mollare!", "You're halfway. Don't give up!", "Vas por la mitad. \xA1No te rindas!", "Tu es \xE0 mi-chemin. Ne l\xE2che rien !", "Du hast die H\xE4lfte. Nicht aufgeben!", "Voc\xEA est\xE1 na metade. N\xE3o desista!"],
  ["Ultime tre! Dai tutto!", "Last three! Give it everything!", "\xA1\xDAltimas tres! \xA1Dalo todo!", "Les trois derni\xE8res ! Donne tout !", "Die letzten drei! Gib alles!", "\xDAltimas tr\xEAs! D\xEA tudo!"],
  ["Tre alla fine! Stringi i denti!", "Three to go! Grit your teeth!", "\xA1Quedan tres! \xA1Aprieta los dientes!", "Plus que trois ! Serre les dents !", "Noch drei! Z\xE4hne zusammenbei\xDFen!", "Faltam tr\xEAs! Cerre os dentes!"],
  ["Ultima! Tutto quello che hai!", "Last one! Everything you've got!", "\xA1La \xFAltima! \xA1Todo lo que tienes!", "La derni\xE8re ! Tout ce que tu as !", "Die letzte! Alles, was du hast!", "A \xFAltima! Tudo o que voc\xEA tem!"],
  ["L'ultima \xE8 la pi\xF9 importante. Spingi!", "The last one matters most. Push!", "La \xFAltima es la m\xE1s importante. \xA1Empuja!", "La derni\xE8re est la plus importante. Pousse !", "Die letzte ist die wichtigste. Dr\xFCck!", "A \xFAltima \xE9 a mais importante. For\xE7a!"],
  ["Non mollare! Su!", "Don't quit! Come on!", "\xA1No te rindas! \xA1Vamos!", "Ne l\xE2che pas ! Allez !", "Nicht aufgeben! Los!", "N\xE3o desista! Vamos!"],
  ["Avanti, non ti ho detto di riposare!", "Move it, I didn't tell you to rest!", "\xA1Vamos, no te he dicho que descanses!", "Allez, je ne t'ai pas dit de te reposer !", "Weiter, ich habe nicht gesagt, dass du Pause machen sollst!", "Vamos, eu n\xE3o mandei descansar!"],
  ["Rialzati e continua!", "Get up and keep going!", "\xA1Lev\xE1ntate y sigue!", "Rel\xE8ve-toi et continue !", "Steh auf und mach weiter!", "Levante e continue!"],
  ["Respira e spingi! Ancora una!", "Breathe and push! One more!", "\xA1Respira y empuja! \xA1Una m\xE1s!", "Respire et pousse ! Encore une !", "Atme und dr\xFCck! Noch eine!", "Respire e empurre! Mais uma!"],
  ["Il traguardo \xE8 vicino, muoviti!", "The finish is close, move it!", "\xA1La meta est\xE1 cerca, mu\xE9vete!", "L'arriv\xE9e est proche, bouge-toi !", "Das Ziel ist nah, beweg dich!", "A chegada est\xE1 perto, mexa-se!"],
  ["Chi molla adesso? Non tu!", "Who quits now? Not you!", "\xBFQui\xE9n se rinde ahora? \xA1T\xFA no!", "Qui abandonne maintenant ? Pas toi !", "Wer gibt jetzt auf? Du nicht!", "Quem desiste agora? Voc\xEA n\xE3o!"],
  ["Tieni duro!", "Hang in there!", "\xA1Aguanta!", "Tiens bon !", "Halte durch!", "Aguente firme!"],
  ["Addome di ferro, non cedere!", "Iron core, don't give in!", "\xA1Abdomen de hierro, no cedas!", "Abdos d'acier, ne l\xE2che pas !", "Bauch aus Stahl, nicht nachgeben!", "Abd\xF4men de ferro, n\xE3o ceda!"],
  ["Il corpo vuole fermarsi, la testa no!", "Your body wants to stop, your mind doesn't!", "\xA1El cuerpo quiere parar, la cabeza no!", "Le corps veut s'arr\xEAter, la t\xEAte non !", "Der K\xF6rper will aufh\xF6ren, der Kopf nicht!", "O corpo quer parar, a cabe\xE7a n\xE3o!"],
  ["Respira. Resisti!", "Breathe. Hold on!", "Respira. \xA1Resiste!", "Respire. R\xE9siste !", "Atme. Halte durch!", "Respire. Resista!"],
  ["Ultimi secondi! Tieni duro!", "Last seconds! Hang in there!", "\xA1\xDAltimos segundos! \xA1Aguanta!", "Derni\xE8res secondes ! Tiens bon !", "Letzte Sekunden! Halte durch!", "\xDAltimos segundos! Aguente firme!"],
  ["Serie completata! Ottimo lavoro, soldato!", "Set complete! Great work, soldier!", "\xA1Serie completada! \xA1Buen trabajo, soldado!", "S\xE9rie termin\xE9e ! Excellent travail, soldat !", "Satz geschafft! Starke Arbeit, Soldat!", "S\xE9rie conclu\xEDda! \xD3timo trabalho, soldado!"],
  ["Questo \xE8 lo spirito! Serie chiusa!", "That's the spirit! Set done!", "\xA1Ese es el esp\xEDritu! \xA1Serie cerrada!", "Voil\xE0 l'esprit ! S\xE9rie boucl\xE9e !", "So ist's richtig! Satz erledigt!", "Esse \xE9 o esp\xEDrito! S\xE9rie fechada!"],
  ["Bravo! Un passo pi\xF9 vicino al prossimo grado!", "Well done! One step closer to the next rank!", "\xA1Bien! \xA1Un paso m\xE1s cerca del pr\xF3ximo grado!", "Bravo ! Un pas de plus vers le prochain grade !", "Gut gemacht! Ein Schritt n\xE4her am n\xE4chsten Rang!", "Muito bem! Um passo mais perto da pr\xF3xima patente!"],
  ["Respira. Recupera. Tra poco si riparte.", "Breathe. Recover. We go again soon.", "Respira. Recupera. Enseguida seguimos.", "Respire. R\xE9cup\xE8re. On repart bient\xF4t.", "Atme. Erhol dich. Gleich geht's weiter.", "Respire. Recupere. Logo recome\xE7amos."],
  ["Bevi un sorso d'acqua. Il prossimo giro \xE8 tuo.", "Have a sip of water. The next round is yours.", "Bebe un sorbo de agua. La pr\xF3xima ronda es tuya.", "Bois une gorg\xE9e d'eau. Le prochain tour est \xE0 toi.", "Trink einen Schluck Wasser. Die n\xE4chste Runde geh\xF6rt dir.", "Beba um gole de \xE1gua. A pr\xF3xima rodada \xE9 sua."],
  ["Trenta secondi! Accelera!", "Thirty seconds! Speed up!", "\xA1Treinta segundos! \xA1Acelera!", "Trente secondes ! Acc\xE9l\xE8re !", "Drei\xDFig Sekunden! Gib Gas!", "Trinta segundos! Acelere!"],
  ["Dieci secondi! Tutto quello che hai!", "Ten seconds! Everything you've got!", "\xA1Diez segundos! \xA1Todo lo que tienes!", "Dix secondes ! Tout ce que tu as !", "Zehn Sekunden! Alles, was du hast!", "Dez segundos! Tudo o que voc\xEA tem!"],
  ["Sei in testa! Non rallentare!", "You're in the lead! Don't slow down!", "\xA1Vas en cabeza! \xA1No aflojes!", "Tu es en t\xEAte ! Ne ralentis pas !", "Du f\xFChrst! Nicht langsamer werden!", "Voc\xEA est\xE1 na frente! N\xE3o diminua!"],
  ["Stai vincendo, chiudi la partita!", "You're winning, finish it off!", "\xA1Vas ganando, cierra el reto!", "Tu gagnes, termine le travail !", "Du gewinnst, bring es zu Ende!", "Voc\xEA est\xE1 vencendo, feche a partida!"],
  ["Ti sta superando! Reagisci!", "They're overtaking you! Fight back!", "\xA1Te est\xE1 adelantando! \xA1Reacciona!", "Il te d\xE9passe ! R\xE9agis !", "Du wirst \xFCberholt! Wehr dich!", "Est\xE3o passando voc\xEA! Reaja!"],
  ["Sei indietro! Adesso o mai pi\xF9!", "You're behind! Now or never!", "\xA1Vas por detr\xE1s! \xA1Ahora o nunca!", "Tu es derri\xE8re ! C'est maintenant ou jamais !", "Du liegst hinten! Jetzt oder nie!", "Voc\xEA est\xE1 atr\xE1s! Agora ou nunca!"],
  ["Agli ordini! Da adesso ti tengo sotto pressione.", "Yes sir! From now on I'll keep the pressure on.", "\xA1A la orden! A partir de ahora te aprieto.", "\xC0 vos ordres ! D\xE9sormais je te mets la pression.", "Zu Befehl! Ab jetzt mache ich dir Druck.", "\xC0s ordens! A partir de agora vou pegar no seu p\xE9."],

  const me = CH.myFinal, opp = CH.oppFinal;
  let outcome;
  if (CH.cfg.fmt === "first") outcome = me >= DUEL_FMT.first.n && opp < DUEL_FMT.first.n ? "win" : opp >= DUEL_FMT.first.n && me < DUEL_FMT.first.n ? "lose" : me > opp ? "win" : me < opp ? "lose" : "tie";
  else outcome = me > opp ? "win" : me < opp ? "lose" : "tie";
  if (outcome === "win") CH.wins.me++;
  else if (outcome === "lose") CH.wins.opp++;
  addPoints(outcome === "win" ? 30 : outcome === "tie" ? 15 : 10);
  duelSend({ t: "card", card: myCard() });
  $("rest").hidden = true;
  $("restSkip").hidden = false;
  $("rest").querySelector(".label").textContent = "Recupero";
  $("opp").hidden = true;
  $("stage").classList.remove("duel");
  closeSession();
  S.challenge = false;
  const who = CH.oppName || "il tuo amico";
  say(outcome === "win" ? "Hai vinto! Ottimo lavoro, recluta." : outcome === "lose" ? "Ha vinto ".concat(who, ". Alla prossima, recluta.") : "Pareggio!", { urgent: true });
  go({ name: "duel-result", outcome, me, opp });
}
function renderDuelResult() {
  const r = route, host = CH.role === "host";
  const verdict = r.outcome === "win" ? "Hai vinto!" : r.outcome === "lose" ? "Ha vinto ".concat(esc(CH.oppName || "l'amico")) : "Pareggio";
  app.innerHTML = '\n  <div class="screen">\n    <header class="mast"><div><div class="sub">Sfida \xB7 '.concat(esc(fmtTxt(CH.cfg)), '</div></div><div class="callsign">Vittorie<b>').concat(CH.wins.me, "\u2013").concat(CH.wins.opp, '</b></div></header>\n    <div class="verdict">').concat(verdict, '</div>\n    <div class="vs">\n      <div class="').concat(r.outcome === "win" ? "win" : "", '"><b>').concat(r.me, "</b><span>").concat(esc(myName || "Tu"), " ").concat(myBadge(), '</span></div>\n      <em>VS</em>\n      <div class="').concat(r.outcome === "lose" ? "win" : "", '"><b>').concat(r.opp, "</b><span>").concat(esc(CH.oppName || "Amico"), '</span></div>\n    </div>\n    <p class="meta">Contano solo le ripetizioni complete e valide. Punti sfida: ').concat(r.outcome === "win" ? "+30" : r.outcome === "tie" ? "+15" : "+10", ', pi\xF9 1 punto per ripetizione.</p>\n    <div class="row">\n      ').concat(host ? '<button class="btn primary" id="again" type="button" '.concat(CH.connected ? "" : "disabled", ">Rivincita</button>") : '<p class="note">'.concat(CH.connected ? "Per la rivincita aspetta ".concat(esc(CH.oppName || "l'amico"), ".") : "La connessione con l'amico si \xE8 chiusa.", "</p>"), '\n      <button class="btn ghost" id="leave" type="button">Esci dalla sfida</button>\n    </div>\n  </div>');
  if (host) $("again").onclick = () => {
    duelSend({ t: "lobby" });
    go({ name: "lobby" });
  };
  $("leave").onclick = () => {
    duelReset();
    try {
      history.replaceState(null, "", location.pathname);
    } catch (e) {
    }
    go({ name: "home" });
  };
}
try {
  const code = new URLSearchParams(location.search).get("sfida");
  if (SITE && code) route = { name: "duel-join", code: code.toUpperCase().slice(0, 6) };
} catch (e) {
}
checkFriendsElite();
applyGold();
startI18n();
render();
lbInit();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {
});
loadEngine().catch(() => {
});
