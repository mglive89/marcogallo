<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}</style>
<title>FitQuest</title>
<meta name="theme-color" content="#f3f5f9">
<meta name="description" content="Personal trainer con la fotocamera: percorsi Uomo e Donna, conta le ripetizioni e corregge la postura.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FitQuest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: bright training-sheet look. Home = today's circuit drawn as illustrated cards with arrows; tab bar at the bottom; session = camera full screen. */
:root {
  --bg: #f3f5f9;
  --panel: #ffffff;
  --panel-2: #eef1f6;
  --line: #e1e6ee;
  --fg: #16202c;
  --muted: #667283;
  --brass: #2e86de;
  --brass-ink: #ffffff;
  --soft: #e6f1fc;
  --ok: #24a148;
  --bad: #e0473a;
  --warn: #f0a020;
  --shadow: 0 1px 2px rgba(22,32,44,.06), 0 6px 18px rgba(22,32,44,.07);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-cond: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
body.g-f { --brass: #b02a91; --soft: #f8e6f3; }
body.goldtheme { --brass: #c9971c; --soft: #fbf1d6; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, select:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

.screen { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: calc(env(safe-area-inset-top, 0px) + 16px) 32px; display: flex; flex-direction: column; gap: 20px; }
body.tabs .screen { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); }

/* Header */
.mast { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.mast h1 { font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: 1.05; text-transform: uppercase; letter-spacing: .01em; }
.mast .sub { font-size: 14px; color: var(--muted); margin-top: 2px; }
.callsign { font-family: var(--f-cond); font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: right; }
.callsign b { display: block; font-size: 24px; color: var(--fg); letter-spacing: 0; font-variant-numeric: tabular-nums; }
.hello { display: flex; align-items: center; gap: 12px; }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; overflow: hidden; flex: 0 0 auto; border: 2px solid var(--brass); }
.avatar svg { width: 64px; height: 54px; margin-top: 10px; }
.gswitch { display: inline-flex; background: var(--panel-2); border-radius: 999px; padding: 3px; gap: 2px; }
.gswitch button { border: 0; background: none; border-radius: 999px; padding: 6px 12px; font-family: var(--f-cond); font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); min-height: 34px; }
.gswitch button[aria-pressed="true"] { background: var(--brass); color: var(--brass-ink); }

.label { font-family: var(--f-cond); font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.section { display: flex; flex-direction: column; gap: 10px; }
.h2 { font-family: var(--f-display); font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: .01em; }

/* Cards */
.order { background: var(--panel); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); position: relative; }
.order h2 { font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1.1; text-transform: uppercase; }
.order .meta, .meta { color: var(--muted); font-size: 14px; }
.blocks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.blocks li { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-family: var(--f-cond); font-size: 18px; font-weight: 600; }
.blocks li:last-child { border-bottom: 0; }
.blocks li span:last-child { color: var(--brass); font-variant-numeric: tabular-nums; }

/* Today's circuit: illustrated sheet like a printed workout card */
.circuit { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 22px; padding: 4px 2px 6px; }
.step { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; background: none; border: 0; padding: 0; }
.step .figbox { width: 100%; aspect-ratio: 6 / 5; }
.step .figbox svg, .figbox svg { width: 100%; height: 100%; display: block; }
.step b { font-family: var(--f-cond); font-weight: 700; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; line-height: 1.1; margin-top: 4px; }
.step span { font-family: var(--f-cond); font-weight: 800; font-size: 16px; color: var(--brass); letter-spacing: .04em; }
.step .arrow { position: absolute; width: 34px; height: 34px; color: #b7bec8; pointer-events: none; }
.step:nth-child(odd) .arrow { right: -30px; top: 30%; }
.step:nth-child(even) .arrow { left: -30px; bottom: -22px; transform: rotate(130deg); }
.step:last-child .arrow { display: none; }
.restnote { text-align: center; font-size: 13px; color: var(--muted); }

.weeks { display: flex; gap: 6px; }
.wk { flex: 1 1 0; background: var(--panel-2); border-radius: 10px; padding: 6px 8px; font-family: var(--f-cond); font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; flex-direction: column; gap: 4px; align-items: center; }
.wk.now { background: var(--soft); color: var(--fg); }
.dots { display: flex; gap: 4px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid #b7bec8; }
.dots i.done { background: var(--ok); border-color: var(--ok); }

.btn { border: 0; border-radius: 14px; padding: 14px 18px; font-family: var(--f-cond); font-weight: 700; font-size: 19px; letter-spacing: .06em; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; }
.btn.primary { background: var(--brass); color: var(--brass-ink); box-shadow: 0 4px 14px color-mix(in srgb, var(--brass) 35%, transparent); }
.btn.ghost { background: var(--panel); border: 1.5px solid var(--line); color: var(--fg); }
.btn.small { min-height: 44px; padding: 8px 14px; font-size: 16px; border-radius: 12px; }
.btn.big { min-height: 62px; font-size: 22px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 150px; }

/* Exercise grid */
.exlist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ex { display: flex; flex-direction: column; align-items: stretch; gap: 2px; text-align: left; background: var(--panel); border: 0; border-radius: 16px; padding: 10px 12px 12px; box-shadow: var(--shadow); position: relative; }
.ex .figbox { aspect-ratio: 6 / 5; width: 100%; background: linear-gradient(180deg, var(--soft), transparent 80%); border-radius: 12px; }
.ex b { font-family: var(--f-cond); font-size: 18px; font-weight: 700; display: block; line-height: 1.15; text-transform: uppercase; margin-top: 6px; }
.ex small { color: var(--muted); font-size: 13px; line-height: 1.3; }
.ex .go { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; color: var(--brass); font-family: var(--f-cond); font-size: 20px; font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.ex.wide { flex-direction: row; align-items: center; gap: 12px; grid-column: 1 / -1; }
.ex.wide .figbox { width: 96px; flex: 0 0 96px; }
.ex.wide .go { position: static; margin-left: auto; flex: 0 0 auto; }
.ex.locked { opacity: .6; }
.ex.locked .figbox { filter: grayscale(1); }
.ex.locked .go { color: var(--muted); }
.ex .go svg { width: 16px; height: 16px; }

.note { font-size: 13px; color: var(--muted); background: var(--panel-2); border-radius: 10px; padding: 10px 12px; }

/* Briefing */
.brief h2 { font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: 1.05; text-transform: uppercase; }
.brief .goal { font-family: var(--f-cond); font-size: 19px; font-weight: 600; color: var(--brass); }
.demo { background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); padding: 8px 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.demo .figbox { width: 100%; max-width: 360px; margin: 0 auto; aspect-ratio: 6 / 5; }
.demo h3 { font-family: var(--f-display); font-weight: 800; font-size: 22px; text-transform: uppercase; }
.steps { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.steps li::marker { font-family: var(--f-cond); font-weight: 800; color: var(--brass); }
.faults { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.faults li { display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: baseline; font-size: 14px; }
.faults li::before { content: ""; width: 9px; height: 9px; background: var(--bad); border-radius: 50%; }
.camtip { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; background: var(--panel-2); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.camtip svg { width: 56px; height: 42px; }
.back { align-self: flex-start; background: var(--panel); border: 0; border-radius: 999px; box-shadow: var(--shadow); color: var(--fg); font-family: var(--f-cond); font-weight: 700; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; padding: 8px 14px; min-height: 40px; }
.stickybar { position: sticky; bottom: 0; padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px); background: linear-gradient(transparent, var(--bg) 30%); display: flex; flex-direction: column; gap: 8px; }

/* Bottom tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: rgba(255,255,255,.96); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px calc(env(safe-area-inset-bottom, 0px) + 6px); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; min-height: 52px; color: var(--muted); font-family: var(--f-cond); font-weight: 700; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--brass); }

/* Onboarding */
.pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pick button { background: var(--panel); border: 2px solid transparent; border-radius: 18px; box-shadow: var(--shadow); padding: 10px 10px 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.pick button .figbox { width: 100%; aspect-ratio: 6 / 5; }
.pick button b { font-family: var(--f-display); font-weight: 800; font-size: 24px; text-transform: uppercase; }
.pick button.m b { color: #2e86de; } .pick button.f b { color: #b02a91; }
.pick button small { color: var(--muted); font-size: 13px; text-align: center; }

/* Session (camera) stays dark */
#session { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; z-index: 10; color: #f4f6f9; }
.stage { position: relative; flex: 1 1 auto; overflow: hidden; background: #000; }
.stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.stage.mirror video, .stage.mirror canvas { transform: scaleX(-1); }
.hud-top { position: absolute; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; background: linear-gradient(rgba(0,0,0,.75), rgba(0,0,0,0)); }
.hud-ex { font-family: var(--f-cond); font-weight: 700; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: #9ccaf5; }
body.g-f .hud-ex { color: #f0a6dc; }
.hud-ex b { display: block; font-size: 24px; letter-spacing: .02em; color: #fff; }
.hud-timer { font-family: var(--f-cond); font-size: 24px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
.counter { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; align-items: flex-end; text-shadow: 0 2px 12px rgba(0,0,0,.8); }
.counter .n { font-family: var(--f-display); font-weight: 800; font-size: 120px; line-height: .9; color: #fff; font-variant-numeric: tabular-nums; }
.counter .of { font-family: var(--f-cond); font-size: 20px; font-weight: 800; letter-spacing: .1em; color: #9ccaf5; text-transform: uppercase; }
body.g-f .counter .of { color: #f0a6dc; }
.counter .n.bump { animation: bump .35s ease-out; }
@keyframes bump { 0% { transform: scale(1.25); color: #7ee29b; } 100% { transform: scale(1); } }
.meter { position: absolute; left: 12px; bottom: 16px; width: 14px; height: 40%; border: 2px solid rgba(255,255,255,.6); border-radius: 8px; overflow: hidden; }
.meter i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--brass); height: 0%; transition: height .08s linear; }
.meter b { position: absolute; left: -2px; right: -2px; height: 2px; background: var(--ok); }
.banner { position: absolute; left: 12px; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 76px); padding: 10px 14px; border-radius: 14px; font-family: var(--f-cond); font-weight: 700; font-size: 23px; line-height: 1.15; text-align: center; background: rgba(15,20,28,.82); border: 2px solid rgba(255,255,255,.2); color: #fff; }
.banner.ok { border-color: var(--ok); }
.banner.bad { border-color: var(--bad); background: rgba(120,24,16,.88); }
.banner.warn { border-color: var(--warn); }
.loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; color: #fff; background: rgba(0,0,0,.72); font-family: var(--f-cond); font-size: 19px; }
.loading .bar { width: min(260px, 70vw); height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
.loading .bar i { display: block; height: 100%; width: 30%; background: var(--brass); animation: slide 1.1s ease-in-out infinite alternate; }
@keyframes slide { from { transform: translateX(-30%); } to { transform: translateX(260%); } }
.dock { flex: 0 0 auto; background: #0d1117; padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 10px); display: flex; gap: 8px; align-items: center; }
.dock .btn { flex: 1 1 auto; }
.dock .btn.ghost { background: #1b222c; border-color: #2b3440; color: #fff; }
.dock .adj { flex: 0 0 54px; padding: 0; font-size: 26px; }

.rest { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #f3f5f9; color: var(--fg); padding: 24px; text-align: center; }
.rest .label { color: var(--muted); }
.rest .big { font-family: var(--f-display); font-weight: 800; font-size: 96px; color: var(--brass); font-variant-numeric: tabular-nums; line-height: 1; }
.rest .next { font-family: var(--f-cond); font-size: 22px; font-weight: 700; text-transform: uppercase; }
.rest .figbox { width: min(300px, 70vw); aspect-ratio: 6 / 5; }

/* Summary */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--panel); border-radius: 16px; box-shadow: var(--shadow); padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--f-display); font-weight: 800; font-size: 36px; font-variant-numeric: tabular-nums; line-height: 1; color: var(--brass); }
.stat span { font-family: var(--f-cond); font-weight: 600; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; font-size: 15px; background: var(--panel); border-radius: 16px; box-shadow: var(--shadow); padding: 4px 14px; }
.log li { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.log li:last-child { border-bottom: 0; }
.log li span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); }

.toggle { display: flex; align-items: center; gap: 12px; font-size: 15px; background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); padding: 12px 14px; min-height: 52px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--brass); flex: 0 0 auto; }

/* Duel */
.stage .opp { position: absolute; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 72px); width: 32%; max-width: 200px; aspect-ratio: 3 / 4; border: 2px solid var(--brass); border-radius: 12px; overflow: hidden; background: #000; }
.stage .opp video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.oppTag { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; padding: 4px 8px; background: rgba(0,0,0,.7); font-family: var(--f-cond); font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #fff; }
.oppTag span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.oppTag b { font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: 1; color: #fff; font-variant-numeric: tabular-nums; }
.duel .banner { right: calc(min(32%, 200px) + 24px); font-size: 18px; }
.duel .counter .of { color: #7ee29b; }
.code { font-family: var(--f-display); font-weight: 800; font-size: 46px; letter-spacing: .12em; color: var(--brass); line-height: 1; font-variant-numeric: tabular-nums; }
.lobvids { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.lobvid { position: relative; aspect-ratio: 3 / 4; background: #10151c; border-radius: 16px; overflow: hidden; }
.lobvid video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.lobvid span { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 10px; background: rgba(0,0,0,.6); font-family: var(--f-cond); font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: #fff; }
.lobvid .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 12px; text-align: center; color: #aab3bf; font-size: 13px; }
.status { display: flex; align-items: center; gap: 10px; font-family: var(--f-cond); font-size: 19px; font-weight: 600; }
.status i { width: 12px; height: 12px; border-radius: 50%; background: var(--warn); flex: 0 0 auto; }
.status.on i { background: var(--ok); }
.status.off i { background: var(--bad); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field input { font: inherit; font-size: 18px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--panel); color: var(--fg); min-width: 0; }
.field select, .field textarea { font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--panel); color: var(--fg); min-width: 0; width: 100%; }
.field textarea { resize: vertical; line-height: 1.4; }
.field input[type="range"] { padding: 0; border: 0; background: none; accent-color: var(--brass); height: 32px; }
.field input:focus-visible { outline: 3px solid var(--brass); outline-offset: 1px; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.choice { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; text-align: left; font-family: var(--f-cond); font-size: 17px; font-weight: 700; text-transform: uppercase; }
.choice small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 12px; color: var(--muted); text-transform: none; }
.choice[aria-pressed="true"] { border-color: var(--brass); background: var(--soft); }
.choice .figbox { width: 100%; aspect-ratio: 6 / 5; }
.verdict { font-family: var(--f-display); font-weight: 800; font-size: 42px; line-height: 1.05; color: var(--brass); text-transform: uppercase; }
.vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; text-align: center; }
.vs div { background: var(--panel); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 8px; display: flex; flex-direction: column; gap: 4px; border: 2px solid transparent; }
.vs div.win { border-color: var(--brass); }
.vs b { font-family: var(--f-display); font-weight: 800; font-size: 50px; line-height: 1; font-variant-numeric: tabular-nums; }
.vs span { font-family: var(--f-cond); font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vs em { font-family: var(--f-display); font-weight: 800; font-style: normal; color: var(--muted); }
.modes { display: grid; gap: 10px; }
.mode { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 12px; background: var(--panel); border: 0; border-radius: 16px; box-shadow: var(--shadow); padding: 14px; text-align: left; min-height: 76px; }
.mode .ico { width: 52px; height: 52px; border-radius: 14px; background: var(--soft); color: var(--brass); display: grid; place-items: center; }
.mode .ico svg { width: 28px; height: 28px; }
.mode b { display: block; font-family: var(--f-cond); font-weight: 800; font-size: 20px; text-transform: uppercase; line-height: 1.1; }
.mode small { color: var(--muted); font-size: 13px; }
.mode .go { color: var(--brass); font-family: var(--f-cond); font-size: 24px; font-weight: 700; }
.invite { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 80px); z-index: 20; max-width: 520px; margin: 0 auto; background: var(--panel); border-radius: 18px; box-shadow: 0 10px 40px rgba(0,0,0,.25); padding: 16px; display: flex; flex-direction: column; gap: 10px; border: 2px solid var(--brass); }
.invite b { font-family: var(--f-cond); font-weight: 800; font-size: 22px; text-transform: uppercase; }
.searching { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 20px 0; }
.radar { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--soft); position: relative; }
.radar::before, .radar::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--brass); animation: ping 1.6s ease-out infinite; }
.radar::after { animation-delay: .8s; }
@keyframes ping { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.2); opacity: 0; } }

/* Ranks, points, leaderboard */
.rk { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 999px; background: var(--soft); color: var(--brass); font-family: var(--f-cond); font-weight: 800; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; vertical-align: middle; white-space: nowrap; }
.rk.gold { background: linear-gradient(135deg, #f3d36b, #b8902a); color: #1a1406; }
.rankcard { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: end; background: var(--panel); border: 0; border-radius: 18px; box-shadow: var(--shadow); padding: 14px 16px; }
.rankcard .rname { font-family: var(--f-cond); font-weight: 800; font-size: 22px; line-height: 1.1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rankcard .pts { font-family: var(--f-display); font-weight: 800; font-size: 32px; color: var(--brass); font-variant-numeric: tabular-nums; text-align: right; line-height: 1; }
.rankcard .pts small { display: block; font-family: var(--f-cond); font-weight: 600; font-size: 11px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; margin-top: 4px; }
.xp { grid-column: 1 / -1; height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.xp i { display: block; height: 100%; background: var(--brass); border-radius: 4px; }
.rankcard .meta { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
.lb { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.lb li { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); border: 2px solid transparent; }
.lb li.podium .pos { color: var(--brass); }
.lb li.me { border-color: var(--brass); }
.lb .pos { font-family: var(--f-display); font-weight: 800; font-size: 20px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lb .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--f-cond); font-weight: 700; font-size: 17px; }
.lb .pts { font-family: var(--f-cond); font-weight: 800; font-size: 18px; color: var(--brass); font-variant-numeric: tabular-nums; }
.lb .lbmsg { display: block; color: var(--muted); font-size: 14px; }
.lb .inv { min-height: 36px; padding: 4px 12px; font-size: 14px; }
.elite .ex { outline: 2px dashed #e2c26a; outline-offset: -2px; }
@media (prefers-reduced-motion: reduce) { .counter .n.bump, .loading .bar i, .radar::before, .radar::after { animation: none; } }

/* ---------- Effetti grafici (Profilo › Grafica ed effetti): fx-full, fx-lite, fx-off ---------- */
body.fx-full::before { content: ""; position: fixed; top: -20vmax; right: -20vmax; bottom: -20vmax; left: -20vmax; z-index: -1; pointer-events: none;
  background: radial-gradient(28vmax 28vmax at 18% 22%, color-mix(in srgb, var(--brass) 16%, transparent), transparent 70%),
              radial-gradient(24vmax 24vmax at 82% 38%, color-mix(in srgb, var(--brass) 11%, transparent), transparent 70%),
              radial-gradient(30vmax 30vmax at 40% 88%, color-mix(in srgb, var(--warn) 9%, transparent), transparent 70%);
  animation: fxDrift 22s ease-in-out infinite alternate; will-change: transform; }
@keyframes fxDrift { from { transform: translate3d(-3vmax, -2vmax, 0) rotate(0deg); } to { transform: translate3d(3vmax, 3vmax, 0) rotate(8deg); } }

/* screen transitions */
#app[data-enter="slide-l"] > .screen { animation: fxSlideL .42s cubic-bezier(.2,.8,.2,1) both; }
#app[data-enter="slide-r"] > .screen { animation: fxSlideR .42s cubic-bezier(.2,.8,.2,1) both; }
#app[data-enter="zoom"] > .screen { animation: fxZoom .42s cubic-bezier(.2,.8,.2,1) both; }
#app[data-enter="flip"] { perspective: 1200px; }
#app[data-enter="flip"] > .screen { animation: fxFlip .55s cubic-bezier(.2,.8,.2,1) both; transform-origin: 50% 30%; }
#app[data-enter="fade"] > .screen { animation: fxFade .3s ease-out both; }
@keyframes fxSlideL { from { transform: translate3d(40px, 0, 0); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fxSlideR { from { transform: translate3d(-40px, 0, 0); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fxZoom { from { transform: scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fxFlip { from { transform: rotateY(-28deg) translateZ(-60px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fxFade { from { opacity: 0; } to { opacity: 1; } }
/* cards rise one after the other, tilted back in 3D */
body.fx-full #app[data-enter] .fxi { animation: fxRise .55s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 55ms + 60ms); }
@keyframes fxRise { from { transform: perspective(700px) rotateX(24deg) translate3d(0, 26px, 0); opacity: 0; } to { transform: none; opacity: 1; } }

/* 3D press: cards tilt under the finger */
body.fx-full .fxt { transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s; transform-style: preserve-3d; }
body.fx-full .fxt.pressed { transition-duration: .08s; box-shadow: 0 2px 4px rgba(22,32,44,.08), 0 14px 30px rgba(22,32,44,.14); }

/* chunky 3D buttons */
body:not(.fx-off) .btn.primary { box-shadow: 0 5px 0 color-mix(in srgb, var(--brass) 70%, #000), 0 10px 22px color-mix(in srgb, var(--brass) 32%, transparent); transition: transform .12s, box-shadow .12s; background-image: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0) 55%); }
body:not(.fx-off) .btn.primary:active:not([disabled]) { transform: translateY(4px); box-shadow: 0 1px 0 color-mix(in srgb, var(--brass) 70%, #000), 0 4px 10px color-mix(in srgb, var(--brass) 25%, transparent); }
body:not(.fx-off) .btn.ghost { box-shadow: 0 3px 0 var(--line); transition: transform .12s, box-shadow .12s; }
body:not(.fx-off) .btn.ghost:active:not([disabled]) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.btn, .ex, .choice, .tabbar button, .pick > button { position: relative; overflow: hidden; }
.fxr { position: absolute; border-radius: 50%; pointer-events: none; background: currentColor; opacity: .25; transform: scale(0); animation: fxRipple .55s ease-out forwards; }
.btn.primary .fxr { background: #fff; }
@keyframes fxRipple { to { transform: scale(1); opacity: 0; } }
body:not(.fx-off) .tabbar button[aria-current="page"] svg { animation: fxPop .45s cubic-bezier(.3,1.6,.5,1); }
body:not(.fx-off) .tabbar button[aria-current="page"]::after { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--brass); animation: fxBar .35s ease-out; }
@keyframes fxPop { 0% { transform: scale(.6) translateY(4px); } 60% { transform: scale(1.18) translateY(-2px); } 100% { transform: none; } }
@keyframes fxBar { from { transform: scaleX(0); } to { transform: none; } }

/* numbers count up / flip */
body.fx-full .counter { perspective: 400px; }
body.fx-full .counter .n.bump { animation: fxFlipN .38s cubic-bezier(.2,.8,.2,1); }
@keyframes fxFlipN { from { transform: rotateX(-80deg) scale(1.2); color: #7ee29b; } to { transform: none; } }
body.fx-full .stat b, body.fx-full .verdict { display: inline-block; animation: fxPopIn .6s cubic-bezier(.3,1.5,.5,1) both; animation-delay: .25s; }
@keyframes fxPopIn { from { transform: scale(.3) rotateX(70deg); opacity: 0; } to { transform: none; opacity: 1; } }

/* rep effects: sparks and a ring around the counter */
.fxs { position: absolute; z-index: 2; left: 50%; top: 40%; width: 13px; height: 13px; margin: -6px; border-radius: 50%; pointer-events: none; background: var(--c, #7ee29b); box-shadow: 0 0 10px var(--c, #7ee29b); animation: fxSpark .8s ease-out forwards; }
@keyframes fxSpark { 0% { transform: translate(0, 0) scale(.4); opacity: 1; } 15% { transform: translate(calc(var(--x) * .45), calc(var(--y) * .45)) scale(1.2); opacity: 1; } 65% { opacity: 1; } 100% { transform: translate(var(--x), var(--y)) scale(.3); opacity: 0; } }
.fxring { position: absolute; left: 50%; top: 40%; width: 160px; height: 160px; margin: -80px; border-radius: 50%; border: 6px solid #7ee29b; pointer-events: none; animation: fxRing .6s ease-out forwards; }
@keyframes fxRing { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
#fxConfetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

/* animated loading: splash at start and camera loading */
#splash { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(120% 80% at 50% 30%, #ffffff, #e6edf7 70%); transition: opacity .45s, transform .45s; }
#splash.out { opacity: 0; transform: scale(1.12); pointer-events: none; }
#splash .sp-fig { width: 240px; max-width: 60vw; height: 200px; max-height: 50vw; animation: fxFloat 2.4s ease-in-out infinite; }
#splash .sp-fig svg { width: 100%; height: 100%; display: block; }
#splash .sp-logo { font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: 1; text-transform: uppercase; text-align: center; color: #16202c; letter-spacing: .02em;
  text-shadow: 0 1px 0 #c9d2de, 0 2px 0 #b9c3d1, 0 3px 0 #aab5c5, 0 4px 0 #9aa6b6, 0 8px 14px rgba(22,32,44,.25); animation: fxLogo .8s cubic-bezier(.3,1.4,.5,1) both; }
#splash .sp-logo b { display: block; color: var(--brass); font-size: 46px; }
@keyframes fxLogo { from { transform: perspective(500px) rotateX(80deg) translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fxFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.ld3d { width: 64px; height: 64px; position: relative; transform-style: preserve-3d; perspective: 300px; }
.ld3d i { position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: 50%; border: 4px solid transparent; border-top-color: var(--brass); border-bottom-color: color-mix(in srgb, var(--brass) 45%, transparent); animation: fxOrbit 1.4s linear infinite; }
.ld3d i:nth-child(2) { top: 9px; right: 9px; bottom: 9px; left: 9px; border-top-color: #7ee29b; animation-duration: 1.1s; animation-direction: reverse; }
.ld3d i:nth-child(3) { top: 18px; right: 18px; bottom: 18px; left: 18px; border-top-color: var(--warn); animation-duration: .8s; }
@keyframes fxOrbit { from { transform: rotateX(62deg) rotateZ(0); } to { transform: rotateX(62deg) rotateZ(360deg); } }
.loading .ld-fig { width: min(220px, 55vw); aspect-ratio: 6 / 5; background: linear-gradient(180deg, #ffffff, #e6edf7); border-radius: 24px; box-shadow: 0 18px 40px rgba(0,0,0,.45), inset 0 -3px 0 rgba(22,32,44,.08); padding: 6px; }
.loading .ld-fig svg { width: 100%; height: 100%; display: block; }
.loading .ld-tip { font-family: var(--f-body); font-size: 14px; color: #c8d3e0; max-width: 300px; min-height: 2.8em; transition: opacity .3s; }
.skel { background: linear-gradient(90deg, var(--panel-2) 25%, #fff 50%, var(--panel-2) 75%); background-size: 200% 100%; animation: fxShim 1.2s linear infinite; border-radius: 12px; }
@keyframes fxShim { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* settings preview */
.fxopts { display: flex; flex-wrap: wrap; gap: 8px; }
.fxopts button { border: 2px solid var(--line); background: var(--panel); border-radius: 12px; padding: 8px 12px; min-height: 44px; font-family: var(--f-cond); font-weight: 700; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: var(--fg); }
.fxopts button[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); background: var(--soft); }
.fxopts button { position: relative; }

body.fx-off *, body.fx-off *::before, body.fx-off *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
body.fx-off .ld3d i { animation-duration: 1.4s !important; animation-iteration-count: infinite !important; }

/* ---------- Look professionale: copertina in home, pagina di benvenuto, tab bar flottante, tema scuro ---------- */
:root { --hero1: #0a1424; --hero2: #123a6e; --glowA: rgba(74,168,255,.55); --glowB: rgba(74,168,255,.18); }
body.g-f { --hero2: #5a1752; --glowA: rgba(255,106,213,.5); --glowB: rgba(255,106,213,.16); }
body.goldtheme { --hero2: #5a420c; --glowA: rgba(255,211,107,.5); --glowB: rgba(255,211,107,.16); }

.hero { position: relative; overflow: hidden; isolation: isolate; border-radius: 26px; padding: 20px 18px 18px; color: #fff;
  background: radial-gradient(90% 80% at 80% 30%, var(--glowA), transparent 62%), linear-gradient(155deg, var(--hero1) 15%, var(--hero2) 100%);
  box-shadow: 0 22px 44px -16px rgba(10,20,36,.65); display: grid; grid-template-columns: minmax(0, 1fr) 46%; gap: 8px 6px; }
.hero::after { content: ""; position: absolute; z-index: -1; left: -30%; top: -60%; width: 70%; height: 220%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.07), transparent); transform: rotate(18deg); }
.hero .hi { font-size: 15px; color: rgba(255,255,255,.75); }
.hero h1 { font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: 1; text-transform: uppercase; letter-spacing: .01em; margin-top: 2px; overflow-wrap: anywhere; }
.hero .chip { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 4px 10px 4px 6px; border-radius: 999px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); font-family: var(--f-cond); font-weight: 700; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.hero .chip .rk { background: rgba(255,255,255,.9); }
.hero .ringwrap { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.hero .ring { position: relative; width: 62px; height: 62px; flex: 0 0 auto; }
.hero .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.hero .ring .bgc { fill: none; stroke: rgba(255,255,255,.14); stroke-width: 6; }
.hero .ring .fgc { fill: none; stroke: url(#ringGrad); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 163.4; }
body:not(.fx-off) .hero .ring .fgc { animation: fxRingIn 1.3s cubic-bezier(.2,.8,.2,1) .35s both; }
@keyframes fxRingIn { from { stroke-dashoffset: 163.4; } }
.hero .ring b { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
.hero .ringwrap small { font-family: var(--f-cond); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.7); line-height: 1.2; }
.hero .ringwrap small b { display: block; color: #fff; font-size: 17px; letter-spacing: .02em; }
.hero-fig { position: relative; align-self: center; }
.hero-fig::before { content: ""; position: absolute; left: 8%; right: 8%; bottom: 2%; height: 30%; border-radius: 50%; background: radial-gradient(closest-side, var(--glowA), transparent); filter: blur(4px); }
.hero-fig .figbox { position: relative; width: 100%; aspect-ratio: 6 / 5; filter: drop-shadow(0 10px 14px rgba(0,0,0,.35)); transform: scale(1.35); transform-origin: 50% 85%; }
.hero-cta { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 12px; margin-top: 4px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.12); }
.hero .today small { display: block; font-family: var(--f-cond); font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.65); }
.hero .today b { display: block; font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1.05; text-transform: uppercase; }
.hero .today span { font-size: 14px; color: rgba(255,255,255,.75); }
.hero .btn.primary { background: #fff; color: var(--hero1); box-shadow: 0 5px 0 rgba(255,255,255,.35), 0 12px 28px var(--glowA); }
.hero .btn.primary .play { width: 26px; height: 26px; border-radius: 50%; background: var(--brass); display: grid; place-items: center; }
.hero .btn.primary .play svg { width: 11px; height: 11px; margin-left: 2px; fill: #fff; }
.hero .pt { position: absolute; z-index: -1; width: 5px; height: 5px; border-radius: 50%; background: #fff; opacity: 0; left: var(--x); bottom: -10px; box-shadow: 0 0 8px #fff; }
body.fx-full .hero .pt { animation: fxRiseUp var(--d) linear infinite; animation-delay: var(--w); }
@keyframes fxRiseUp { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .7; } 100% { transform: translateY(-340px); opacity: 0; } }

/* welcome page */
body.landing-on { background: var(--hero1); }
body.landing-on::before { display: none; }
.landing { color: #fff; min-height: 100vh; position: relative; isolation: isolate; padding-top: calc(env(safe-area-inset-top, 0px) + 22px); }
.landing::before { content: ""; position: fixed; z-index: -1; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(70% 45% at 25% 22%, rgba(74,168,255,.42), transparent 70%), radial-gradient(60% 40% at 80% 30%, rgba(255,106,213,.36), transparent 70%), linear-gradient(180deg, #0a1424, #0d1b33 60%, #0a1424); }
.landing .brand { font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; text-align: center; }
.landing .brand b { color: #6cb8ff; }
.land-figs { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin: 0 -8px; }
.land-figs .figbox { aspect-ratio: 6 / 5; filter: drop-shadow(0 14px 18px rgba(0,0,0,.45)); }
.land-h { font-family: var(--f-display); font-weight: 800; font-size: 40px; line-height: .98; text-transform: uppercase; text-align: center; letter-spacing: .005em;
  background: linear-gradient(100deg, #ffffff 30%, #a9d4ff 60%, #ffb3ea 90%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.land-p { text-align: center; color: rgba(255,255,255,.78); font-size: 16px; max-width: 460px; margin: 0 auto; }
.feats { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.feats li { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 12px 6px; border-radius: 16px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); font-family: var(--f-cond); font-weight: 700; font-size: 14px; line-height: 1.15; letter-spacing: .03em; text-transform: uppercase; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.feats li svg { width: 28px; height: 28px; color: #6cb8ff; }
.landing .label { color: rgba(255,255,255,.65); }
.landing .h2 { text-align: center; }
.landing .field input { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.2); color: #fff; }
.landing .field input::placeholder { color: rgba(255,255,255,.45); }
.landing .pick button { background: rgba(255,255,255,.08); border: 1.5px solid rgba(255,255,255,.16); box-shadow: 0 12px 30px rgba(0,0,0,.35); color: #fff; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.landing .pick button.m b { color: #6cb8ff; } .landing .pick button.f b { color: #ff8be0; }
.landing .pick button small { color: rgba(255,255,255,.7); }
.landing .pick button .go-pill { margin-top: 4px; padding: 6px 14px; border-radius: 999px; background: #fff; color: #0a1424; font-family: var(--f-cond); font-weight: 800; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; }
.land-note { text-align: center; font-size: 13px; color: rgba(255,255,255,.6); }

/* floating tab bar */
.tabbar { left: 10px; right: 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); max-width: 620px; margin: 0 auto; border-radius: 24px; border: 1px solid var(--line); padding: 6px; background: rgba(255,255,255,.9); box-shadow: 0 12px 32px rgba(22,32,44,.18); }
.tabbar button { border-radius: 18px; transition: background .25s, color .25s; }
.tabbar button[aria-current="page"] { background: var(--soft); }
body:not(.fx-off) .tabbar button[aria-current="page"]::after { display: none; }
body.tabs .screen { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 110px); }

/* finishing touches */

  ["Questo browser non pu\xF2 usare la fotocamera. Su iPhone apri il link con Safari, su Android con Chrome, e aggiorna il telefono se puoi.", "This browser can't use the camera. On iPhone open the link in Safari, on Android in Chrome, and update your phone if you can.", "Este navegador no puede usar la c\xE1mara. En iPhone abre el enlace con Safari, en Android con Chrome, y actualiza el tel\xE9fono si puedes.", "Ce navigateur ne peut pas utiliser la cam\xE9ra. Sur iPhone ouvre le lien avec Safari, sur Android avec Chrome, et mets ton t\xE9l\xE9phone \xE0 jour si possible.", "Dieser Browser kann die Kamera nicht nutzen. \xD6ffne den Link auf dem iPhone mit Safari, auf Android mit Chrome, und aktualisiere dein Handy, wenn m\xF6glich.", "Este navegador n\xE3o consegue usar a c\xE2mera. No iPhone abra o link no Safari, no Android no Chrome, e atualize o celular se puder."],
  ["Questo browser \xE8 troppo vecchio per l'analisi dei movimenti. Aggiorna Chrome o Safari.", "This browser is too old for movement analysis. Update Chrome or Safari.", "Este navegador es demasiado antiguo para analizar los movimientos. Actualiza Chrome o Safari.", "Ce navigateur est trop ancien pour l'analyse des mouvements. Mets \xE0 jour Chrome ou Safari.", "Dieser Browser ist zu alt f\xFCr die Bewegungsanalyse. Aktualisiere Chrome oder Safari.", "Este navegador \xE9 antigo demais para a an\xE1lise dos movimentos. Atualize o Chrome ou o Safari."],

  ["Telefono a terra, di lato, a circa 2\u20133 metri. Devi vedere testa e piedi.", "Phone on the floor, to your side, about 2\u20133 metres away. Your head and feet must be in view.", "Tel\xE9fono en el suelo, de lado, a unos 2\u20133 metros. Se te deben ver la cabeza y los pies.", "T\xE9l\xE9phone au sol, de c\xF4t\xE9, \xE0 environ 2\u20133 m\xE8tres. On doit voir ta t\xEAte et tes pieds.", "Handy auf dem Boden, seitlich, etwa 2\u20133 Meter entfernt. Kopf und F\xFC\xDFe m\xFCssen zu sehen sein.", "Celular no ch\xE3o, de lado, a uns 2\u20133 metros. Sua cabe\xE7a e seus p\xE9s precisam aparecer."],
  ["Telefono a terra, di lato, a circa 2 metri, all'altezza del pavimento.", "Phone on the floor, to your side, about 2 metres away, at floor level.", "Tel\xE9fono en el suelo, de lado, a unos 2 metros, a ras de suelo.", "T\xE9l\xE9phone au sol, de c\xF4t\xE9, \xE0 environ 2 m\xE8tres, au ras du sol.", "Handy auf dem Boden, seitlich, etwa 2 Meter entfernt, auf Bodenh\xF6he.", "Celular no ch\xE3o, de lado, a uns 2 metros, na altura do piso."],
  ["Telefono a terra, di lato, a circa 2 metri. Devi vedere spalle, bacino e ginocchia.", "Phone on the floor, to your side, about 2 metres away. Shoulders, hips and knees must be in view.", "Tel\xE9fono en el suelo, de lado, a unos 2 metros. Se te deben ver hombros, cadera y rodillas.", "T\xE9l\xE9phone au sol, de c\xF4t\xE9, \xE0 environ 2 m\xE8tres. On doit voir \xE9paules, bassin et genoux.", "Handy auf dem Boden, seitlich, etwa 2 Meter entfernt. Schultern, H\xFCfte und Knie m\xFCssen zu sehen sein.", "Celular no ch\xE3o, de lado, a uns 2 metros. Ombros, quadril e joelhos precisam aparecer."],
  ["Telefono in verticale, di fronte a te, a 2\u20133 metri. Devi vedere mani sopra la testa e piedi.", "Phone upright, facing you, 2\u20133 metres away. Your hands above your head and your feet must be in view.", "Tel\xE9fono en vertical, frente a ti, a 2\u20133 metros. Se te deben ver las manos sobre la cabeza y los pies.", "T\xE9l\xE9phone \xE0 la verticale, face \xE0 toi, \xE0 2\u20133 m\xE8tres. On doit voir tes mains au-dessus de la t\xEAte et tes pieds.", "Handy hochkant, vor dir, 2\u20133 Meter entfernt. H\xE4nde \xFCber dem Kopf und F\xFC\xDFe m\xFCssen zu sehen sein.", "Celular na vertical, de frente para voc\xEA, a 2\u20133 metros. M\xE3os acima da cabe\xE7a e p\xE9s precisam aparecer."],
  ["Telefono a terra, di lato, a circa 2 metri.", "Phone on the floor, to your side, about 2 metres away.", "Tel\xE9fono en el suelo, de lado, a unos 2 metros.", "T\xE9l\xE9phone au sol, de c\xF4t\xE9, \xE0 environ 2 m\xE8tres.", "Handy auf dem Boden, seitlich, etwa 2 Meter entfernt.", "Celular no ch\xE3o, de lado, a uns 2 metros."],
  ["Telefono in verticale, di lato, a circa 3 metri. Devi vederti in piedi e a terra.", "Phone upright, to your side, about 3 metres away. You must be in view standing and on the floor.", "Tel\xE9fono en vertical, de lado, a unos 3 metros. Te tiene que ver de pie y en el suelo.", "T\xE9l\xE9phone \xE0 la verticale, de c\xF4t\xE9, \xE0 environ 3 m\xE8tres. On doit te voir debout et au sol.", "Handy hochkant, seitlich, etwa 3 Meter entfernt. Du musst stehend und am Boden zu sehen sein.", "Celular na vertical, de lado, a uns 3 metros. Voc\xEA precisa aparecer de p\xE9 e no ch\xE3o."],
  ["Piedi alla larghezza delle spalle, punte leggermente in fuori.", "Feet shoulder-width apart, toes slightly out.", "Pies a la anchura de los hombros, puntas un poco hacia fuera.", "Pieds \xE9cart\xE9s \xE0 largeur d'\xE9paules, pointes l\xE9g\xE8rement vers l'ext\xE9rieur.", "F\xFC\xDFe schulterbreit, Fu\xDFspitzen leicht nach au\xDFen.", "P\xE9s na largura dos ombros, pontas levemente para fora."],
  ["Spingi il bacino indietro e scendi piegando le ginocchia, petto alto.", "Push your hips back and lower by bending your knees, chest up.", "Lleva la cadera atr\xE1s y baja doblando las rodillas, pecho arriba.", "Pousse le bassin en arri\xE8re et descends en pliant les genoux, poitrine haute.", "Schiebe die H\xFCfte nach hinten und beuge die Knie, Brust raus.", "Empurre o quadril para tr\xE1s e des\xE7a dobrando os joelhos, peito alto."],
  ["Scendi finch\xE9 le cosce sono parallele al suolo.", "Go down until your thighs are parallel to the floor.", "Baja hasta que los muslos queden paralelos al suelo.", "Descends jusqu'\xE0 ce que les cuisses soient parall\xE8les au sol.", "Geh runter, bis die Oberschenkel parallel zum Boden sind.", "Des\xE7a at\xE9 as coxas ficarem paralelas ao ch\xE3o."],
  ["Risali spingendo sui talloni fino a gambe distese.", "Drive up through your heels until your legs are straight.", "Sube empujando con los talones hasta estirar las piernas.", "Remonte en poussant sur les talons jusqu'\xE0 tendre les jambes.", "Dr\xFCck dich \xFCber die Fersen hoch, bis die Beine gestreckt sind.", "Suba empurrando com os calcanhares at\xE9 esticar as pernas."],
  ["Non scendi abbastanza (la ripetizione non conta)", "Not going low enough (the rep doesn't count)", "No bajas lo suficiente (la repetici\xF3n no cuenta)", "Tu ne descends pas assez (la r\xE9p\xE9tition ne compte pas)", "Nicht tief genug (die Wiederholung z\xE4hlt nicht)", "N\xE3o desce o suficiente (a repeti\xE7\xE3o n\xE3o conta)"],
  ["Busto troppo inclinato in avanti", "Torso leaning too far forward", "Tronco demasiado inclinado hacia delante", "Buste trop pench\xE9 en avant", "Oberk\xF6rper zu weit nach vorn geneigt", "Tronco inclinado demais para a frente"],
  ["Gambe non distese in cima", "Legs not straight at the top", "Piernas no estiradas arriba", "Jambes pas tendues en haut", "Beine oben nicht gestreckt", "Pernas n\xE3o esticadas no alto"],
  ["Mani sotto le spalle, corpo dritto dalla testa ai talloni.", "Hands under your shoulders, body straight from head to heels.", "Manos bajo los hombros, cuerpo recto de la cabeza a los talones.", "Mains sous les \xE9paules, corps droit de la t\xEAte aux talons.", "H\xE4nde unter den Schultern, K\xF6rper gerade von Kopf bis Ferse.", "M\xE3os abaixo dos ombros, corpo reto da cabe\xE7a aos calcanhares."],
  ["Contrai addome e glutei: il bacino non deve cedere.", "Brace your abs and glutes: your hips must not sag.", "Contrae abdomen y gl\xFAteos: la cadera no debe caer.", "Contracte abdos et fessiers : le bassin ne doit pas s'affaisser.", "Spann Bauch und Po an: Die H\xFCfte darf nicht durchh\xE4ngen.", "Contraia abd\xF4men e gl\xFAteos: o quadril n\xE3o pode cair."],
  ["Scendi finch\xE9 i gomiti sono piegati a 90\xB0 o meno.", "Go down until your elbows are bent to 90\xB0 or less.", "Baja hasta que los codos est\xE9n a 90\xB0 o menos.", "Descends jusqu'\xE0 ce que les coudes soient pli\xE9s \xE0 90\xB0 ou moins.", "Geh runter, bis die Ellbogen 90\xB0 oder weniger gebeugt sind.", "Des\xE7a at\xE9 os cotovelos ficarem a 90\xB0 ou menos."],
  ["Spingi fino a braccia distese.", "Push up until your arms are straight.", "Empuja hasta estirar los brazos.", "Pousse jusqu'\xE0 tendre les bras.", "Dr\xFCck dich hoch, bis die Arme gestreckt sind.", "Empurre at\xE9 esticar os bra\xE7os."],
  ["Bacino che cede verso il basso", "Hips sagging", "Cadera que cae", "Bassin qui s'affaisse", "H\xFCfte h\xE4ngt durch", "Quadril caindo"],
  ["Bacino troppo alto", "Hips too high", "Cadera demasiado alta", "Bassin trop haut", "H\xFCfte zu hoch", "Quadril alto demais"],
  ["Gomiti non piegati a 90\xB0 (non conta)", "Elbows not bent to 90\xB0 (doesn't count)", "Codos no doblados a 90\xB0 (no cuenta)", "Coudes pas pli\xE9s \xE0 90\xB0 (ne compte pas)", "Ellbogen nicht auf 90\xB0 gebeugt (z\xE4hlt nicht)", "Cotovelos n\xE3o dobrados a 90\xB0 (n\xE3o conta)"],
  ["Supino, ginocchia piegate a circa 90\xB0, piedi a terra.", "Lie on your back, knees bent to about 90\xB0, feet on the floor.", "Boca arriba, rodillas dobladas a unos 90\xB0, pies en el suelo.", "Sur le dos, genoux pli\xE9s \xE0 environ 90\xB0, pieds au sol.", "Auf dem R\xFCcken, Knie etwa 90\xB0 gebeugt, F\xFC\xDFe am Boden.", "Deitado de costas, joelhos dobrados a uns 90\xB0, p\xE9s no ch\xE3o."],
  ["Mani incrociate sul petto o dietro le orecchie.", "Hands crossed on your chest or behind your ears.", "Manos cruzadas sobre el pecho o detr\xE1s de las orejas.", "Mains crois\xE9es sur la poitrine ou derri\xE8re les oreilles.", "H\xE4nde vor der Brust gekreuzt oder hinter den Ohren.", "M\xE3os cruzadas no peito ou atr\xE1s das orelhas."],
  ["Sali con il busto fino a portare le spalle sopra il bacino.", "Sit up until your shoulders are over your hips.", "Sube el tronco hasta llevar los hombros sobre la cadera.", "Remonte le buste jusqu'\xE0 amener les \xE9paules au-dessus du bassin.", "Richte den Oberk\xF6rper auf, bis die Schultern \xFCber der H\xFCfte sind.", "Suba o tronco at\xE9 os ombros ficarem sobre o quadril."],
  ["Torna gi\xF9 finch\xE9 le scapole toccano terra.", "Lower back down until your shoulder blades touch the floor.", "Vuelve a bajar hasta que los om\xF3platos toquen el suelo.", "Redescends jusqu'\xE0 ce que les omoplates touchent le sol.", "Geh zur\xFCck, bis die Schulterbl\xE4tter den Boden ber\xFChren.", "Volte a descer at\xE9 as esc\xE1pulas tocarem o ch\xE3o."],
  ["Busto non abbastanza alto (non conta)", "Torso not high enough (doesn't count)", "Tronco no suficientemente alto (no cuenta)", "Buste pas assez haut (ne compte pas)", "Oberk\xF6rper nicht hoch genug (z\xE4hlt nicht)", "Tronco n\xE3o alto o suficiente (n\xE3o conta)"],
  ["Non torni gi\xF9 fino in fondo", "Not going all the way back down", "No bajas del todo", "Tu ne redescends pas jusqu'en bas", "Nicht ganz zur\xFCck nach unten", "N\xE3o volta at\xE9 o fim"],
  ["In piedi, piedi uniti, braccia lungo i fianchi.", "Stand with feet together, arms by your sides.", "De pie, pies juntos, brazos a los lados.", "Debout, pieds joints, bras le long du corps.", "Stehen, F\xFC\xDFe zusammen, Arme seitlich am K\xF6rper.", "De p\xE9, p\xE9s juntos, bra\xE7os ao lado do corpo."],
  ["Salta aprendo le gambe e portando le mani sopra la testa.", "Jump, spreading your legs and bringing your hands above your head.", "Salta abriendo las piernas y llevando las manos sobre la cabeza.", "Saute en \xE9cartant les jambes et en levant les mains au-dessus de la t\xEAte.", "Spring, spreize die Beine und f\xFChre die H\xE4nde \xFCber den Kopf.", "Salte abrindo as pernas e levando as m\xE3os acima da cabe\xE7a."],
  ["Salta di nuovo tornando a piedi uniti e braccia gi\xF9.", "Jump again back to feet together and arms down.", "Salta otra vez volviendo a pies juntos y brazos abajo.", "Saute \xE0 nouveau pour revenir pieds joints et bras en bas.", "Spring zur\xFCck: F\xFC\xDFe zusammen, Arme unten.", "Salte de novo voltando aos p\xE9s juntos e bra\xE7os para baixo."],
  ["Mantieni un ritmo costante.", "Keep a steady rhythm.", "Mant\xE9n un ritmo constante.", "Garde un rythme r\xE9gulier.", "Halte einen gleichm\xE4\xDFigen Rhythmus.", "Mantenha um ritmo constante."],
  ["Braccia non sopra la testa", "Arms not above your head", "Brazos no por encima de la cabeza", "Bras pas au-dessus de la t\xEAte", "Arme nicht \xFCber dem Kopf", "Bra\xE7os n\xE3o acima da cabe\xE7a"],
  ["Gambe non abbastanza aperte", "Legs not wide enough", "Piernas no suficientemente abiertas", "Jambes pas assez \xE9cart\xE9es", "Beine nicht weit genug gespreizt", "Pernas n\xE3o abertas o suficiente"],
  ["Avambracci a terra, gomiti sotto le spalle.", "Forearms on the floor, elbows under your shoulders.", "Antebrazos en el suelo, codos bajo los hombros.", "Avant-bras au sol, coudes sous les \xE9paules.", "Unterarme am Boden, Ellbogen unter den Schultern.", "Antebra\xE7os no ch\xE3o, cotovelos abaixo dos ombros."],
  ["Corpo dritto dalla testa ai talloni.", "Body straight from head to heels.", "Cuerpo recto de la cabeza a los talones.", "Corps droit de la t\xEAte aux talons.", "K\xF6rper gerade von Kopf bis Ferse.", "Corpo reto da cabe\xE7a aos calcanhares."],
  ["Contrai addome e glutei, respira regolarmente.", "Brace your abs and glutes, breathe steadily.", "Contrae abdomen y gl\xFAteos, respira con regularidad.", "Contracte abdos et fessiers, respire r\xE9guli\xE8rement.", "Spann Bauch und Po an, atme gleichm\xE4\xDFig.", "Contraia abd\xF4men e gl\xFAteos, respire normalmente."],
  ["Il tempo scorre solo quando la posizione \xE8 corretta.", "The clock only runs while your position is correct.", "El tiempo solo corre cuando la posici\xF3n es correcta.", "Le temps ne d\xE9file que si la position est correcte.", "Die Zeit l\xE4uft nur, solange die Haltung stimmt.", "O tempo s\xF3 corre quando a posi\xE7\xE3o est\xE1 correta."],
  ["Bacino che cede a terra", "Hips sagging on the floor", "Cadera que cae en el suelo", "Bassin qui s'affaisse au sol", "H\xFCfte h\xE4ngt am Boden durch", "Quadril caindo no ch\xE3o"],
  ["Bacino che cede", "Hips sagging", "Cadera que cae", "Bassin qui s'affaisse", "H\xFCfte h\xE4ngt durch", "Quadril caindo"],
  ["In piedi, busto dritto, mani sui fianchi.", "Stand tall, torso upright, hands on your hips.", "De pie, tronco recto, manos en la cintura.", "Debout, buste droit, mains sur les hanches.", "Aufrecht stehen, Oberk\xF6rper gerade, H\xE4nde an den H\xFCften.", "De p\xE9, tronco reto, m\xE3os na cintura."],
  ["Fai un passo lungo in avanti e scendi piegando entrambe le ginocchia.", "Take a long step forward and lower by bending both knees.", "Da un paso largo hacia delante y baja doblando ambas rodillas.", "Fais un grand pas en avant et descends en pliant les deux genoux.", "Mach einen gro\xDFen Schritt nach vorn und beuge beide Knie.", "D\xEA um passo longo \xE0 frente e des\xE7a dobrando os dois joelhos."],
  ["Il ginocchio dietro arriva vicino a terra, quello davanti resta sopra la caviglia.", "The back knee comes close to the floor, the front one stays over the ankle.", "La rodilla de atr\xE1s llega cerca del suelo, la de delante queda sobre el tobillo.", "Le genou arri\xE8re approche du sol, celui de devant reste au-dessus de la cheville.", "Das hintere Knie kommt nah an den Boden, das vordere bleibt \xFCber dem Kn\xF6chel.", "O joelho de tr\xE1s chega perto do ch\xE3o, o da frente fica sobre o tornozelo."],
  ["Spingi con la gamba davanti e torna su. Alterna le gambe.", "Push through the front leg and come back up. Alternate legs.", "Empuja con la pierna de delante y vuelve arriba. Alterna las piernas.", "Pousse sur la jambe avant et remonte. Alterne les jambes.", "Dr\xFCck dich mit dem vorderen Bein hoch. Beine abwechseln.", "Empurre com a perna da frente e volte. Alterne as pernas."],
  ["Non scendi abbastanza (non conta)", "Not going low enough (doesn't count)", "No bajas lo suficiente (no cuenta)", "Tu ne descends pas assez (ne compte pas)", "Nicht tief genug (z\xE4hlt nicht)", "N\xE3o desce o suficiente (n\xE3o conta)"],
  ["Busto inclinato in avanti", "Torso leaning forward", "Tronco inclinado hacia delante", "Buste pench\xE9 en avant", "Oberk\xF6rper nach vorn geneigt", "Tronco inclinado para a frente"],
  ["Posizione di piegamento a braccia tese, corpo dritto.", "Push-up position with straight arms, body straight.", "Posici\xF3n de flexi\xF3n con brazos estirados, cuerpo recto.", "Position de pompe bras tendus, corps droit.", "Liegest\xFCtzposition mit gestreckten Armen, K\xF6rper gerade.", "Posi\xE7\xE3o de flex\xE3o com bra\xE7os esticados, corpo reto."],
  ["Porta un ginocchio verso il petto, poi riportalo indietro.", "Drive one knee towards your chest, then take it back.", "Lleva una rodilla al pecho y luego devu\xE9lvela atr\xE1s.", "Am\xE8ne un genou vers la poitrine, puis ram\xE8ne-le en arri\xE8re.", "Zieh ein Knie zur Brust und dann wieder zur\xFCck.", "Leve um joelho ao peito e depois volte com ele."],
  ["Alterna le gambe con ritmo, come se corressi.", "Alternate legs with rhythm, as if you were running.", "Alterna las piernas con ritmo, como si corrieras.", "Alterne les jambes en rythme, comme si tu courais.", "Wechsle die Beine im Rhythmus, als w\xFCrdest du laufen.", "Alterne as pernas com ritmo, como se estivesse correndo."],
  ["Ogni ginocchio al petto vale una ripetizione.", "Each knee to the chest counts as one rep.", "Cada rodilla al pecho vale una repetici\xF3n.", "Chaque genou \xE0 la poitrine compte pour une r\xE9p\xE9tition.", "Jedes Knie zur Brust z\xE4hlt als eine Wiederholung.", "Cada joelho no peito vale uma repeti\xE7\xE3o."],
  ["Ginocchio non abbastanza vicino al petto", "Knee not close enough to the chest", "Rodilla no suficientemente cerca del pecho", "Genou pas assez pr\xE8s de la poitrine", "Knie nicht nah genug an der Brust", "Joelho n\xE3o perto o suficiente do peito"],
  ["In piedi, scendi in accosciata e appoggia le mani a terra.", "From standing, squat down and put your hands on the floor.", "De pie, baja en cuclillas y apoya las manos en el suelo.", "Debout, accroupis-toi et pose les mains au sol.", "Aus dem Stand in die Hocke gehen und die H\xE4nde auf den Boden setzen.", "De p\xE9, agache e apoie as m\xE3os no ch\xE3o."],
  ["Porta i piedi indietro in posizione di piegamento.", "Kick your feet back into a push-up position.", "Lleva los pies atr\xE1s en posici\xF3n de flexi\xF3n.", "Envoie les pieds en arri\xE8re en position de pompe.", "Spring mit den F\xFC\xDFen nach hinten in die Liegest\xFCtzposition.", "Leve os p\xE9s para tr\xE1s em posi\xE7\xE3o de flex\xE3o."],
  ["Riporta i piedi verso le mani e rialzati.", "Bring your feet back to your hands and stand up.", "Vuelve a llevar los pies hacia las manos y lev\xE1ntate.", "Ram\xE8ne les pieds vers les mains et rel\xE8ve-toi.", "Bring die F\xFC\xDFe zur\xFCck zu den H\xE4nden und steh auf.", "Traga os p\xE9s de volta \xE0s m\xE3os e levante-se."],

  ["Al primo avvio il telefono ti chiede il permesso di usare la fotocamera: tocca Consenti. In alternativa puoi registrare un video della serie e farlo analizzare.", "The first time, your phone asks for permission to use the camera: tap Allow. You can also record a video of your set and have it analysed.", "La primera vez el tel\xE9fono te pide permiso para usar la c\xE1mara: toca Permitir. Tambi\xE9n puedes grabar un v\xEDdeo de la serie y que lo analice.", "La premi\xE8re fois, le t\xE9l\xE9phone demande l'autorisation d'utiliser la cam\xE9ra : touche Autoriser. Tu peux aussi filmer ta s\xE9rie et la faire analyser.", "Beim ersten Mal fragt dein Handy, ob die Kamera genutzt werden darf: Tippe auf Zulassen. Du kannst deinen Satz auch filmen und analysieren lassen.", "Na primeira vez, o celular pede permiss\xE3o para usar a c\xE2mera: toque em Permitir. Voc\xEA tamb\xE9m pode gravar um v\xEDdeo da s\xE9rie e mandar analisar."],
  ["Al primo avvio il telefono ti chiede il permesso di usare la fotocamera: tocca Consenti. In alternativa puoi registrare un video della serie e farlo analizzare.", "If the live camera doesn't open, use \u201CRecord a video\u201D: film your set and the trainer analyses it and counts the reps.", "Si la c\xE1mara en directo no se abre, usa \xABGrabar un v\xEDdeo\xBB: graba la serie y el instructor la analiza y cuenta las repeticiones.", "Si la cam\xE9ra en direct ne s'ouvre pas, utilise \xAB Filmer une vid\xE9o \xBB : filme ta s\xE9rie et l'instructeur l'analyse en comptant les r\xE9p\xE9titions.", "Wenn sich die Live-Kamera nicht \xF6ffnet, nutze \u201EVideo aufnehmen\u201C: Filme deinen Satz, der Ausbilder analysiert ihn und z\xE4hlt mit.", "Se a c\xE2mera ao vivo n\xE3o abrir, use \u201CGravar um v\xEDdeo\u201D: filme a s\xE9rie e o instrutor analisa e conta as repeti\xE7\xF5es."],
  ["Carico il sistema di visione\u2026", "Loading the vision system\u2026", "Cargando el sistema de visi\xF3n\u2026", "Chargement du syst\xE8me de vision\u2026", "Bildanalyse wird geladen\u2026", "Carregando o sistema de vis\xE3o\u2026"],
  ["Il sistema di visione non si \xE8 caricato. Controlla la connessione e riprova.", "The vision system didn't load. Check your connection and try again.", "El sistema de visi\xF3n no se ha cargado. Revisa la conexi\xF3n e int\xE9ntalo de nuevo.", "Le syst\xE8me de vision n'a pas pu se charger. V\xE9rifie ta connexion et r\xE9essaie.", "Die Bildanalyse wurde nicht geladen. Pr\xFCfe die Verbindung und versuch es erneut.", "O sistema de vis\xE3o n\xE3o carregou. Verifique a conex\xE3o e tente de novo."],

  ["Non riesco ad aprire la fotocamera.", "I can't open the camera.", "No puedo abrir la c\xE1mara.", "Je n'arrive pas \xE0 ouvrir la cam\xE9ra.", "Ich kann die Kamera nicht \xF6ffnen.", "N\xE3o consigo abrir a c\xE2mera."],
  ["Controlla di aver dato il permesso nelle impostazioni del browser, oppure registra un video della serie.", "Check that you allowed it in the browser settings, or record a video of your set.", "Comprueba que diste permiso en los ajustes del navegador, o graba un v\xEDdeo de la serie.", "V\xE9rifie que tu as donn\xE9 l'autorisation dans les r\xE9glages du navigateur, ou filme ta s\xE9rie.", "Pr\xFCfe die Berechtigung in den Browser-Einstellungen oder nimm ein Video deines Satzes auf.", "Verifique se deu permiss\xE3o nas configura\xE7\xF5es do navegador, ou grave um v\xEDdeo da s\xE9rie."],

  ["Massimo in due minuti", "As many as you can in two minutes", "El m\xE1ximo en dos minutos", "Le maximum en deux minutes", "So viele wie m\xF6glich in zwei Minuten", "O m\xE1ximo em dois minutos"],
  ["Ancora tre!", "Three more!", "\xA1Tres m\xE1s!", "Encore trois !", "Noch drei!", "Mais tr\xEAs!"],
  ["Via!", "Go!", "\xA1Ya!", "Partez !", "Los!", "J\xE1!"],

  // --- sergente
  ["Forza soldato, fammi vedere cosa sai fare!", "Come on soldier, show me what you've got!", "\xA1Vamos soldado, ens\xE9\xF1ame de qu\xE9 eres capaz!", "Allez soldat, montre-moi ce que tu vaux !", "Los, Soldat, zeig mir, was du kannst!", "Vamos, soldado, mostre do que \xE9 capaz!"],
  ["Testa alta, petto in fuori. Si comincia!", "Head up, chest out. Here we go!", "Cabeza alta, pecho fuera. \xA1Empezamos!", "T\xEAte haute, poitrine en avant. C'est parti !", "Kopf hoch, Brust raus. Es geht los!", "Cabe\xE7a erguida, peito para fora. Vamos come\xE7ar!"],
  ["Nessuna scusa oggi. Via!", "No excuses today. Go!", "Hoy no hay excusas. \xA1Ya!", "Pas d'excuses aujourd'hui. Go !", "Keine Ausreden heute. Los!", "Sem desculpas hoje. J\xE1!"],
  ["Concentrato. Ogni ripetizione conta!", "Focus. Every rep counts!", "Concentrado. \xA1Cada repetici\xF3n cuenta!", "Concentr\xE9. Chaque r\xE9p\xE9tition compte !", "Konzentration. Jede Wiederholung z\xE4hlt!", "Concentrado. Cada repeti\xE7\xE3o conta!"],
  ["Cos\xEC si fa!", "That's how it's done!", "\xA1As\xED se hace!", "C'est comme \xE7a qu'on fait !", "So wird's gemacht!", "\xC9 assim que se faz!"],
  ["Bravo, continua!", "Good, keep going!", "\xA1Bien, sigue!", "Bien, continue !", "Gut, weiter!", "Boa, continue!"],
  ["Non fermarti adesso!", "Don't stop now!", "\xA1No te pares ahora!", "Ne t'arr\xEAte pas maintenant !", "H\xF6r jetzt nicht auf!", "N\xE3o pare agora!"],
  ["Questo \xE8 il ritmo giusto!", "That's the right pace!", "\xA1Ese es el ritmo!", "C'est le bon rythme !", "Genau das richtige Tempo!", "Esse \xE9 o ritmo certo!"],
  ["Sei pi\xF9 forte di quanto pensi!", "You're stronger than you think!", "\xA1Eres m\xE1s fuerte de lo que crees!", "Tu es plus fort que tu ne le crois !", "Du bist st\xE4rker, als du denkst!", "Voc\xEA \xE9 mais forte do que pensa!"],
  ["Il dolore passa, l'orgoglio resta!", "Pain fades, pride stays!", "\xA1El dolor pasa, el orgullo queda!", "La douleur passe, la fiert\xE9 reste !", "Der Schmerz vergeht, der Stolz bleibt!", "A dor passa, o orgulho fica!"],
  ["Spingi, soldato!", "Push, soldier!", "\xA1Empuja, soldado!", "Pousse, soldat !", "Dr\xFCck, Soldat!", "For\xE7a, soldado!"],
  ["Ottima forma, avanti!", "Great form, keep going!", "\xA1Muy buena t\xE9cnica, adelante!", "Excellente forme, continue !", "Saubere Technik, weiter!", "\xD3tima execu\xE7\xE3o, em frente!"],
  ["Met\xE0 fatta! Adesso viene il bello!", "Halfway there! Now the fun starts!", "\xA1Mitad hecha! \xA1Ahora viene lo bueno!", "La moiti\xE9 ! Maintenant le meilleur arrive !", "Halbzeit! Jetzt wird's spannend!", "Metade feita! Agora vem a parte boa!"],
  ["Sei a met\xE0 strada. Non mollare!", "You're halfway. Don't give up!", "Vas por la mitad. \xA1No te rindas!", "Tu es \xE0 mi-chemin. Ne l\xE2che rien !", "Du hast die H\xE4lfte. Nicht aufgeben!", "Voc\xEA est\xE1 na metade. N\xE3o desista!"],
  ["Ultime tre! Dai tutto!", "Last three! Give it everything!", "\xA1\xDAltimas tres! \xA1Dalo todo!", "Les trois derni\xE8res ! Donne tout !", "Die letzten drei! Gib alles!", "\xDAltimas tr\xEAs! D\xEA tudo!"],
  ["Tre alla fine! Stringi i denti!", "Three to go! Grit your teeth!", "\xA1Quedan tres! \xA1Aprieta los dientes!", "Plus que trois ! Serre les dents !", "Noch drei! Z\xE4hne zusammenbei\xDFen!", "Faltam tr\xEAs! Cerre os dentes!"],
  ["Ultima! Tutto quello che hai!", "Last one! Everything you've got!", "\xA1La \xFAltima! \xA1Todo lo que tienes!", "La derni\xE8re ! Tout ce que tu as !", "Die letzte! Alles, was du hast!", "A \xFAltima! Tudo o que voc\xEA tem!"],
  ["L'ultima \xE8 la pi\xF9 importante. Spingi!", "The last one matters most. Push!", "La \xFAltima es la m\xE1s importante. \xA1Empuja!", "La derni\xE8re est la plus importante. Pousse !", "Die letzte ist die wichtigste. Dr\xFCck!", "A \xFAltima \xE9 a mais importante. For\xE7a!"],
  ["Non mollare! Su!", "Don't quit! Come on!", "\xA1No te rindas! \xA1Vamos!", "Ne l\xE2che pas ! Allez !", "Nicht aufgeben! Los!", "N\xE3o desista! Vamos!"],
  ["Avanti, non ti ho detto di riposare!", "Move it, I didn't tell you to rest!", "\xA1Vamos, no te he dicho que descanses!", "Allez, je ne t'ai pas dit de te reposer !", "Weiter, ich habe nicht gesagt, dass du Pause machen sollst!", "Vamos, eu n\xE3o mandei descansar!"],
  ["Rialzati e continua!", "Get up and keep going!", "\xA1Lev\xE1ntate y sigue!", "Rel\xE8ve-toi et continue !", "Steh auf und mach weiter!", "Levante e continue!"],
  ["Respira e spingi! Ancora una!", "Breathe and push! One more!", "\xA1Respira y empuja! \xA1Una m\xE1s!", "Respire et pousse ! Encore une !", "Atme und dr\xFCck! Noch eine!", "Respire e empurre! Mais uma!"],
  ["Il traguardo \xE8 vicino, muoviti!", "The finish is close, move it!", "\xA1La meta est\xE1 cerca, mu\xE9vete!", "L'arriv\xE9e est proche, bouge-toi !", "Das Ziel ist nah, beweg dich!", "A chegada est\xE1 perto, mexa-se!"],
  ["Chi molla adesso? Non tu!", "Who quits now? Not you!", "\xBFQui\xE9n se rinde ahora? \xA1T\xFA no!", "Qui abandonne maintenant ? Pas toi !", "Wer gibt jetzt auf? Du nicht!", "Quem desiste agora? Voc\xEA n\xE3o!"],
  ["Tieni duro!", "Hang in there!", "\xA1Aguanta!", "Tiens bon !", "Halte durch!", "Aguente firme!"],
  ["Addome di ferro, non cedere!", "Iron core, don't give in!", "\xA1Abdomen de hierro, no cedas!", "Abdos d'acier, ne l\xE2che pas !", "Bauch aus Stahl, nicht nachgeben!", "Abd\xF4men de ferro, n\xE3o ceda!"],
  ["Il corpo vuole fermarsi, la testa no!", "Your body wants to stop, your mind doesn't!", "\xA1El cuerpo quiere parar, la cabeza no!", "Le corps veut s'arr\xEAter, la t\xEAte non !", "Der K\xF6rper will aufh\xF6ren, der Kopf nicht!", "O corpo quer parar, a cabe\xE7a n\xE3o!"],
  ["Respira. Resisti!", "Breathe. Hold on!", "Respira. \xA1Resiste!", "Respire. R\xE9siste !", "Atme. Halte durch!", "Respire. Resista!"],
  ["Ultimi secondi! Tieni duro!", "Last seconds! Hang in there!", "\xA1\xDAltimos segundos! \xA1Aguanta!", "Derni\xE8res secondes ! Tiens bon !", "Letzte Sekunden! Halte durch!", "\xDAltimos segundos! Aguente firme!"],
  ["Serie completata! Ottimo lavoro, soldato!", "Set complete! Great work, soldier!", "\xA1Serie completada! \xA1Buen trabajo, soldado!", "S\xE9rie termin\xE9e ! Excellent travail, soldat !", "Satz geschafft! Starke Arbeit, Soldat!", "S\xE9rie conclu\xEDda! \xD3timo trabalho, soldado!"],
  ["Questo \xE8 lo spirito! Serie chiusa!", "That's the spirit! Set done!", "\xA1Ese es el esp\xEDritu! \xA1Serie cerrada!", "Voil\xE0 l'esprit ! S\xE9rie boucl\xE9e !", "So ist's richtig! Satz erledigt!", "Esse \xE9 o esp\xEDrito! S\xE9rie fechada!"],
  ["Bravo! Un passo pi\xF9 vicino al prossimo grado!", "Well done! One step closer to the next rank!", "\xA1Bien! \xA1Un paso m\xE1s cerca del pr\xF3ximo grado!", "Bravo ! Un pas de plus vers le prochain grade !", "Gut gemacht! Ein Schritt n\xE4her am n\xE4chsten Rang!", "Muito bem! Um passo mais perto da pr\xF3xima patente!"],
  ["Respira. Recupera. Tra poco si riparte.", "Breathe. Recover. We go again soon.", "Respira. Recupera. Enseguida seguimos.", "Respire. R\xE9cup\xE8re. On repart bient\xF4t.", "Atme. Erhol dich. Gleich geht's weiter.", "Respire. Recupere. Logo recome\xE7amos."],
  ["Bevi un sorso d'acqua. Il prossimo giro \xE8 tuo.", "Have a sip of water. The next round is yours.", "Bebe un sorbo de agua. La pr\xF3xima ronda es tuya.", "Bois une gorg\xE9e d'eau. Le prochain tour est \xE0 toi.", "Trink einen Schluck Wasser. Die n\xE4chste Runde geh\xF6rt dir.", "Beba um gole de \xE1gua. A pr\xF3xima rodada \xE9 sua."],
  ["Trenta secondi! Accelera!", "Thirty seconds! Speed up!", "\xA1Treinta segundos! \xA1Acelera!", "Trente secondes ! Acc\xE9l\xE8re !", "Drei\xDFig Sekunden! Gib Gas!", "Trinta segundos! Acelere!"],
  ["Dieci secondi! Tutto quello che hai!", "Ten seconds! Everything you've got!", "\xA1Diez segundos! \xA1Todo lo que tienes!", "Dix secondes ! Tout ce que tu as !", "Zehn Sekunden! Alles, was du hast!", "Dez segundos! Tudo o que voc\xEA tem!"],
  ["Sei in testa! Non rallentare!", "You're in the lead! Don't slow down!", "\xA1Vas en cabeza! \xA1No aflojes!", "Tu es en t\xEAte ! Ne ralentis pas !", "Du f\xFChrst! Nicht langsamer werden!", "Voc\xEA est\xE1 na frente! N\xE3o diminua!"],
  ["Stai vincendo, chiudi la partita!", "You're winning, finish it off!", "\xA1Vas ganando, cierra el reto!", "Tu gagnes, termine le travail !", "Du gewinnst, bring es zu Ende!", "Voc\xEA est\xE1 vencendo, feche a partida!"],
  ["Ti sta superando! Reagisci!", "They're overtaking you! Fight back!", "\xA1Te est\xE1 adelantando! \xA1Reacciona!", "Il te d\xE9passe ! R\xE9agis !", "Du wirst \xFCberholt! Wehr dich!", "Est\xE3o passando voc\xEA! Reaja!"],
  ["Sei indietro! Adesso o mai pi\xF9!", "You're behind! Now or never!", "\xA1Vas por detr\xE1s! \xA1Ahora o nunca!", "Tu es derri\xE8re ! C'est maintenant ou jamais !", "Du liegst hinten! Jetzt oder nie!", "Voc\xEA est\xE1 atr\xE1s! Agora ou nunca!"],
  ["Agli ordini! Da adesso ti tengo sotto pressione.", "Yes sir! From now on I'll keep the pressure on.", "\xA1A la orden! A partir de ahora te aprieto.", "\xC0 vos ordres ! D\xE9sormais je te mets la pression.", "Zu Befehl! Ab jetzt mache ich dir Druck.", "\xC0s ordens! A partir de agora vou pegar no seu p\xE9."],
  ["Dieci! Non fermarti adesso, soldato!", "Ten! Don't stop now, soldier!", "\xA1Diez! \xA1No te pares ahora, soldado!", "Dix ! Ne t'arr\xEAte pas maintenant, soldat !", "Zehn! H\xF6r jetzt nicht auf, Soldat!", "Dez! N\xE3o pare agora, soldado!"],

  ["Sfida un amico: dopo la prima sfida compare qui con il suo grado e i suoi punti.", "Challenge a friend: after your first challenge they show up here with their rank and points.", "Reta a un amigo: tras el primer reto aparecer\xE1 aqu\xED con su grado y sus puntos.", "D\xE9fie un ami : apr\xE8s le premier d\xE9fi, il appara\xEEt ici avec son grade et ses points.", "Fordere einen Freund heraus: Nach dem ersten Duell erscheint er hier mit Rang und Punkten.", "Desafie um amigo: depois do primeiro desafio ele aparece aqui com patente e pontos."],
  ["Finch\xE9 la classifica mondiale non \xE8 attiva, il premio va ai primi 3 tra te e gli amici sfidati (servono almeno 4 partecipanti).", "Until the world leaderboard is live, the prize goes to the top 3 among you and the friends you've challenged (at least 4 players needed).", "Mientras la clasificaci\xF3n mundial no est\xE9 activa, el premio es para los 3 primeros entre t\xFA y tus amigos retados (hacen falta al menos 4).", "Tant que le classement mondial n'est pas actif, la r\xE9compense va au top 3 entre toi et tes amis d\xE9fi\xE9s (au moins 4 participants).", "Solange die Weltrangliste nicht aktiv ist, geht der Preis an die Top 3 unter dir und deinen Freunden (mindestens 4 Teilnehmer).", "Enquanto o ranking mundial n\xE3o estiver ativo, o pr\xEAmio vai para os 3 primeiros entre voc\xEA e os amigos desafiados (m\xEDnimo de 4 participantes)."],
  ["Nessuno in classifica questo mese: fai il primo allenamento e conquista il primo posto.", "Nobody on the leaderboard this month: do the first workout and take first place.", "Nadie en la clasificaci\xF3n este mes: haz el primer entrenamiento y ll\xE9vate el primer puesto.", "Personne au classement ce mois-ci : fais le premier entra\xEEnement et prends la premi\xE8re place.", "Diesen Monat steht noch niemand in der Rangliste: Trainiere als Erster und hol dir Platz eins.", "Ningu\xE9m no ranking este m\xEAs: fa\xE7a o primeiro treino e conquiste o primeiro lugar."],
  ["Non riesco a caricare la classifica. Controlla la connessione.", "I can't load the leaderboard. Check your connection.", "No puedo cargar la clasificaci\xF3n. Revisa la conexi\xF3n.", "Je n'arrive pas \xE0 charger le classement. V\xE9rifie ta connexion.", "Die Rangliste l\xE4sst sich nicht laden. Pr\xFCfe die Verbindung.", "N\xE3o consigo carregar o ranking. Verifique a conex\xE3o."],
