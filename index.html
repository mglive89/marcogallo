<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}</style>
<title>Istruttore Recluta</title>
<meta name="theme-color" content="#12150e">
<meta name="description" content="Allenamento a corpo libero in stile militare: la fotocamera conta le ripetizioni e corregge la postura.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recluta">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Saira+Condensed:wght@500;600;700;800&family=Saira:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen field manual. Home = program card + exercise list; Session = camera fills the screen with a big rep counter and an order banner. */
:root {
  --bg: #12150e;
  --panel: #1c2116;
  --panel-2: #262d1d;
  --line: #3a4230;
  --fg: #e8e5d3;
  --muted: #a3a38a;
  --brass: #d2b85c;
  --brass-ink: #1a1606;
  --ok: #7cbf62;
  --bad: #e2603f;
  --warn: #e8b23a;
  --f-display: "Black Ops One", "Impact", "Arial Black", sans-serif;
  --f-cond: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Saira", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

.screen { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 32px; display: flex; flex-direction: column; gap: 22px; }

/* Header */
.mast { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; border-bottom: 2px solid var(--line); padding-bottom: 12px; }
.mast h1 { font-family: var(--f-display); font-weight: 400; font-size: 30px; letter-spacing: .02em; line-height: 1; color: var(--brass); }
.mast .sub { font-family: var(--f-cond); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.callsign { font-family: var(--f-cond); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-align: right; }
.callsign b { display: block; font-size: 22px; color: var(--fg); letter-spacing: .02em; font-variant-numeric: tabular-nums; }

.label { font-family: var(--f-cond); font-weight: 600; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.section { display: flex; flex-direction: column; gap: 10px; }

/* Today's order card */
.order { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
.order::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 6px; background: repeating-linear-gradient(-45deg, var(--brass) 0 10px, var(--brass-ink) 10px 20px); }
.order h2 { font-family: var(--f-cond); font-weight: 800; font-size: 24px; letter-spacing: .01em; margin-top: 4px; }
.order .meta { color: var(--muted); font-size: 14px; }
.blocks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.blocks li { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-family: var(--f-cond); font-size: 17px; font-weight: 600; }
.blocks li:last-child { border-bottom: 0; }
.blocks li span:last-child { color: var(--brass); font-variant-numeric: tabular-nums; }

.weeks { display: flex; gap: 6px; flex-wrap: wrap; }
.wk { flex: 1 1 0; min-width: 64px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font-family: var(--f-cond); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.wk.now { border-color: var(--brass); color: var(--fg); }
.dots { display: flex; gap: 4px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted); }
.dots i.done { background: var(--ok); border-color: var(--ok); }

.btn { border: 0; border-radius: 4px; padding: 14px 18px; font-family: var(--f-cond); font-weight: 700; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; }
.btn.primary { background: var(--brass); color: var(--brass-ink); }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--fg); }
.btn.small { min-height: 40px; padding: 8px 12px; font-size: 15px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 160px; }

/* Exercise list */
.exlist { display: grid; gap: 8px; }
.ex { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 12px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.ex:hover { border-color: var(--muted); }
.ex canvas, .ex svg { width: 52px; height: 52px; }
.ex b { font-family: var(--f-cond); font-size: 19px; font-weight: 700; display: block; line-height: 1.15; }
.ex small { color: var(--muted); font-size: 13px; }
.ex .go { font-family: var(--f-cond); color: var(--brass); font-size: 22px; }

.note { font-size: 13px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; }

/* Briefing */
.brief h2 { font-family: var(--f-display); font-weight: 400; font-size: 32px; color: var(--brass); line-height: 1.05; }
.brief .goal { font-family: var(--f-cond); font-size: 18px; font-weight: 600; }
.steps { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.steps li::marker { font-family: var(--f-cond); font-weight: 700; color: var(--brass); }
.faults { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.faults li { display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: baseline; font-size: 14px; }
.faults li::before { content: ""; width: 10px; height: 10px; background: var(--bad); transform: rotate(45deg); }
.camtip { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; font-size: 14px; }
.camtip svg { width: 64px; height: 48px; }
.back { align-self: flex-start; background: none; border: 0; color: var(--muted); font-family: var(--f-cond); font-size: 15px; letter-spacing: .1em; text-transform: uppercase; padding: 6px 0; }

/* Session */
#session { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; z-index: 10; }
.stage { position: relative; flex: 1 1 auto; overflow: hidden; background: #000; }
.stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.stage.mirror video, .stage.mirror canvas { transform: scaleX(-1); }
.hud-top { position: absolute; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; background: linear-gradient(rgba(0,0,0,.75), rgba(0,0,0,0)); }
.hud-ex { font-family: var(--f-cond); font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--brass); }
.hud-ex b { display: block; font-size: 22px; letter-spacing: .02em; color: #f2efe0; }
.hud-timer { font-family: var(--f-cond); font-size: 22px; font-weight: 700; color: #f2efe0; font-variant-numeric: tabular-nums; }
.counter { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; align-items: flex-end; text-shadow: 0 2px 12px rgba(0,0,0,.8); }
.counter .n { font-family: var(--f-display); font-size: 112px; line-height: .9; color: #f2efe0; font-variant-numeric: tabular-nums; }
.counter .of { font-family: var(--f-cond); font-size: 18px; font-weight: 700; letter-spacing: .1em; color: var(--brass); text-transform: uppercase; }
.counter .n.bump { animation: bump .35s ease-out; }
@keyframes bump { 0% { transform: scale(1.25); color: var(--brass); } 100% { transform: scale(1); } }
.meter { position: absolute; left: 12px; bottom: 16px; width: 14px; height: 40%; border: 2px solid rgba(242,239,224,.6); border-radius: 3px; overflow: hidden; }
.meter i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--brass); height: 0%; transition: height .08s linear; }
.meter b { position: absolute; left: -2px; right: -2px; height: 2px; background: var(--ok); }
.banner { position: absolute; left: 12px; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 74px); padding: 10px 14px; border-radius: 4px; font-family: var(--f-cond); font-weight: 700; font-size: 22px; line-height: 1.15; text-align: center; background: rgba(18,21,14,.86); border: 2px solid var(--line); color: #f2efe0; }
.banner.ok { border-color: var(--ok); }
.banner.bad { border-color: var(--bad); background: rgba(80,22,10,.88); }
.banner.warn { border-color: var(--warn); }
.loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; color: #f2efe0; background: rgba(0,0,0,.7); font-family: var(--f-cond); font-size: 18px; }
.loading .bar { width: min(260px, 70vw); height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
.loading .bar i { display: block; height: 100%; width: 30%; background: var(--brass); animation: slide 1.1s ease-in-out infinite alternate; }
@keyframes slide { from { transform: translateX(-30%); } to { transform: translateX(260%); } }
.dock { flex: 0 0 auto; background: var(--bg); padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 10px); display: flex; gap: 8px; align-items: center; }
.dock .btn { flex: 1 1 auto; }
.dock .adj { flex: 0 0 52px; padding: 0; font-size: 24px; }

.rest { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(18,21,14,.94); padding: 24px; text-align: center; }
.rest .big { font-family: var(--f-display); font-size: 96px; color: var(--brass); font-variant-numeric: tabular-nums; line-height: 1; }
.rest .next { font-family: var(--f-cond); font-size: 20px; font-weight: 600; color: var(--fg); }

/* Summary */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--f-display); font-weight: 400; font-size: 34px; font-variant-numeric: tabular-nums; line-height: 1; }
.stat span { font-family: var(--f-cond); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.log li { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.log li span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); }

.toggle { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.toggle input { width: 20px; height: 20px; accent-color: var(--brass); }

/* Duel: friend's camera picture-in-picture + lobby */
.stage .opp { position: absolute; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 70px); width: 32%; max-width: 200px; aspect-ratio: 3 / 4; border: 2px solid var(--brass); border-radius: 4px; overflow: hidden; background: #000; }
.stage .opp video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.oppTag { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; padding: 4px 8px; background: rgba(0,0,0,.7); font-family: var(--f-cond); font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #f2efe0; }
.oppTag span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.oppTag b { font-family: var(--f-display); font-weight: 400; font-size: 30px; line-height: 1; color: var(--brass); font-variant-numeric: tabular-nums; }
.duel .banner { right: calc(min(32%, 200px) + 24px); font-size: 18px; }
.duel .counter .of { color: var(--ok); }
.code { font-family: var(--f-display); font-size: 44px; letter-spacing: .12em; color: var(--brass); line-height: 1; font-variant-numeric: tabular-nums; }
.lobvids { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.lobvid { position: relative; aspect-ratio: 3 / 4; background: #000; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.lobvid video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.lobvid span { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 8px; background: rgba(0,0,0,.65); font-family: var(--f-cond); font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: #f2efe0; }
.lobvid .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 12px; text-align: center; color: var(--muted); font-size: 13px; }
.status { display: flex; align-items: center; gap: 10px; font-family: var(--f-cond); font-size: 18px; font-weight: 600; }
.status i { width: 12px; height: 12px; border-radius: 50%; background: var(--warn); flex: 0 0 auto; }
.status.on i { background: var(--ok); }
.status.off i { background: var(--bad); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field input { font: inherit; font-size: 18px; padding: 12px; border-radius: 4px; border: 1.5px solid var(--line); background: var(--panel); color: var(--fg); min-width: 0; }
.field input:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.choice { background: var(--panel); border: 1.5px solid var(--line); border-radius: 6px; padding: 10px 12px; text-align: left; font-family: var(--f-cond); font-size: 17px; font-weight: 700; }
.choice small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 12px; color: var(--muted); }
.choice[aria-pressed="true"] { border-color: var(--brass); background: var(--panel-2); }
.verdict { font-family: var(--f-display); font-weight: 400; font-size: 40px; line-height: 1.05; color: var(--brass); }
.vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; text-align: center; }
.vs div { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 8px; display: flex; flex-direction: column; gap: 4px; }
.vs div.win { border-color: var(--brass); }
.vs b { font-family: var(--f-display); font-weight: 400; font-size: 48px; line-height: 1; font-variant-numeric: tabular-nums; }
.vs span { font-family: var(--f-cond); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vs em { font-family: var(--f-display); font-style: normal; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .counter .n.bump, .loading .bar i { animation: none; } }
</style>

</head>
<body>
<main id="app"></main>

<section id="session" hidden>
  <div class="stage mirror" id="stage">
    <video id="vid" playsinline muted></video>
    <canvas id="cv"></canvas>
    <div class="hud-top">
      <div class="hud-ex"><span id="hudSet">Serie</span><b id="hudName">Esercizio</b></div>
      <div class="hud-timer" id="hudTimer">00:00</div>
    </div>
    <div class="banner" id="banner">Mettiti in posizione</div>
    <div class="meter" id="meter"><i id="meterFill"></i><b id="meterMark"></b></div>
    <div class="opp" id="opp" hidden><video id="oppVid" playsinline autoplay></video><div class="oppTag"><span id="oppName">Amico</span><b id="oppCount">0</b></div></div>
    <div class="counter"><div class="n" id="count">0</div><div class="of" id="countOf">ripetizioni</div></div>
    <div class="loading" id="loading"><div id="loadingMsg">Carico il sistema di visione…</div><div class="bar"><i></i></div></div>
    <div class="rest" id="rest" hidden>
      <div class="label">Recupero</div>
      <div class="big" id="restN">60</div>
      <div class="next" id="restNext"></div>
      <button class="btn primary" id="restSkip" type="button">Salta recupero</button>
    </div>
  </div>
  <div class="dock">
    <button class="btn ghost adj" id="minus" type="button" aria-label="Togli una ripetizione">−</button>
    <button class="btn ghost adj" id="plus" type="button" aria-label="Aggiungi una ripetizione">+</button>
    <button class="btn ghost small" id="flip" type="button">Camera</button>
    <button class="btn primary small" id="stop" type="button">Fine serie</button>
  </div>
</section>

<input type="file" id="fileIn" accept="video/*" capture="user" hidden>

<script type="module">
/* ---------- Exercise library ---------- */
const EX = {
  squat: {
    name: "Squat", unit: "reps",
    tag: "Gambe e glutei",
    cam: "Telefono a terra, di lato, a circa 2–3 metri. Devi vedere testa e piedi.",
    steps: [
      "Piedi alla larghezza delle spalle, punte leggermente in fuori.",
      "Spingi il bacino indietro e scendi piegando le ginocchia, petto alto.",
      "Scendi finché le cosce sono parallele al suolo.",
      "Risali spingendo sui talloni fino a gambe distese."
    ],
    faults: ["Non scendi abbastanza (la ripetizione non conta)", "Busto troppo inclinato in avanti", "Gambe non distese in cima"]
  },
  pushup: {
    name: "Piegamenti", unit: "reps",
    tag: "Petto, spalle, tricipiti",
    cam: "Telefono a terra, di lato, a circa 2 metri, all'altezza del pavimento.",
    steps: [
      "Mani sotto le spalle, corpo dritto dalla testa ai talloni.",
      "Contrai addome e glutei: il bacino non deve cedere.",
      "Scendi finché i gomiti sono piegati a 90° o meno.",
      "Spingi fino a braccia distese."
    ],
    faults: ["Bacino che cede verso il basso", "Bacino troppo alto", "Gomiti non piegati a 90° (non conta)"]
  },
  situp: {
    name: "Addominali", unit: "reps",
    tag: "Sit-up da prova militare",
    cam: "Telefono a terra, di lato, a circa 2 metri. Devi vedere spalle, bacino e ginocchia.",
    steps: [
      "Supino, ginocchia piegate a circa 90°, piedi a terra.",
      "Mani incrociate sul petto o dietro le orecchie.",
      "Sali con il busto fino a portare le spalle sopra il bacino.",
      "Torna giù finché le scapole toccano terra."
    ],
    faults: ["Busto non abbastanza alto (non conta)", "Non torni giù fino in fondo"]
  },
  jacks: {
    name: "Jumping jack", unit: "reps",
    tag: "Riscaldamento e cardio",
    cam: "Telefono in verticale, di fronte a te, a 2–3 metri. Devi vedere mani sopra la testa e piedi.",
    steps: [
      "In piedi, piedi uniti, braccia lungo i fianchi.",
      "Salta aprendo le gambe e portando le mani sopra la testa.",
      "Salta di nuovo tornando a piedi uniti e braccia giù.",
      "Mantieni un ritmo costante."
    ],
    faults: ["Braccia non sopra la testa", "Gambe non abbastanza aperte"]
  },
  plank: {
    name: "Plank", unit: "secs",
    tag: "Tenuta del core",
    cam: "Telefono a terra, di lato, a circa 2 metri.",
    steps: [
      "Avambracci a terra, gomiti sotto le spalle.",
      "Corpo dritto dalla testa ai talloni.",
      "Contrai addome e glutei, respira regolarmente.",
      "Il tempo scorre solo quando la posizione è corretta."
    ],
    faults: ["Bacino che cede", "Bacino troppo alto"]
  }
};

/* ---------- 4-week program ---------- */
function session(week, day) {
  const w = week - 1;
  const r = n => n;
  const P = { pushup: 8 + 2 * w, squat: 15 + 3 * w, situp: 12 + 3 * w, jacks: 25 + 5 * w, plank: 30 + 10 * w };
  const sets = week >= 3 ? 4 : 3;
  const plans = [
    { title: "Forza di base", blocks: [["jacks", 1, P.jacks], ["pushup", sets, P.pushup], ["squat", sets, P.squat], ["plank", 2, P.plank]] },
    { title: "Core e resistenza", blocks: [["jacks", 1, P.jacks], ["situp", sets, P.situp], ["pushup", sets - 1, r(P.pushup)], ["plank", 3, P.plank]] },
    { title: "Circuito da campo", blocks: [["jacks", 2, P.jacks], ["squat", sets, P.squat + 5], ["situp", sets - 1, P.situp], ["pushup", sets, P.pushup + 2]] }
  ];
  return plans[day];
}
function blocksToQueue(blocks) {
  const q = [];
  for (const [ex, sets, target] of blocks) for (let s = 1; s <= sets; s++) q.push({ ex, target, set: s, sets });
  return q;
}

/* ---------- storage (per-viewer convenience) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("recluta:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("recluta:" + k, JSON.stringify(v)); } catch {} }
};

function nextSession() {

/* ---------- Voice ---------- */
let itVoice = null;
function pickVoice() {
  try { const vs = speechSynthesis.getVoices(); itVoice = vs.find(v => /^it/i.test(v.lang)) || null; } catch {}
}
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch {}
let lastSpoken = { text: "", t: 0 }, lastAny = 0;
function say(text, { urgent = false, minGap = 3200 } = {}) {
  if (!voiceOn) return;
  try {
    const now = performance.now();
    if (!urgent && (now - lastAny < minGap || (text === lastSpoken.text && now - lastSpoken.t < 7000))) return;
    if (urgent) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "it-IT"; if (itVoice) u.voice = itVoice; u.rate = 1.08; u.pitch = 0.9;
    speechSynthesis.speak(u);
    lastSpoken = { text, t: now }; lastAny = now;
  } catch {}
}

/* ---------- Geometry ---------- */
const L = { nose: 0, lSh: 11, rSh: 12, lEl: 13, rEl: 14, lWr: 15, rWr: 16, lHip: 23, rHip: 24, lKn: 25, rKn: 26, lAn: 27, rAn: 28 };
let aspect = 4 / 3;
const P = (lm, i) => ({ x: lm[i].x * aspect, y: lm[i].y, v: lm[i].visibility ?? 1 });
function ang(a, b, c) {
  const v1 = { x: a.x - b.x, y: a.y - b.y }, v2 = { x: c.x - b.x, y: c.y - b.y };
  const d = Math.hypot(v1.x, v1.y) * Math.hypot(v2.x, v2.y) || 1;
  return Math.acos(Math.max(-1, Math.min(1, (v1.x * v2.x + v1.y * v2.y) / d))) * 180 / Math.PI;
}
function side(lm, idsL, idsR) {
  const s = ids => ids.reduce((a, i) => a + (lm[i].visibility ?? 1), 0);
  return s(idsL) >= s(idsR) ? "l" : "r";
}
function pick(lm, sd) {
  const k = n => L[sd + n];
  return { sh: P(lm, k("Sh")), el: P(lm, k("El")), wr: P(lm, k("Wr")), hip: P(lm, k("Hip")), kn: P(lm, k("Kn")), an: P(lm, k("An")) };
}
const vis = (...pts) => pts.every(p => p.v > 0.45);
// how far the hip sits from the shoulder→ankle line; positive = below the line (sagging)
function hipOffset(sh, hip, an) {
  const t = Math.max(0, Math.min(1, (hip.x - sh.x) / ((an.x - sh.x) || 1e-6)));
  const lineY = sh.y + (an.y - sh.y) * t;
  return hip.y - lineY;
}

/* ---------- Rep trackers ---------- */
// Each tracker gets landmarks each frame and returns {metric 0..1, fault, cue, event}
function makeTracker(exId) {
  const st = { phase: "top", min: 999, max: -1, ema: null, faultsThisRep: new Set(), lastFaultT: 0, okSince: 0, holdMs: 0, lastT: 0 };
  const smooth = v => (st.ema = st.ema == null ? v : st.ema * 0.6 + v * 0.4);

  const angleRep = ({ value, top, bottom, partial, invert = false, countAt = "top", fault, onBottomFault }) => {
    // invert=false: value high at top (e.g. 170°), low at bottom (e.g. 90°)
    const v = smooth(value);
    const atBottom = invert ? v >= bottom : v <= bottom;
    const atTop = invert ? v <= top : v >= top;
    const past = invert ? v >= partial : v <= partial;
    let event = null;
    if (st.phase === "top") {
      if (past) { st.phase = "going"; st.faultsThisRep = new Set(); }
    } else if (st.phase === "going") {
      if (atBottom) { st.phase = "bottom"; if (countAt === "bottom") event = "rep"; }
      else if (atTop) { st.phase = "top"; event = "norep"; }
    } else if (st.phase === "bottom") {
      if (atTop) { st.phase = "top"; if (countAt === "top") event = "rep"; }
    }
    if (fault) st.faultsThisRep.add(fault);
    const span = Math.abs(top - bottom);
    const metric = Math.max(0, Math.min(1, (invert ? v - top : top - v) / span));
    return { metric, event, v };
  };

  const T = {
    squat(lm) {
      const p = pick(lm, side(lm, [23, 25, 27], [24, 26, 28]));
      if (!vis(p.sh, p.hip, p.kn, p.an)) return { lost: "Inquadra tutto il corpo, di lato" };
      const knee = ang(p.hip, p.kn, p.an);
      const torso = Math.atan2(Math.abs(p.sh.x - p.hip.x), Math.abs(p.hip.y - p.sh.y)) * 180 / Math.PI;
      let fault = null, cue = null;
      if (st.phase !== "top" && torso > 52) { fault = "torso"; cue = "Petto in alto, schiena dritta"; }
      const r = angleRep({ value: knee, top: 160, bottom: 100, partial: 140, fault });
      return { ...r, fault, cue, noRepCue: "Più giù! Cosce parallele al suolo. Non conta" };
    },
    pushup(lm) {
      const p = pick(lm, side(lm, [11, 13, 15, 23], [12, 14, 16, 24]));
      const foot = vis(p.an) ? p.an : p.kn;
      if (!vis(p.sh, p.el, p.wr, p.hip, foot)) return { lost: "Inquadrati di lato, dalla testa ai piedi" };
      const horiz = Math.abs(foot.x - p.sh.x) > Math.abs(foot.y - p.sh.y);
      if (!horiz) return { lost: "Mettiti in posizione di piegamento" };
      const elbow = ang(p.sh, p.el, p.wr);
      const line = ang(p.sh, p.hip, foot);
      let fault = null, cue = null;
      if (line < 158) {
        const off = hipOffset(p.sh, p.hip, foot);
        if (off > 0) { fault = "sag"; cue = "Bacino su! Stringi addome e glutei"; }
        else { fault = "pike"; cue = "Abbassa il bacino, corpo dritto"; }
      }
      const r = angleRep({ value: elbow, top: 150, bottom: 95, partial: 130, fault });
      return { ...r, fault, cue, noRepCue: "Scendi di più! Gomiti a novanta gradi. Non conta" };
    },
    situp(lm) {
      const p = pick(lm, side(lm, [11, 23, 25], [12, 24, 26]));
      if (!vis(p.sh, p.hip, p.kn)) return { lost: "Inquadrati di lato: spalle, bacino e ginocchia" };
      const hip = ang(p.sh, p.hip, p.kn);
      // lying ≈ 120°+, up ≈ < 70°
      const r = angleRep({ value: hip, top: 115, bottom: 70, partial: 95, countAt: "bottom" });
      return { ...r, fault: null, cue: null, noRepCue: "Sali di più! Spalle sopra il bacino. Non conta" };
    },
    jacks(lm) {
      const g = i => P(lm, i);
      const lSh = g(11), rSh = g(12), lWr = g(15), rWr = g(16), lAn = g(27), rAn = g(28), nose = g(0);
      if (!vis(lSh, rSh, lWr, rWr, lAn, rAn)) return { lost: "Inquadrati di fronte, dalle mani ai piedi" };
      const shW = Math.abs(lSh.x - rSh.x) || 0.1;
      const feet = Math.abs(lAn.x - rAn.x) / shW;
      const shY = (lSh.y + rSh.y) / 2;
      const armsUp = lWr.y < nose.y && rWr.y < nose.y;
      const armsDown = lWr.y > shY && rWr.y > shY;
      const armT = Math.max(0, Math.min(1, (shY + 0.15 - (lWr.y + rWr.y) / 2) / 0.35));
      let event = null, cue = null, fault = null;
      if (st.phase === "top") { // closed
        if (feet > 1.35 || armT > 0.6) { st.phase = "going"; st.flags = { arms: false, feet: false }; }
      }
      if (st.phase === "going") {
        if (armsUp) st.flags.arms = true;
        if (feet > 1.5) st.flags.feet = true;
        if (armsDown && feet < 1.15) {
          st.phase = "top";
          if (st.flags.arms && st.flags.feet) event = "rep";
          else { event = "norep"; }
          st.noRepCue = !st.flags.arms ? "Braccia sopra la testa! Non conta" : "Apri di più le gambe! Non conta";
        }
      }
      return { metric: (armT + Math.min(1, Math.max(0, (feet - 1) / 0.8))) / 2, event, cue, fault, noRepCue: st.noRepCue };
    },
    plank(lm, t) {
      const p = pick(lm, side(lm, [11, 13, 23, 27], [12, 14, 24, 28]));
      const foot = vis(p.an) ? p.an : p.kn;
      const dt = st.lastT ? Math.min(250, t - st.lastT) : 0; st.lastT = t;
      if (!vis(p.sh, p.hip, foot)) return { lost: "Inquadrati di lato, dalla testa ai piedi", metric: 0 };
      const horiz = Math.abs(foot.x - p.sh.x) > Math.abs(foot.y - p.sh.y) * 1.3;
      if (!horiz) return { lost: "Mettiti in posizione di plank", metric: 0 };
      const line = ang(p.sh, p.hip, foot);
      let fault = null, cue = null;
      if (line < 162) {
        const off = hipOffset(p.sh, p.hip, foot);
        if (off > 0) { fault = "sag"; cue = "Bacino su! Non cedere"; }
        else { fault = "pike"; cue = "Abbassa il bacino, corpo dritto"; }
      } else st.holdMs += dt;
      return { metric: Math.max(0, Math.min(1, (line - 140) / 40)), fault, cue, hold: st.holdMs };
    }
  };
  return { st, step: T[exId] };
}

/* ---------- Pose engine ---------- */
const SITE = true;
let landmarker = null, enginePromise = null;
async function loadEngine() {
  if (landmarker) return landmarker;
  if (!enginePromise) enginePromise = (async () => {
    const mp = await import(SITE ? "./vision_bundle.mjs" : "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");
    const base = new URL(".", location.href).href;
    let simd = true;
    try { simd = await mp.FilesetResolver.isSimdSupported(); } catch {}
    const wasmName = simd ? "vision_wasm_internal" : "vision_wasm_nosimd_internal";
    const fileset = { wasmLoaderPath: base + "wasm/" + wasmName + ".js", wasmBinaryPath: base + "wasm/" + wasmName + ".wasm" };
    let model;
    if (SITE) model = new Uint8Array(await (await fetch(base + "pose_landmarker_lite.task")).arrayBuffer());
    else {
      // the model ships as base64 text because artifacts only serve web file types
      const b64 = await (await fetch(base + "pose_model.b64.txt")).text();
      const bin = atob(b64.trim()); model = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) model[i] = bin.charCodeAt(i);
    }
    const opts = d => ({ baseOptions: { modelAssetBuffer: model, delegate: d }, runningMode: "VIDEO", numPoses: 1, minPoseDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    try { landmarker = await mp.PoseLandmarker.createFromOptions(fileset, opts("GPU")); }
    catch (e) { landmarker = await mp.PoseLandmarker.createFromOptions(fileset, opts("CPU")); }
    window.__mp = mp;
    return landmarker;
  })();
  try { return await enginePromise; } catch (e) { enginePromise = null; throw e; }
}

  $("loadingMsg").textContent = "Carico il sistema di visione…";
  $("flip").hidden = mode !== "live";
  $("stage").classList.toggle("mirror", mode === "live");
  try { S.wake = await navigator.wakeLock?.request("screen"); } catch {}
  try {
    await loadEngine();
  } catch (e) {
    $("loadingMsg").textContent = "Il sistema di visione non si è caricato. Controlla la connessione e riprova.";
    return;
  }
  try {
    if (mode === "live") await openCamera();
    else await openFile(file);
  } catch (e) {
    if (mode === "live") {
      $("loadingMsg").innerHTML = "Non riesco ad aprire la fotocamera.<br><br>Controlla di aver dato il permesso nelle impostazioni del browser, oppure registra un video della serie.";
      const b = document.createElement("button"); b.className = "btn primary"; b.textContent = "Registra un video"; b.type = "button";
      b.onclick = () => { closeSession(false); $("fileIn").value = ""; $("fileIn").click(); };
      $("loadingMsg").append(document.createElement("br"), b);
    } else $("loadingMsg").textContent = "Non riesco a leggere questo video. Prova a registrarlo di nuovo.";
    return;
  }
  $("loading").hidden = true;
  beginSet();
  S.running = true;
  loop();
}

async function openCamera() {
  if (S.stream) S.stream.getTracks().forEach(t => t.stop());
  S.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: S.facing, width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
  vid.srcObject = S.stream; vid.removeAttribute("src");
  await vid.play();
  $("stage").classList.toggle("mirror", S.facing === "user");
}
async function openFile(file) {
  vid.srcObject = null;
  vid.src = URL.createObjectURL(file);
  vid.loop = false;
  await new Promise((res, rej) => { vid.onloadeddata = res; vid.onerror = rej; });
  vid.onended = () => { if (S.running) endSet(true); };
  await vid.play();
}

function beginSet() {
  const q = S.queue[S.idx];
  S.cur = { ...q, tracker: makeTracker(q.ex), count: 0, noreps: 0, hold: 0, t0: performance.now(), lastFault: null };
  $("hudName").textContent = EX[q.ex].name;
  $("hudSet").textContent = S.test ? "Prova · 2:00" : q.sets > 1 || S.queue.length > 1 ? `Serie ${q.set} di ${q.sets}` : "Serie libera";
  $("count").textContent = EX[q.ex].unit === "secs" ? "0" : "0";
  $("countOf").textContent = EX[q.ex].unit === "secs" ? (q.target ? `di ${q.target} s` : "secondi") : (q.target ? `di ${q.target}` : "ripetizioni");
  $("minus").hidden = $("plus").hidden = EX[q.ex].unit === "secs";
  $("stop").textContent = S.idx < S.queue.length - 1 ? "Fine serie" : "Termina";
  setBanner("In posizione!", "warn");
  say(`${EX[q.ex].name}. ${q.target ? (EX[q.ex].unit === "secs" ? `Tieni per ${q.target} secondi` : `${q.target} ripetizioni`) : q.timeLimit ? `Massimo in ${q.timeLimit} secondi` : "Massimo in due minuti"}. Via!`, { urgent: true });
  S.inRest = false;
}

function setBanner(text, kind) {
  const b = $("banner");
  if (b.textContent !== text) b.textContent = text;
  b.className = "banner " + (kind || "");
}

function bump() { const n = $("count"); n.classList.remove("bump"); void n.offsetWidth; n.classList.add("bump"); }

function loop() {
  if (!S.running) return;
  const next = () => S.running && (vid.requestVideoFrameCallback ? vid.requestVideoFrameCallback(loop) : requestAnimationFrame(loop));
  if (vid.readyState >= 2 && !S.inRest) {
    let ts = S.mode === "file" ? vid.currentTime * 1000 : performance.now();
    if (ts <= S.lastTs) ts = S.lastTs + 1;
    S.lastTs = ts;
    try {
      const res = landmarker.detectForVideo(vid, ts);
      process(res, ts);
    } catch (e) { /* skip frame */ }
  }
  tickTimer();
  next();
}

function tickTimer() {
  if (!S.cur || S.inRest) return;
  const el = (performance.now() - S.cur.t0) / 1000;
  const secs = S.mode === "file" ? vid.currentTime : el;
  if (S.cur.timeLimit) {
    const left = Math.max(0, S.cur.timeLimit - secs);
    $("hudTimer").textContent = fmt(left);
    if (left <= 0) endSet(true);
  } else $("hudTimer").textContent = fmt(secs);
}

function process(res, ts) {
  const w = vid.videoWidth, h = vid.videoHeight;
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  aspect = w / h || aspect;
  ctx.clearRect(0, 0, w, h);
  const lm = res?.landmarks?.[0];
  if (!lm) { setBanner("Non ti vedo: entra nell'inquadratura", "warn"); $("meterFill").style.height = "0%"; return; }
  const c = S.cur;
  const out = c.tracker.step(lm, ts) || {};
  drawSkeleton(lm, out.fault ? "bad" : out.lost ? "warn" : "ok");
  if (out.lost) { setBanner(out.lost, "warn"); return; }
  $("meterFill").style.height = Math.round((out.metric || 0) * 100) + "%";

  if (out.fault && out.cue) {
    setBanner(out.cue, "bad");
    say(out.cue);
    if (out.fault !== c.lastFault || ts - (c.lastFaultT || 0) > 4000) { S.faults[out.cue] = (S.faults[out.cue] || 0) + 1; c.lastFaultT = ts; }
    c.lastFault = out.fault;
  } else if (!out.event) {
    if (EX[c.ex].unit === "secs") setBanner(c.hold > 0 ? "Tieni! Posizione corretta" : "In posizione di plank", "ok");
    else setBanner("Posizione corretta", "ok");
    c.lastFault = null;
  }

  if (EX[c.ex].unit === "secs") {
    c.hold = (out.hold || 0) / 1000;
    $("count").textContent = Math.floor(c.hold);
    const s = Math.floor(c.hold);
    if (s > 0 && s % 10 === 0 && s !== c.lastAnnounce) { c.lastAnnounce = s; say(`${s} secondi`, { urgent: true }); }
    if (c.target && c.hold >= c.target) endSet(true);
    return;
  }
  if (out.event === "rep") {
    c.count++; $("count").textContent = c.count; bump();
    setBanner(c.count + "!", "ok");
    const left = c.target ? c.target - c.count : null;
    say(left === 3 && c.target >= 8 ? `${c.count}. Ancora tre!` : String(c.count), { urgent: true });
    if (S.challenge) duelSend({ t: "reps", n: c.count });
    if (c.target && c.count >= c.target) endSet(true);
  } else if (out.event === "norep") {
    c.noreps++;
    setBanner(out.noRepCue || "Ripetizione incompleta", "bad");
    S.faults[out.noRepCue] = (S.faults[out.noRepCue] || 0) + 1;
    say(out.noRepCue || "Non conta", { urgent: true });
  }
}

const BONES = [[11, 12], [11, 13], [13, 15], [12, 14], [14, 16], [11, 23], [12, 24], [23, 24], [23, 25], [25, 27], [24, 26], [26, 28], [27, 31], [28, 32]];
function drawSkeleton(lm, kind) {
  const w = cv.width, h = cv.height;
  const col = kind === "bad" ? "#e2603f" : kind === "warn" ? "#e8b23a" : "#7cbf62";
  ctx.lineWidth = Math.max(3, w / 160); ctx.lineCap = "round"; ctx.strokeStyle = col;
  for (const [a, b] of BONES) {
    if ((lm[a].visibility ?? 1) < 0.4 || (lm[b].visibility ?? 1) < 0.4) continue;
    ctx.beginPath(); ctx.moveTo(lm[a].x * w, lm[a].y * h); ctx.lineTo(lm[b].x * w, lm[b].y * h); ctx.stroke();
  }
  ctx.fillStyle = "#f2efe0";
  for (const i of [0, 11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28]) {
    if ((lm[i].visibility ?? 1) < 0.4) continue;
    ctx.beginPath(); ctx.arc(lm[i].x * w, lm[i].y * h, Math.max(4, w / 110), 0, Math.PI * 2); ctx.fill();
  }
}

function endSet() {
  const c = S.cur; if (!c || S.inRest) return;
  if (S.challenge) return duelEnd();
  const unit = EX[c.ex].unit;
  S.log.push({ ex: c.ex, set: c.set, target: c.target, unit, done: unit === "secs" ? c.hold : c.count, noreps: c.noreps });
  const last = S.idx >= S.queue.length - 1;
  if (S.mode === "file") {
    // a recorded video covers one set; further sets come from new recordings
    if (last) return finish(true);
    S.idx++;
    return finish(false);
  }
  if (last) return finish(true);
  S.idx++;
  say("Serie completata. Recupero.", { urgent: true });
  startRest(60);
}

function startRest(secs) {
  S.inRest = true;
  ctx.clearRect(0, 0, cv.width, cv.height);
  const nq = S.queue[S.idx];
  $("rest").hidden = false;
  $("restNext").textContent = `Prossima: ${EX[nq.ex].name} · ${targetTxt(nq.ex, nq.target)}`;
  let left = secs;
  $("restN").textContent = left;
  clearInterval(S.restTimer);
  const end = () => { clearInterval(S.restTimer); $("rest").hidden = true; beginSet(); };
  S.restTimer = setInterval(() => {
    left--; $("restN").textContent = left;
    if (left === 10) say("Dieci secondi. Preparati.", { urgent: true });
    if (left <= 0) end();
  }, 1000);
  $("restSkip").onclick = end;
}

function finish(all) {
  const secs = (performance.now() - S.startT) / 1000;
  let newRecord = null;
  if (S.test && S.log[0]) {
    const n = S.log[0].done;
    if (!records[S.test] || n > records[S.test]) { records[S.test] = n; store.set("records", records); newRecord = `${n} ${EX[S.test].name.toLowerCase()}`; }
  }
  const remaining = S.queue.slice(S.idx);
  if (S.day && all) { progress[S.day.wk + "-" + S.day.d] = true; store.set("progress", progress); }
  closeSession(true);
  say(all ? "Sessione terminata. Ottimo lavoro, recluta." : "Serie registrata.", { urgent: true });
  if (!all && S.mode === "file" && remaining.length) {
    // offer the next recorded set
    route = { name: "brief", queue: remaining, title: S.title, day: S.day, free: S.free, test: S.test, carry: (route.carry || []).concat(S.log) };
    render();
    const note = $("camNote");
    note.textContent = `Serie salvate: ${route.carry.map(l => `${EX[l.ex].name} ${l.unit === "secs" ? Math.round(l.done) + " s" : l.done + " rip."}`).join(", ")}. Registra la prossima.`;
    return;
  }
  const log = (route.carry || []).concat(S.log);
  go({ name: "summary", result: { title: S.title, secs, log, faults: S.faults, newRecord } });
}

function closeSession() {
  S.running = false;
  clearInterval(S.restTimer);
  if (!S.challenge) try { S.stream?.getTracks().forEach(t => t.stop()); } catch {}
  S.stream = null;
  try { vid.pause(); } catch {}
  if (vid.src && vid.src.startsWith("blob:")) URL.revokeObjectURL(vid.src);
  vid.removeAttribute("src"); vid.srcObject = null;
  try { S.wake?.release(); } catch {}
  $("session").hidden = true;
}

$("stop").onclick = () => {
  if (!S.cur) return closeSession();
  if (S.inRest) { clearInterval(S.restTimer); $("rest").hidden = true; return finish(false); }
  endSet(true);
};
$("plus").onclick = () => { if (S.cur) { S.cur.count++; $("count").textContent = S.cur.count; if (S.challenge) { duelSend({ t: "reps", n: S.cur.count }); if (S.cur.target && S.cur.count >= S.cur.target) endSet(); } } };
$("minus").onclick = () => { if (S.cur && S.cur.count > 0) { S.cur.count--; $("count").textContent = S.cur.count; if (S.challenge) duelSend({ t: "reps", n: S.cur.count }); } };
$("flip").onclick = async () => { S.facing = S.facing === "user" ? "environment" : "user"; try { await openCamera(); } catch {} };

/* ---------- Sfida un amico (WebRTC via PeerJS) ---------- */
const DUEL_EX = ["pushup", "squat", "situp", "jacks"];
const DUEL_FMT = {
  time: { label: "Più ripetizioni in 60 s", short: "60 secondi", n: 60 },
  first: { label: "Primo a 20", short: "primo a 20", n: 20 }
};
const CH = { peer: null, conn: null, call: null, stream: null, remote: null, role: null, code: "", oppName: "", oppReps: 0, cfg: { ex: "pushup", fmt: "time" }, connected: false, myFinal: null, oppFinal: null, wins: { me: 0, opp: 0 } };
let myName = store.get("name", "");

function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.append(s); });
}
async function loadPeer() {
  if (!window.Peer) await loadScript("peerjs.min.js");
  return window.Peer;
}
function peerOpts() {
  // a test can point to a local signalling server with ?peerhost=host:port
  const o = { debug: 0 };
  try {
    const h = new URLSearchParams(location.search).get("peerhost");
    if (h) { const [host, port] = h.split(":"); Object.assign(o, { host, port: +port, path: "/", secure: false }); }
  } catch {}
  return o;
}
const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const newCode = () => Array.from({ length: 6 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join("");
const peerId = code => "istruttore-recluta-" + code;
const duelLink = () => location.origin + location.pathname + "?sfida=" + CH.code;
const fmtTxt = cfg => `${EX[cfg.ex].name} · ${DUEL_FMT[cfg.fmt].short}`;

function duelSend(msg) { try { if (CH.conn?.open) CH.conn.send(msg); } catch {} }

async function getDuelStream() {
  if (CH.stream && CH.stream.getVideoTracks().some(t => t.readyState === "live")) return CH.stream;
  CH.stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
    audio: { echoCancellation: true, noiseSuppression: true }
  });
  return CH.stream;
}

function attach(video, stream, muted) {
  if (!video || !stream) return;
  if (video.srcObject !== stream) video.srcObject = stream;
  video.muted = muted;
  video.play().catch(() => {
    // iOS may refuse unmuted playback without a tap: play muted and unmute on the next touch
    video.muted = true; video.play().catch(() => {});
    if (!muted) document.addEventListener("pointerdown", () => { video.muted = false; video.play().catch(() => {}); }, { once: true });
  });
}

function duelReset() {
  try { CH.call?.close(); } catch {}
  try { CH.conn?.close(); } catch {}
  try { CH.peer?.destroy(); } catch {}
  try { CH.stream?.getTracks().forEach(t => t.stop()); } catch {}
  Object.assign(CH, { peer: null, conn: null, call: null, stream: null, remote: null, role: null, code: "", oppName: "", oppReps: 0, connected: false, myFinal: null, oppFinal: null, wins: { me: 0, opp: 0 } });
}

function setupConn(conn) {
  CH.conn = conn;
  conn.on("open", () => {
    CH.connected = true;
    duelSend({ t: "hello", name: myName || "Recluta" });
    if (CH.role === "host") duelSend({ t: "cfg", cfg: CH.cfg });
    refreshLobby();
  });
  conn.on("data", onDuelMsg);
  conn.on("close", () => { CH.connected = false; onDuelDrop(); });
  conn.on("error", () => {});
}
function setupCall(call) {
  CH.call = call;
  call.on("stream", remote => { CH.remote = remote; refreshLobby(); if (!$("session").hidden) attach($("oppVid"), remote, false); });
  call.on("close", () => {});
}

function onDuelMsg(m) {
  if (!m || typeof m !== "object") return;
  if (m.t === "hello") { CH.oppName = String(m.name || "Amico").slice(0, 20); refreshLobby(); }
  else if (m.t === "cfg" && CH.role === "guest" && m.cfg && EX[m.cfg.ex] && DUEL_FMT[m.cfg.fmt]) { CH.cfg = m.cfg; refreshLobby(); }
  else if (m.t === "start") startDuelSession();
  else if (m.t === "reps") { CH.oppReps = Math.max(0, m.n | 0); $("oppCount").textContent = CH.oppReps; }
  else if (m.t === "final") {
    CH.oppFinal = Math.max(0, m.n | 0); CH.oppReps = CH.oppFinal; $("oppCount").textContent = CH.oppFinal;
    // in "first to N" the friend reaching the target ends the round for both
    if (S.challenge && S.running && CH.cfg.fmt === "first" && CH.oppFinal >= DUEL_FMT.first.n) endSet();
    maybeDuelResult();
  }
  else if (m.t === "lobby") { if (S.challenge && S.running) { S.challenge = true; closeSession(); } go({ name: "lobby" }); }
}

function onDuelDrop() {
  if (S.challenge && S.running) { setBanner(`${CH.oppName || "L'amico"} si è disconnesso`, "bad"); say("Il tuo avversario si è disconnesso", { urgent: true }); }
  if (CH.myFinal != null && CH.oppFinal == null) { CH.oppFinal = CH.oppReps; maybeDuelResult(); }
  refreshLobby();
}

async function duelHost() {
  const P = await loadPeer();
  CH.role = "host";
  for (let attempt = 0; attempt < 4; attempt++) {
    CH.code = newCode();
    try {
      CH.peer = await new Promise((res, rej) => {
        const p = new P(peerId(CH.code), peerOpts());
        p.on("open", () => res(p));
        p.on("error", e => rej(e));
      });
      break;
    } catch (e) { if (e?.type !== "unavailable-id") throw e; }
  }
  if (!CH.peer) throw new Error("no-id");
  CH.peer.on("connection", c => { if (CH.conn?.open) { c.on("open", () => c.close()); return; } setupConn(c); });
  CH.peer.on("call", call => { call.answer(CH.stream); setupCall(call); });
  CH.peer.on("disconnected", () => { try { CH.peer.reconnect(); } catch {} });
}

async function duelJoin(code) {
  const P = await loadPeer();
  CH.role = "guest"; CH.code = code;
  CH.peer = await new Promise((res, rej) => {
    const p = new P(peerOpts());
    p.on("open", () => res(p));
    p.on("error", e => rej(e));
  });
  CH.peer.on("error", e => { if (e?.type === "peer-unavailable") { CH.notFound = true; refreshLobby(); } });
  setupConn(CH.peer.connect(peerId(code), { reliable: true }));
  setupCall(CH.peer.call(peerId(code), CH.stream));
}

    ${host ? `<div class="order">
      <div class="label">Codice sfida</div>
      <div class="code">${CH.code}</div>
      <p class="meta">Mandagli il link: lo apre dal telefono ed entra subito.</p>
      <div class="row"><button class="btn ghost small" id="share" type="button">Invia il link</button></div>
      <p class="note" id="shareNote" hidden></p>
    </div>` : ""}
    <div class="status" id="lobStatus"><i></i><span></span></div>
    <div class="lobvids">
      <div class="lobvid"><video id="lobMe" playsinline autoplay muted></video><span>${esc(myName || "Tu")}</span></div>
      <div class="lobvid"><video id="lobOpp" playsinline autoplay></video><div class="empty" id="lobOppEmpty">In attesa della videochiamata…</div><span id="lobOppName">Amico</span></div>
    </div>
    ${CH.wins.me + CH.wins.opp > 0 ? `<p class="meta">Punteggio: ${esc(myName)} ${CH.wins.me} – ${CH.wins.opp} ${esc(CH.oppName)}</p>` : ""}
    <div class="row">
      ${host ? `<button class="btn primary" id="go" type="button" disabled>Via!</button>` : ""}
      <button class="btn ghost" id="leave" type="button">Esci dalla sfida</button>
    </div>
    ${host ? `<details class="note"><summary>Cambia esercizio o formato</summary><div class="choices" style="margin-top:8px">${DUEL_EX.map(id => `<button class="choice" type="button" data-ex="${id}" aria-pressed="${CH.cfg.ex === id}">${EX[id].name}</button>`).join("")}${Object.entries(DUEL_FMT).map(([k, f]) => `<button class="choice" type="button" data-fmt="${k}" aria-pressed="${CH.cfg.fmt === k}">${f.label}</button>`).join("")}</div></details>` : ""}
  </div>`;
  attach($("lobMe"), CH.stream, true);
  if (host) {
    $("share").onclick = async () => {
      const link = duelLink(), text = `Ti sfido a ${fmtTxt(CH.cfg)} su Istruttore Recluta! Codice ${CH.code}`;
      try { if (navigator.share) { await navigator.share({ title: "Sfida", text, url: link }); return; } } catch (e) { if (e?.name === "AbortError") return; }
      const n = $("shareNote"); n.hidden = false;
      try { await navigator.clipboard.writeText(link); n.textContent = "Link copiato: incollalo in chat al tuo amico."; }
      catch { n.textContent = link; }
    };
    $("go").onclick = () => { duelSend({ t: "start" }); startDuelSession(); };
    app.querySelectorAll("[data-ex]").forEach(b => b.onclick = () => { CH.cfg.ex = b.dataset.ex; duelSend({ t: "cfg", cfg: CH.cfg }); renderLobby(); });
    app.querySelectorAll("[data-fmt]").forEach(b => b.onclick = () => { CH.cfg.fmt = b.dataset.fmt; duelSend({ t: "cfg", cfg: CH.cfg }); renderLobby(); });
  }
  $("leave").onclick = () => { duelReset(); try { history.replaceState(null, "", location.pathname); } catch {} go({ name: "home" }); };
  refreshLobby();
}

function refreshLobby() {
  if (route.name !== "lobby" || !$("lobStatus")) return;
  const st = $("lobStatus"), host = CH.role === "host";
  let txt, cls;
  if (CH.notFound) { txt = "Sfida non trovata: controlla il codice o chiedi un nuovo link."; cls = "off"; }
  else if (!CH.connected) { txt = host ? "In attesa dell'amico…" : "Mi collego alla sfida…"; cls = ""; }
  else { txt = host ? `${CH.oppName || "L'amico"} è pronto. Dai il via!` : `Connesso con ${CH.oppName || "l'amico"}. Aspetta il via.`; cls = "on"; }
  st.className = "status " + cls; st.querySelector("span").textContent = txt;
  if (!host && CH.connected) { const lab = document.querySelector(".brief .label"); if (lab) lab.textContent = "Sfida · " + fmtTxt(CH.cfg); }
  $("lobOppName").textContent = CH.oppName || "Amico";
  if (CH.remote) { $("lobOppEmpty").hidden = true; attach($("lobOpp"), CH.remote, false); }
  const g = $("go"); if (g) g.disabled = !CH.connected;
}

async function startDuelSession() {
  if (S.running) return;
  say("", { urgent: true });
  const f = DUEL_FMT[CH.cfg.fmt];
  Object.assign(S, {
    mode: "live", queue: [{ ex: CH.cfg.ex, target: CH.cfg.fmt === "first" ? f.n : 0, timeLimit: CH.cfg.fmt === "time" ? f.n : 0, set: 1, sets: 1 }],
    idx: 0, log: [], faults: {}, startT: performance.now(), running: false, stream: CH.stream, facing: "user", lastTs: 0,
    title: "Sfida contro " + (CH.oppName || "l'amico"), challenge: true, test: null, day: null, free: false
  });
  CH.myFinal = null; CH.oppFinal = null; CH.oppReps = 0;
  $("session").hidden = false;
  $("stage").classList.add("mirror", "duel");
  $("opp").hidden = false; $("oppName").textContent = CH.oppName || "Amico"; $("oppCount").textContent = "0";
  $("flip").hidden = true; $("rest").hidden = true;
  $("loading").hidden = false; $("loadingMsg").textContent = "Carico il sistema di visione…";
  try { S.wake = await navigator.wakeLock?.request("screen"); } catch {}
  vid.srcObject = CH.stream; vid.removeAttribute("src"); vid.play().catch(() => {});
  attach($("oppVid"), CH.remote, false);
  try { await loadEngine(); } catch { $("loadingMsg").textContent = "Il sistema di visione non si è caricato. Controlla la connessione."; return; }
  $("loading").hidden = true;
  // 3-2-1 countdown on the rest panel, then the round starts
  S.inRest = true; S.running = true; loop();
  $("rest").hidden = false; $("restSkip").hidden = true;
  $("rest").querySelector(".label").textContent = "Pronti";
  $("restNext").textContent = `${EX[CH.cfg.ex].name} · ${f.label}`;
  let n = 3; $("restN").textContent = n; say("Tre", { urgent: true });
  const iv = setInterval(() => {
    n--;
    if (n > 0) { $("restN").textContent = n; say(n === 2 ? "Due" : "Uno", { urgent: true }); return; }
    clearInterval(iv);
    $("rest").hidden = true; $("restSkip").hidden = false; $("rest").querySelector(".label").textContent = "Recupero";
    beginSet();
    $("hudSet").textContent = "Sfida · " + (CH.cfg.fmt === "time" ? "60 s" : "primo a " + f.n);
    $("stop").textContent = "Mi ritiro";
  }, 1000);
}

function duelEnd() {
  const c = S.cur; if (!c || CH.myFinal != null) return;
  CH.myFinal = c.count;
  duelSend({ t: "final", n: c.count });
  S.inRest = true;
  ctx.clearRect(0, 0, cv.width, cv.height);
  $("rest").hidden = false; $("restSkip").hidden = true;
  $("rest").querySelector(".label").textContent = "Fine";
  $("restN").textContent = c.count;
  $("restNext").textContent = CH.connected ? `Aspetto il risultato di ${CH.oppName || "l'amico"}…` : "";
  if (!CH.connected) CH.oppFinal = CH.oppReps;
  // if the friend's result never arrives, settle on the last count we saw
  setTimeout(() => { if (CH.myFinal != null && CH.oppFinal == null) { CH.oppFinal = CH.oppReps; maybeDuelResult(); } }, 8000);
  maybeDuelResult();
}

function maybeDuelResult() {
  if (CH.myFinal == null || CH.oppFinal == null || route.name === "duel-result") return;
  const me = CH.myFinal, opp = CH.oppFinal;
  let outcome;
  if (CH.cfg.fmt === "first") outcome = me >= DUEL_FMT.first.n && opp < DUEL_FMT.first.n ? "win" : opp >= DUEL_FMT.first.n && me < DUEL_FMT.first.n ? "lose" : me > opp ? "win" : me < opp ? "lose" : "tie";
  else outcome = me > opp ? "win" : me < opp ? "lose" : "tie";
  if (outcome === "win") CH.wins.me++; else if (outcome === "lose") CH.wins.opp++;
  $("rest").hidden = true; $("restSkip").hidden = false; $("rest").querySelector(".label").textContent = "Recupero";
  $("opp").hidden = true; $("stage").classList.remove("duel");
  closeSession();
  S.challenge = false;
  const who = CH.oppName || "il tuo amico";
  say(outcome === "win" ? "Hai vinto! Ottimo lavoro, recluta." : outcome === "lose" ? `Ha vinto ${who}. Alla prossima, recluta.` : "Pareggio!", { urgent: true });
  go({ name: "duel-result", outcome, me, opp });
}

function renderDuelResult() {
  const r = route, host = CH.role === "host";
  const verdict = r.outcome === "win" ? "Hai vinto!" : r.outcome === "lose" ? `Ha vinto ${esc(CH.oppName || "l'amico")}` : "Pareggio";
  app.innerHTML = `
  <div class="screen">
    <header class="mast"><div><div class="sub">Sfida · ${esc(fmtTxt(CH.cfg))}</div></div><div class="callsign">Vittorie<b>${CH.wins.me}–${CH.wins.opp}</b></div></header>
    <div class="verdict">${verdict}</div>
    <div class="vs">
      <div class="${r.outcome === "win" ? "win" : ""}"><b>${r.me}</b><span>${esc(myName || "Tu")}</span></div>
      <em>VS</em>
      <div class="${r.outcome === "lose" ? "win" : ""}"><b>${r.opp}</b><span>${esc(CH.oppName || "Amico")}</span></div>
    </div>
    <p class="meta">Contano solo le ripetizioni complete e valide.</p>
    <div class="row">
      ${host ? `<button class="btn primary" id="again" type="button" ${CH.connected ? "" : "disabled"}>Rivincita</button>` : `<p class="note">${CH.connected ? `Per la rivincita aspetta ${esc(CH.oppName || "l'amico")}.` : "La connessione con l'amico si è chiusa."}</p>`}
      <button class="btn ghost" id="leave" type="button">Esci dalla sfida</button>
    </div>
  </div>`;
  if (host) $("again").onclick = () => { duelSend({ t: "lobby" }); go({ name: "lobby" }); };
  $("leave").onclick = () => { duelReset(); try { history.replaceState(null, "", location.pathname); } catch {} go({ name: "home" }); };
}

try { const code = new URLSearchParams(location.search).get("sfida"); if (SITE && code) route = { name: "duel-join", code: code.toUpperCase().slice(0, 6) }; } catch {}
render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
loadEngine().catch(() => {}); // warm up in the background
window.__test = { makeTracker, setAspect: a => (aspect = a) };
</script>

</body>
</html>
