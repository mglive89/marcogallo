<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}</style>
<title>Istruttore Recluta</title>
<meta name="theme-color" content="#12150e">
<meta name="description" content="Allenamento a corpo libero in stile militare: la fotocamera conta le ripetizioni e corregge la postura.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recluta">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Saira+Condensed:wght@500;600;700;800&family=Saira:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen field manual. Home = program card + exercise list; Session = camera fills the screen with a big rep counter and an order banner. */
:root {
  --bg: #12150e;
  --panel: #1c2116;
  --panel-2: #262d1d;
  --line: #3a4230;
  --fg: #e8e5d3;
  --muted: #a3a38a;
  --brass: #d2b85c;
  --brass-ink: #1a1606;
  --ok: #7cbf62;
  --bad: #e2603f;
  --warn: #e8b23a;
  --f-display: "Black Ops One", "Impact", "Arial Black", sans-serif;
  --f-cond: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Saira", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

.screen { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 32px; display: flex; flex-direction: column; gap: 22px; }

/* Header */
.mast { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; border-bottom: 2px solid var(--line); padding-bottom: 12px; }
.mast h1 { font-family: var(--f-display); font-weight: 400; font-size: 30px; letter-spacing: .02em; line-height: 1; color: var(--brass); }
.mast .sub { font-family: var(--f-cond); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.callsign { font-family: var(--f-cond); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-align: right; }
.callsign b { display: block; font-size: 22px; color: var(--fg); letter-spacing: .02em; font-variant-numeric: tabular-nums; }

.label { font-family: var(--f-cond); font-weight: 600; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.section { display: flex; flex-direction: column; gap: 10px; }

/* Today's order card */
.order { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
.order::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 6px; background: repeating-linear-gradient(-45deg, var(--brass) 0 10px, var(--brass-ink) 10px 20px); }
.order h2 { font-family: var(--f-cond); font-weight: 800; font-size: 24px; letter-spacing: .01em; margin-top: 4px; }
.order .meta { color: var(--muted); font-size: 14px; }
.blocks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.blocks li { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-family: var(--f-cond); font-size: 17px; font-weight: 600; }
.blocks li:last-child { border-bottom: 0; }
.blocks li span:last-child { color: var(--brass); font-variant-numeric: tabular-nums; }

.weeks { display: flex; gap: 6px; flex-wrap: wrap; }
.wk { flex: 1 1 0; min-width: 64px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font-family: var(--f-cond); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.wk.now { border-color: var(--brass); color: var(--fg); }
.dots { display: flex; gap: 4px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted); }
.dots i.done { background: var(--ok); border-color: var(--ok); }

.btn { border: 0; border-radius: 4px; padding: 14px 18px; font-family: var(--f-cond); font-weight: 700; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; }
.btn.primary { background: var(--brass); color: var(--brass-ink); }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--fg); }
.btn.small { min-height: 40px; padding: 8px 12px; font-size: 15px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 160px; }

/* Exercise list */
.exlist { display: grid; gap: 8px; }
.ex { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 12px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.ex:hover { border-color: var(--muted); }
.ex canvas, .ex svg { width: 52px; height: 52px; }
.ex b { font-family: var(--f-cond); font-size: 19px; font-weight: 700; display: block; line-height: 1.15; }
.ex small { color: var(--muted); font-size: 13px; }
.ex .go { font-family: var(--f-cond); color: var(--brass); font-size: 22px; }

.note { font-size: 13px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; }

/* Briefing */
.brief h2 { font-family: var(--f-display); font-weight: 400; font-size: 32px; color: var(--brass); line-height: 1.05; }
.brief .goal { font-family: var(--f-cond); font-size: 18px; font-weight: 600; }
.steps { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.steps li::marker { font-family: var(--f-cond); font-weight: 700; color: var(--brass); }
.faults { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.faults li { display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: baseline; font-size: 14px; }
.faults li::before { content: ""; width: 10px; height: 10px; background: var(--bad); transform: rotate(45deg); }
.camtip { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; font-size: 14px; }
.camtip svg { width: 64px; height: 48px; }
.back { align-self: flex-start; background: none; border: 0; color: var(--muted); font-family: var(--f-cond); font-size: 15px; letter-spacing: .1em; text-transform: uppercase; padding: 6px 0; }

/* Session */
#session { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; z-index: 10; }
.stage { position: relative; flex: 1 1 auto; overflow: hidden; background: #000; }
.stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.stage.mirror video, .stage.mirror canvas { transform: scaleX(-1); }
.hud-top { position: absolute; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; background: linear-gradient(rgba(0,0,0,.75), rgba(0,0,0,0)); }
.hud-ex { font-family: var(--f-cond); font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--brass); }
.hud-ex b { display: block; font-size: 22px; letter-spacing: .02em; color: #f2efe0; }
.hud-timer { font-family: var(--f-cond); font-size: 22px; font-weight: 700; color: #f2efe0; font-variant-numeric: tabular-nums; }
.counter { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; align-items: flex-end; text-shadow: 0 2px 12px rgba(0,0,0,.8); }
.counter .n { font-family: var(--f-display); font-size: 112px; line-height: .9; color: #f2efe0; font-variant-numeric: tabular-nums; }
.counter .of { font-family: var(--f-cond); font-size: 18px; font-weight: 700; letter-spacing: .1em; color: var(--brass); text-transform: uppercase; }
.counter .n.bump { animation: bump .35s ease-out; }
@keyframes bump { 0% { transform: scale(1.25); color: var(--brass); } 100% { transform: scale(1); } }
.meter { position: absolute; left: 12px; bottom: 16px; width: 14px; height: 40%; border: 2px solid rgba(242,239,224,.6); border-radius: 3px; overflow: hidden; }
.meter i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--brass); height: 0%; transition: height .08s linear; }
.meter b { position: absolute; left: -2px; right: -2px; height: 2px; background: var(--ok); }
.banner { position: absolute; left: 12px; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 74px); padding: 10px 14px; border-radius: 4px; font-family: var(--f-cond); font-weight: 700; font-size: 22px; line-height: 1.15; text-align: center; background: rgba(18,21,14,.86); border: 2px solid var(--line); color: #f2efe0; }
.banner.ok { border-color: var(--ok); }
.banner.bad { border-color: var(--bad); background: rgba(80,22,10,.88); }
.banner.warn { border-color: var(--warn); }
.loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; color: #f2efe0; background: rgba(0,0,0,.7); font-family: var(--f-cond); font-size: 18px; }
.loading .bar { width: min(260px, 70vw); height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
.loading .bar i { display: block; height: 100%; width: 30%; background: var(--brass); animation: slide 1.1s ease-in-out infinite alternate; }
@keyframes slide { from { transform: translateX(-30%); } to { transform: translateX(260%); } }
.dock { flex: 0 0 auto; background: var(--bg); padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 10px); display: flex; gap: 8px; align-items: center; }
.dock .btn { flex: 1 1 auto; }
.dock .adj { flex: 0 0 52px; padding: 0; font-size: 24px; }

.rest { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(18,21,14,.94); padding: 24px; text-align: center; }
.rest .big { font-family: var(--f-display); font-size: 96px; color: var(--brass); font-variant-numeric: tabular-nums; line-height: 1; }
.rest .next { font-family: var(--f-cond); font-size: 20px; font-weight: 600; color: var(--fg); }

/* Summary */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--f-display); font-weight: 400; font-size: 34px; font-variant-numeric: tabular-nums; line-height: 1; }
.stat span { font-family: var(--f-cond); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.log li { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.log li span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); }

.toggle { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.toggle input { width: 20px; height: 20px; accent-color: var(--brass); }

/* Duel: friend's camera picture-in-picture + lobby */
.stage .opp { position: absolute; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 70px); width: 32%; max-width: 200px; aspect-ratio: 3 / 4; border: 2px solid var(--brass); border-radius: 4px; overflow: hidden; background: #000; }
.stage .opp video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.oppTag { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; padding: 4px 8px; background: rgba(0,0,0,.7); font-family: var(--f-cond); font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #f2efe0; }
.oppTag span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.oppTag b { font-family: var(--f-display); font-weight: 400; font-size: 30px; line-height: 1; color: var(--brass); font-variant-numeric: tabular-nums; }
.duel .banner { right: calc(min(32%, 200px) + 24px); font-size: 18px; }
.duel .counter .of { color: var(--ok); }
.code { font-family: var(--f-display); font-size: 44px; letter-spacing: .12em; color: var(--brass); line-height: 1; font-variant-numeric: tabular-nums; }
.lobvids { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.lobvid { position: relative; aspect-ratio: 3 / 4; background: #000; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.lobvid video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.lobvid span { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 8px; background: rgba(0,0,0,.65); font-family: var(--f-cond); font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: #f2efe0; }
.lobvid .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 12px; text-align: center; color: var(--muted); font-size: 13px; }
.status { display: flex; align-items: center; gap: 10px; font-family: var(--f-cond); font-size: 18px; font-weight: 600; }
.status i { width: 12px; height: 12px; border-radius: 50%; background: var(--warn); flex: 0 0 auto; }
.status.on i { background: var(--ok); }
.status.off i { background: var(--bad); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field input { font: inherit; font-size: 18px; padding: 12px; border-radius: 4px; border: 1.5px solid var(--line); background: var(--panel); color: var(--fg); min-width: 0; }
.field select, .field textarea { font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 4px; border: 1.5px solid var(--line); background: var(--panel); color: var(--fg); min-width: 0; width: 100%; }
.field textarea { resize: vertical; line-height: 1.4; }
.field input[type="range"] { padding: 0; border: 0; background: none; accent-color: var(--brass); height: 32px; }
.field input:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.choice { background: var(--panel); border: 1.5px solid var(--line); border-radius: 6px; padding: 10px 12px; text-align: left; font-family: var(--f-cond); font-size: 17px; font-weight: 700; }
.choice small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 12px; color: var(--muted); }
.choice[aria-pressed="true"] { border-color: var(--brass); background: var(--panel-2); }
.verdict { font-family: var(--f-display); font-weight: 400; font-size: 40px; line-height: 1.05; color: var(--brass); }
.vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; text-align: center; }
.vs div { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 8px; display: flex; flex-direction: column; gap: 4px; }
.vs div.win { border-color: var(--brass); }
.vs b { font-family: var(--f-display); font-weight: 400; font-size: 48px; line-height: 1; font-variant-numeric: tabular-nums; }
.vs span { font-family: var(--f-cond); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vs em { font-family: var(--f-display); font-style: normal; color: var(--muted); }
/* Ranks, points, leaderboard */
.rk { display: inline-flex; align-items: center; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--brass); color: var(--brass); font-family: var(--f-cond); font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; vertical-align: middle; white-space: nowrap; }
.rk.gold { background: linear-gradient(135deg, #f3d36b, #b8902a); color: #1a1406; border-color: #f3d36b; }
.rankcard { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: end; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; }
.rankcard .rname { font-family: var(--f-cond); font-weight: 800; font-size: 22px; line-height: 1.1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rankcard .pts { font-family: var(--f-display); font-size: 28px; color: var(--brass); font-variant-numeric: tabular-nums; text-align: right; line-height: 1; }
.rankcard .pts small { display: block; font-family: var(--f-cond); font-size: 11px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; margin-top: 4px; }
.xp { grid-column: 1 / -1; height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.xp i { display: block; height: 100%; background: var(--brass); }
.rankcard .meta { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
.ex.locked { opacity: .55; }
.ex.locked .go { color: var(--muted); }
.ex .go svg { width: 20px; height: 20px; }
.lb { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.lb li { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
.lb li.podium .pos { color: var(--brass); }
.lb li.me { border-color: var(--brass); }
.lb .pos { font-family: var(--f-display); font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lb .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--f-cond); font-weight: 700; font-size: 17px; }
.lb .pts { font-family: var(--f-cond); font-weight: 700; font-size: 18px; color: var(--brass); font-variant-numeric: tabular-nums; }
.lb .lbmsg { display: block; color: var(--muted); font-size: 14px; }
.elite .ex { border-style: dashed; }
body.goldtheme { --brass: #e9c24a; }
@media (prefers-reduced-motion: reduce) { .counter .n.bump, .loading .bar i { animation: none; } }
</style>

</head>
<body>
<main id="app"></main>

<section id="session" hidden>
  <div class="stage mirror" id="stage">
    <video id="vid" playsinline muted></video>
    <canvas id="cv"></canvas>
    <div class="hud-top">
      <div class="hud-ex"><span id="hudSet">Serie</span><b id="hudName">Esercizio</b></div>
      <div class="hud-timer" id="hudTimer">00:00</div>
    </div>
    <div class="banner" id="banner">Mettiti in posizione</div>
    <div class="meter" id="meter"><i id="meterFill"></i><b id="meterMark"></b></div>
    <div class="opp" id="opp" hidden><video id="oppVid" playsinline autoplay></video><div class="oppTag"><span id="oppName">Amico</span><b id="oppCount">0</b></div></div>
    <div class="counter"><div class="n" id="count">0</div><div class="of" id="countOf">ripetizioni</div></div>
    <div class="loading" id="loading"><div id="loadingMsg">Carico il sistema di visione…</div><div class="bar"><i></i></div></div>
    <div class="rest" id="rest" hidden>
      <div class="label">Recupero</div>
      <div class="big" id="restN">60</div>
      <div class="next" id="restNext"></div>
      <button class="btn primary" id="restSkip" type="button">Salta recupero</button>
    </div>
  </div>
  <div class="dock">
    <button class="btn ghost adj" id="minus" type="button" aria-label="Togli una ripetizione">−</button>
    <button class="btn ghost adj" id="plus" type="button" aria-label="Aggiungi una ripetizione">+</button>
    <button class="btn ghost small" id="flip" type="button">Camera</button>
    <button class="btn primary small" id="stop" type="button">Fine serie</button>
  </div>
</section>

<input type="file" id="fileIn" accept="video/*" capture="user" hidden>

<script type="module">
const EX = {
  squat: {
    name: "Squat",
    unit: "reps",
    tag: "Gambe e glutei",
    cam: "Telefono a terra, di lato, a circa 2\u20133 metri. Devi vedere testa e piedi.",
    steps: [
      "Piedi alla larghezza delle spalle, punte leggermente in fuori.",
      "Spingi il bacino indietro e scendi piegando le ginocchia, petto alto.",
      "Scendi finch\xE9 le cosce sono parallele al suolo.",
      "Risali spingendo sui talloni fino a gambe distese."
    ],
    faults: ["Non scendi abbastanza (la ripetizione non conta)", "Busto troppo inclinato in avanti", "Gambe non distese in cima"]
  },
  pushup: {
    name: "Piegamenti",
    unit: "reps",
    tag: "Petto, spalle, tricipiti",
    cam: "Telefono a terra, di lato, a circa 2 metri, all'altezza del pavimento.",
    steps: [
      "Mani sotto le spalle, corpo dritto dalla testa ai talloni.",
      "Contrai addome e glutei: il bacino non deve cedere.",
      "Scendi finch\xE9 i gomiti sono piegati a 90\xB0 o meno.",
      "Spingi fino a braccia distese."
    ],
    faults: ["Bacino che cede verso il basso", "Bacino troppo alto", "Gomiti non piegati a 90\xB0 (non conta)"]
  },
  situp: {
