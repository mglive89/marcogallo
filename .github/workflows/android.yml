name: App Android (prova)

on:
  push:
    branches: [app]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Sito pubblicato (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepara l'app
        run: |
          npm ci
          node scripts/make-www.mjs site
          npx cap sync android

      - name: Compila l'APK di prova
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Nome del file
        run: |
          V=$(grep -o 'APP_VER = "[^"]*"' www/index.html | cut -d'"' -f2)
          cp android/app/build/outputs/apk/debug/app-debug.apk "FitQuest-${V:-app}-prova.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FitQuest-android-prova
          path: FitQuest-*-prova.apk
          retention-days: 30

      - name: Salva l'APK nel ramo app-apk
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          git init -q -b app-apk apk-out
          cp FitQuest-*-prova.apk apk-out/
          cd apk-out
          git config user.name "fitquest-ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -q -m "APK ${GITHUB_SHA::7}"
          git push -q -f "$REPO_URL" app-apk

      - name: Abilita l'emulatore (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prova su emulatore Android
        timeout-minutes: 25
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.mglive89.fitquest android.permission.CAMERA
            adb shell pm grant com.mglive89.fitquest android.permission.RECORD_AUDIO
            mkdir -p emu-shots
            adb shell am start -n com.mglive89.fitquest/.MainActivity
            sleep 30
            adb forward tcp:9222 localabstract:webview_devtools_remote_$(adb shell pidof com.mglive89.fitquest | tr -d '\r')
            timeout 420 node scripts/emu-check.mjs > emu-shots/console.txt 2>&1 || echo "emu-check uscito con $?" >> emu-shots/console.txt
            adb exec-out screencap -p > emu-shots/00-telefono.png || true
            adb logcat -d | grep -iE "Capacitor|chromium|AndroidRuntime|FATAL" | tail -300 > emu-shots/logcat.txt || true

      - name: Salva i risultati della prova nel ramo app-prove
        if: always()
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          mkdir -p emu-shots
          if git clone -q --depth 1 -b app-prove "$REPO_URL" prove 2>/dev/null; then :; else
            git init -q -b app-prove prove; git -C prove remote add origin "$REPO_URL"; fi
          find prove -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r emu-shots/. prove/
          cd prove
          git config user.name "fitquest-ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -q -m "Prova emulatore ${GITHUB_SHA::7}" || exit 0
          git push -q origin app-prove

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FitQuest-prova-emulatore
          path: emu-shots/
          retention-days: 14
