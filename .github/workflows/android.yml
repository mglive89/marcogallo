name: App Android (prova)

on:
  push:
    branches: [app]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Sito pubblicato (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepara l'app
        run: |
          npm ci
          node scripts/make-www.mjs site
          npx cap sync android

      - name: Compila l'APK di prova
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Nome del file
        run: |
          V=$(grep -o 'APP_VER = "[^"]*"' www/index.html | cut -d'"' -f2)
          cp android/app/build/outputs/apk/debug/app-debug.apk "FitQuest-${V:-app}-prova.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FitQuest-android-prova
          path: FitQuest-*-prova.apk
          retention-days: 30

      - name: Abilita l'emulatore (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prova su emulatore Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.mglive89.fitquest android.permission.CAMERA
            adb shell pm grant com.mglive89.fitquest android.permission.RECORD_AUDIO
            adb shell am start -n com.mglive89.fitquest/.MainActivity
            sleep 25
            adb forward tcp:9222 localabstract:webview_devtools_remote_$(adb shell pidof com.mglive89.fitquest | tr -d '\r')
            node scripts/emu-check.mjs || true
            adb exec-out screencap -p > emu-shots/00-telefono.png || true
            adb logcat -d | grep -iE "Capacitor|chromium|AndroidRuntime|FATAL" | tail -300 > emu-shots/logcat.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FitQuest-prova-emulatore
          path: emu-shots/
          retention-days: 14
